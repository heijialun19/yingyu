<script>
/* ============================================================
   Power Up 适配层（2026-11-22）
   ------------------------------------------------------------
   页面交互沿用「人教课本」那一套（换册 → 单元 → 知识点 → 学习 → 拼词），
   但数据、进度、发音口径全部换成 Power Up：
     · 进度单独存 Store.d.pu，不和人教混；
     · 词图一律回词库取（原包的 emoji 有 327 个占位 🐦）；
     · 音标用站内美式（与单词镇、Get Smart 一致，和站内音频对应）。
   ============================================================ */
const PU_LEVEL_EMOJI = ['🐣','🐥','🦉','🦊','🐬','🦅'];
POWERUP_LEVELS.forEach((lv, i) => { lv.emoji = PU_LEVEL_EMOJI[i] || '📘'; lv.tag = '剑桥'; });
let __puBank = null;
function puBank(w) {
  if (!__puBank) {
    __puBank = {};
    try {
      GRADES.forEach(g => g.themes.forEach(t => t.words.forEach(x => {
        const k = String(x.w || '').toLowerCase();
        if (k && !__puBank[k]) __puBank[k] = x;
      })));
    } catch (e) {}
  }
  return __puBank[String(w == null ? '' : w).toLowerCase()] || null;
}
function puPointsOf(uid) {
  for (const lv of POWERUP_LEVELS) {
    if (lv.units.some(u => u.id === uid)) return ((POWERUP_POINTS[lv.id] || {})[uid]) || [];
  }
  return [];
}
function puUnitDone(uid) { puEnsurePage(); return !!Store.d.pu.done[uid]; }
function puLevelProgress(lv) {
  puEnsurePage();
  return lv.units.filter(u => Store.d.pu.done[u.id]).length + ' / ' + lv.units.length;
}
function puActiveLevelId() {
  puEnsurePage();
  return POWERUP_LEVELS.some(l => l.id === Store.d.pu.lv) ? Store.d.pu.lv : 'pu1';
}
function puSetActiveLevel(id) { puEnsurePage(); Store.d.pu.lv = id; Store.save(); }
function puIconOf(w) {
  const b = puBank(w && w.w);
  if (b) return wordIcon({ w: w.w, zh: w.zh, e: b.e || '' });
  return wordIcon(w);
}
function puIpaOf(w) { return (typeof ipaOf === 'function') ? ipaOf(w && w.w) : ''; }
function puPosKey(w) { const b = puBank(w && w.w); return (b && b.pos) || ''; }
function puMemOf(w) { const b = puBank(w && w.w); return (b && b.dec) || ''; }
function puMarkDone(uid, pct, stars) {
  puEnsurePage();
  const old = Store.d.pu.done[uid] || {};
  Store.d.pu.done[uid] = {
    t: Date.now(),
    stars: Math.max(stars || 0, old.stars || 0),
    pct: Math.max(pct || 0, old.pct || 0)
  };
  Store.save();
}

renderNav('powerup'); renderDecor();

/* 页面级工具（与 getsmart.html 同款） */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
function puEnsurePage() { if (!Store.d.pu) Store.d.pu = { lv: 'pu1', done: {}, ed: 'v2' }; if (!Store.d.pu.done) Store.d.pu.done = {}; if (Store.d.pu.ed !== 'v1') Store.d.pu.ed = 'v2'; }
puEnsurePage();

/* ---------- 教材版本（2026-11-22）：第二版（2025 Map of the book）/ 第一版 ----------
   两版单元名、语法、词表完全一致；差异只在 Mission 任务措辞与个别 Literature / 社会情感标题。
   数据字段：m1 / lit1 / sel1 = 第一版；m2 / lit / sel = 第二版（无差异时只写第二版值）。
   L4-L6 尚未按官方目录对齐（两版暂无差异），页面已标注。 */
function puEd() { puEnsurePage(); return Store.d.pu.ed === 'v1' ? 'v1' : 'v2'; }
function puSetEd(ed) {
  puEnsurePage();
  const next = (ed === 'v1') ? 'v1' : 'v2';
  if (Store.d.pu.ed === next) return;
  Store.d.pu.ed = next; Store.save(); sfx.pop();

    if (!lv) return null;

    lv.units.forEach(u => (u.words || []).forEach(w => { if (!seen[w.w]) { seen[w.w] = 1; words.push(w); } }));
    return { id: uid, kind: 'all', title: lv.name + ' · 整册拼词', zh: '全册单词混合', words: shuffle(words), lv };
  }

  const icon = puIconOf(w);
  const word = String(w.w || '').toLowerCase().replace(/[^a-z]/g, '');
  if (puPosKey(w) === 'num' || (word.length >= 3 && icon.toLowerCase().includes(word))) {

  if (SP.curWord !== cur.w) {

  const targetLower = new Set(blocks.map(b => b.toLowerCase()));
  Array.from(pool).forEach(b => { if (targetLower.has(b.toLowerCase())) pool.delete(b); });
  const distract = shuffle(Array.from(pool)).slice(0, Math.min(3, Math.max(1, 5 - Math.min(4, blocks.length))));
  SP.tiles = shuffle(blocks.concat(distract));
  SP.filled = [];
  SP.used = new Array(SP.tiles.length).fill(false);
  SP.blocks = blocks; // 目标切分：格数 = 块数（不是字母数！）
  /* ★ 2026-11-09.10：课本词表里有大量单词镇没收录的词（hard-working、police officer…），
     音标只在 PEP_IPA 里。原来这里只调 ipaOf，这些词的音标位一直是空的。
     优先用 puIpaOf（它会先查 PEP_IPA 再回退 ipaOf），两套表都不命中才留空。 */
  const ipa = (typeof puIpaOf === 'function') ? puIpaOf(cur.w) : ipaOf(cur.w);
  /* 短语词的分段指示：已拼段划掉、当前段高亮 */
  /* ⛔ 当前段与未到的段绝不能印出字母：以前这里把正在拼的那一段用红色粗体
     原样显示（hard · **working**），孩子照着上面抄就能拼对，等于白送答案。
     现在只把「已经拼出来的段」显示出来（那是孩子自己拼对的），
     当前段用固定 4 个下划线占位（不按字母数，避免泄露长度），未到段用省略号。 */
  const partTip = SP.parts.length > 1
    ? `<div style="text-align:center;margin:2px 0 0;font-size:.92rem">${SP.parts.map((p, i) =>
        i < SP.partIdx ? `<s style="color:#4E9E59">${esc(p)}</s>` :
        i === SP.partIdx ? `<b style="color:#FF6B6B;letter-spacing:1px" aria-label="正在拼这一段">▁▁▁▁</b>` :
        `<span style="color:#9CA3AF">……</span>`).join('<span style="color:#D5DAE6;margin:0 6px">·</span>')}</div>`
    : '';
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="spellQuit()">← 退出拼词</button>
    <div class="card" style="max-width:560px;margin:0 auto">
      <div class="score-bar"><b>🚂 拼词小火车 · ${esc(curUnit.title)}</b><span>第 ${S.qIdx + 1} / ${S.list.length} 词</span></div>
      <div class="spell-progress"><i style="width:${Math.round(S.qIdx / S.list.length * 100)}%"></i></div>
      <div class="spell-stage">
        <div class="sp-ic">${safeIc}</div>
        <div class="sp-zh">${esc(cur.zh)}</div>
        <div style="color:#4A5162;font-size:.95rem;min-height:1.3em">${ipa ? esc(ipa) : ''}</div>
        <button class="btn ghost sp-speaker" onclick="speakWord('${jsq(cur.w)}')">🔊 再听一遍</button>
      </div>
      <p style="text-align:center;color:#4A5162;font-size:.82rem;margin:2px 0 0">${isMystery ? '听发音' : '看图听音'}，点字母块拼出${SP.parts.length > 1 ? '每个词' : '单词'}</p>
      ${partTip}
      <div class="spell-slots" id="slots">${blocks.map(() => '<div class="slot"><span class="hint"></span></div>').join('')}</div>
      <div class="spell-tiles" id="tiles">${SP.tiles.map((b, i) => `<button class="tile" id="tile${i}" onclick="pickTile(${i})">${esc(b)}</button>`).join('')}</div>
      <div class="spell-tip" id="spellTip"></div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn ghost" onclick="spellSkip()">跳过这个词</button>
      </div>
    </div>`;
  const tk = __token;
  /* 第一段读整词，后续段只读当前段（孩子知道在拼哪个词） */
  setTimeout(() => { if (tk === __token) (SP.partIdx === 0 ? speakWord(cur.w) : speakBlock(part)); }, 350);
}
function pickTile(i) {
  if (SP.used[i]) return;
  const cur = S.list[S.qIdx];
  const n = SP.blocks.length; // 目标是块序列，不是字母序列
  if (SP.filled.length >= n) return;
  SP.filled.push(i); SP.used[i] = true;
  document.getElementById('tile' + i).classList.add('used');
  drawSlots();
  if (SP.filled.length === n) setTimeout(checkSpell, 250);
}
function undoSlot() {
  const i = SP.filled.pop();
  if (i === undefined) return;
  SP.used[i] = false;
  const t = document.getElementById('tile' + i); if (t) t.classList.remove('used');
  drawSlots();
}
function drawSlots() {
  const cur = S.list[S.qIdx];
  const target = cur.w.toLowerCase().replace(/[^a-z]/g, '');
  const slots = document.querySelectorAll('#slots .slot');
  slots.forEach((el, k) => {
    if (k < SP.filled.length) { el.className = 'slot filled'; el.innerHTML = esc(SP.tiles[SP.filled[k]]); el.onclick = undoSlot; }
    else { el.className = 'slot'; el.innerHTML = '<span class="hint"></span>'; el.onclick = null; }
  });
}
function checkSpell() {
  const cur = S.list[S.qIdx];
  const target = SP.blocks.join('');
  const got = SP.filled.map(i => SP.tiles[i]).join('');
  if (got === target) {
    sfx.correct(); flyStar(document.querySelector('.spell-stage'));
    document.querySelectorAll('#slots .slot').forEach(el => el.className = 'slot ok');
    /* 短语词还有下一段：先拼下一段，整词全部拼完才算完成 */
    if (SP.partIdx < SP.parts.length - 1) {
      document.getElementById('spellTip').innerHTML = '✅ <b>' + esc(SP.parts[SP.partIdx]) + '</b> 拼对啦！继续～';
      SP.partIdx++;
      const tk = __token;
      setTimeout(() => { if (tk === __token) renderSpell(); }, 1100);
      return;
    }
    const firstTry = !S.tries[cur.w];
    if (firstTry) {
      S.ok.push(cur); addStars(1);
      /* ★ 与 Get Smart 一致：拼对首答写回 Store.d.words，
         这样 Power Up 学的词会进入单词镇的艾宾浩斯复习与我的词单。
         拼错不扣盒子（拼写比认词难，双重惩罚会让复习计划失真）。 */
      try { if (typeof touchWord === 'function') touchWord(cur.w, true); } catch (e) {}
    }
    /* ★ 2026-11-21.1（复检 L2）：错了几次才拼对的词，原来既算「正确」又进不了
       「重拼错词」——两边都占，自相矛盾。现在只进 bad，正确率按「一次拼对」算。 */
    else if (!S.bad.includes(cur) && !S.ok.includes(cur)) S.bad.push(cur);
    document.getElementById('spellTip').innerHTML = '✅ <b>' + esc(cur.w) + '</b> 拼对啦！';
    const tk = __token;
    setTimeout(() => { if (tk === __token) spellNext(); }, 1200);
  } else {
    S.tries[cur.w] = (S.tries[cur.w] || 0) + 1;
    sfx.wrong();
    document.querySelectorAll('#slots .slot').forEach(el => { if (el.className.includes('filled')) { el.className = 'slot bad'; } });
    const tip = document.getElementById('spellTip');
    tip.innerHTML = S.tries[cur.w] >= 2 ? '💡 提示：下一个该选的块在闪哦' : '再试一次，慢慢想～';
    const tk = __token;
    setTimeout(() => {
      if (tk !== __token) return;
      /* 清空重来 */
      SP.used = SP.used.map(() => false);
      SP.filled = [];
      renderTilesReset();
      drawSlots();
      if (S.tries[cur.w] >= 2) glintHint(target);
    }, 600);
  }
}
function renderTilesReset() {
  SP.tiles.forEach((b, i) => { const t = document.getElementById('tile' + i); if (t) { t.classList.remove('used'); } });
}
function glintHint(target) {
  /* 高亮：下一个该填的块（当前段的块序列） */
  const need = SP.blocks[SP.filled.length];
  if (!need) return;
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => { if (!t.classList.contains('used') && t.textContent === need) t.classList.add('glint'); });
}
function spellNext() {
  S.qIdx++;
  if (S.qIdx >= S.list.length) return spellFinish();
  renderSpell();
}
function spellSkip() {
  const cur = S.list[S.qIdx];
  if (!S.bad.includes(cur) && !S.ok.includes(cur)) S.bad.push(cur);
  toast('没关系，这个词待会儿再练！');
  spellNext();
}
function spellQuit() { stopAllSpeech(); renderLevelHome(); }
function spellFinish() {
  const u = curUnit;
  const total = S.list.length;
  const okN = S.ok.length, badN = S.bad.length;
  const pct = Math.round(okN / total * 100);
  const stars = pct === 100 ? 5 : pct >= 80 ? 3 : pct >= 60 ? 2 : 1;
  addStars(stars);
  puMarkDone(u.id, pct, stars);
  confetti(); sfx.win();
  try { if (typeof completeDailyTask === 'function') completeDailyTask('words'); } catch (e) {}
  const rows = S.list.map(w => {
    const good = S.ok.includes(w);
    return `<div class="res-row">
      <div class="ri">${puIconOf(w)}</div><b lang="en">${esc(w.w)}</b>
      <span class="rw">${esc(w.zh)}</span>
      <span class="rk">${good ? '✅' : '❌'}</span>
    </div>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="card" style="max-width:560px;margin:0 auto;text-align:center;padding:24px 18px">
      <div style="font-size:56px">${pct === 100 ? '🏆' : pct >= 60 ? '🎉' : '💪'}</div>
      <h2 style="justify-content:center">${pct === 100 ? '全部拼对，太棒了！' : '拼词完成！'}</h2>
      <div class="res-nums">
        <div><b class="g">${okN}</b><small>一次拼对</small></div>
        <div><b class="o">${badN}</b><small>还需练习</small></div>
        <div><b class="p">${pct}%</b><small>正确率</small></div>
      </div>
      <p style="color:#4A5162;font-size:.85rem">奖励 +${stars} ⭐ · 每一次练习，都让单词更熟悉</p>
    </div>
    <div class="card res-list" style="max-width:560px;margin:10px auto">
      <b>这次的单词</b>
      ${rows}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        ${badN ? `<button class="btn coral big" onclick="startSpellWrong()">🔁 重拼错词（${badN} 个）</button>` : ''}
        <button class="btn grape big" onclick="startSpell('${u.id}')">🔄 再拼一遍</button>
        <button class="btn ghost big" onclick="renderLevelHome()">🏠 回单元列表</button>
      </div>
      
    </div>`;
}
function startSpellWrong() {
  const wrong = S.bad.slice();
  if (!wrong.length) return;
  S = { qIdx: 0, list: shuffle(wrong), ok: [], bad: [], tries: {}, hinted: {} };
  renderSpell();
}

/* ---------- 启动 ---------- */
(function init() {
  const params = new URLSearchParams(location.search);
  /* 深链：?points=pu1-u1 直达某单元知识点（单词镇课本区块跳过来用） */
  const pid = params.get('points');
  if (pid && findUnit(pid)) {
    const un = findUnit(pid);
    puSetActiveLevel(un.lv.id);
    renderPoints(pid);
    return;
  }
  /* ★ 2026-11-08：刷新后回到原来的册 / 单元，不再弹回换册页。
     知识点页能原样恢复；逐词学习、拼词不恢复答题进度（题目和答案绝不落盘），
     只回到同一册的单元列表。只认 reload，从首页正常点进来不受影响。 */
  try {
    if (window.__isReload && window.__isReload()) {
      const snap = window.__navLoad && window.__navLoad('pu', 30 * 60 * 1000);
      if (snap) {
        const un = snap.u ? findUnit(snap.u) : null;
        if (un) {
          puSetActiveLevel(un.lv.id);
          if (snap.view === 'points') { renderPoints(snap.u); toast('↩️ 已回到刚才的知识点'); return; }
          renderLevelHome(); toast('↩️ 已回到刚才那一册'); return;
        }
        if (snap.lv && POWERUP_LEVELS.some(l => l.id === snap.lv)) {
          puSetActiveLevel(snap.lv); renderLevelHome(); return;
        }
      }
    }
  } catch (e) {}
  /* 首次进入先看到 6 册书架（要选教材）；已经有单元进度时才直接回到上次那一册 */
  const hasProgress = Store.d.pu && Store.d.pu.done && Object.keys(Store.d.pu.done).length > 0;
  const lv = hasProgress ? POWERUP_LEVELS.find(l => l.id === puActiveLevelId()) : null;
  if (lv) { curLevel = lv; renderLevelHome(); } else renderLevels();
})();
</script>
