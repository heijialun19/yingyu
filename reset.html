<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>正在恢复页面显示…</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{font-size:18px}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,sans-serif;background:#EAF5FF;color:#2D3142;padding:24px}
.box{background:#fff;border-radius:20px;padding:30px 26px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 8px 28px rgba(45,49,66,.12)}
h1{font-size:1.5rem;margin:0 0 12px}
p{font-size:1rem;line-height:1.7;margin:10px 0;color:#3F4658}
.btn{display:inline-block;margin-top:18px;padding:12px 26px;border:0;border-radius:14px;
  background:#3FB3EA;color:#fff;font-size:1.05rem;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>🔄 正在恢复显示</h1>
  <p>如果这个页面上的字看起来正常大小，说明缩放已复位。</p>
  <p id="info" style="font-size:.85rem;color:#8A93A6"></p>
  <a class="btn" href="index.html">回到首页</a>
</div>
<script>
/* 强制重置 per-origin 缩放：重写 viewport meta 触发浏览器重新布局 */
(function(){
  var m = document.querySelector('meta[name="viewport"]');
  var v = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  if (!m) { m = document.createElement('meta'); m.name='viewport'; document.head.appendChild(m); }
  m.setAttribute('content', v);
  // 部分浏览器需下一帧再写一次
  requestAnimationFrame(function(){
    m.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
    var d = document.getElementById('info');
    if (d) d.textContent = '视口宽度 ' + window.innerWidth + 'px · 缩放 ' +
      ((window.visualViewport && window.visualViewport.scale) || 1).toFixed(2);
  });
})();
</script>
</body>
</html>
