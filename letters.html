<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字母岛 · 小鸟英语乐园</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<main>
  <div class="page-title">
    <h1>🏝️ 字母岛 · 26 位字母朋友</h1>
    <p>字母像画画一样，每个都有小故事——<b style="color:#FF6B6B">红色</b>是会唱歌的元音宝宝，<b style="color:#4EC5F1">蓝色</b>是有含义的辅音朋友</p>
  </div>

  <!-- 字母选格 -->
  <section class="section">
    <div class="card">
      <h2>👀 点一个字母，认识它</h2>
      <div class="letter-grid" id="letterGrid" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 字母详情 -->
  <section class="section">
    <div class="letter-stage" id="letterStage"></div>
  </section>
<div style=text-align:center;margin-top:20px;font-size:.75rem><a href=disclaimer.html style=color:#78909C>📋 免责声明 · 隐私政策 · 使用条款</a></div></main>

<script src="js/words-data.js?v=13"></script>
<script src="js/data.js?v=13"></script>
<script src="js/app.js?v=13"></script>
<script>
renderNav('letters'); renderDecor();

let cur = 0;
let q1ok = false, q2ok = false;

/* ---------------- 字母选格 ---------------- */
function renderGrid() {
  $('#letterGrid').innerHTML = LETTERS.map((l, i) => {
    const learned = !!Store.d.letters[l.L];
    return `<button class="letter-card ${l.v ? 'vowel' : ''} ${i === cur ? 'active' : ''}" onclick="pick(${i})">
      ${learned ? '<span class="mark">⭐</span>' : ''}
      <span class="big">${l.L}</span><span class="sm">${l.L.toLowerCase()} · ${l.short || l.shape}</span>
    </button>`;
  }).join('');
}

function pick(i) { cur = i; q1ok = q2ok = false; renderGrid(); renderStage(true); window.scrollTo({ top: $('#letterStage').offsetTop - 90, behavior: 'smooth' }); }

/* ---------------- 详情舞台 ---------------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderStage(speakIt) {
  const l = LETTERS[cur];
  const learned = !!Store.d.letters[l.L];
  const type = l.v ? '会唱歌的元音宝宝' : '有含义的辅音朋友';

  /* 小练习题目：正确项一定以该字母开头；干扰项一律不以该字母开头 */
  const lower = l.L.toLowerCase();
  const rightWord = l.words[0];
  const pool = [];
  LETTERS.forEach(x => { if (x.L !== l.L) x.words.forEach(wd => pool.push(wd)); });
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const seen = new Set([rightWord.w.toLowerCase()]);
  const otherWords = [];
  for (const cand of pool) {
    if (otherWords.length >= 3) break;
    const key = cand.w.toLowerCase();
    if (!seen.has(key) && !key.startsWith(lower)) { seen.add(key); otherWords.push(Object.assign({}, cand, { right: false })); }
  }
  const q1opts = shuffle([Object.assign({}, rightWord, { right: true }), ...otherWords]);
  const q2opts = shuffle([
    { s: l.shape, right: true },
    ...shuffle(LETTERS.filter(x => x.L !== l.L && x.shape !== l.shape)).slice(0, 3).map(x => ({ s: x.shape, right: false }))
  ]);

  $('#letterStage').innerHTML = `
    <div class="letter-hero bounce-in" style="background:${l.color}">
      <button class="speak-btn" onclick="sayChant()" title="听拼读口诀">🎵</button>
      <div class="glyph">${l.L}<small> ${l.L.toLowerCase()}</small></div>
      <div class="shape">${l.emoji} ${l.shape}</div>
      <div style="margin-top:6px;font-size:.8rem;opacity:.95">${type}</div>
      <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="sayName()" title="播放字母的名字，如 A 读 'ay'">🔤 字母名 ${l.L}</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="saySound()" title="慢速播放代表词，听清 ${l.L} 在开头的读音">📢 字母音（听${l.words[0].w}）</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="sayChant()" title="完整三遍：名字 + 慢词 + 常速词">🎵 完整口诀</button>
      </div>
      <div style="margin-top:10px">
        <button class="btn ghost" style="padding:8px 18px;font-size:.85rem" onclick="prevL()">◀ 上一个</button>
        <button class="btn ghost" style="padding:8px 18px;font-size:.85rem" onclick="nextL()">下一个 ▶</button>
      </div>
    </div>

    <div>
      <div class="story-box">
        <h3>📖 ${l.L} 的故事：${l.shape}</h3>
        <p style="margin:0;line-height:1.9;font-size:.95rem">${l.story}</p>
        <div style="margin-top:10px;background:#fff;border-radius:14px;padding:8px 12px;font-size:.85rem;line-height:1.8">
          🎵 拼读小口诀：<b>${l.L} 的名字读 "${l.L}"</b>，
          它在单词里发 <b>${l.szh}</b> 的音——
          听听 <b>${l.words[0].w}</b> ${l.words[0].e} 开头的那个音！
          <span style="color:#5C6273;display:block;margin-top:4px">（点上方「📢 字母音」慢速听，点「🎵 完整口诀」听三遍）</span>
        </div>
      </div>
      ${l.py ? `<div class="py-note">🌉 <b>拼音小桥梁：</b>${l.py}</div>` : ''}

      <div class="word-mini-row">
        ${l.words.map(w => `
          <div class="word-mini" onclick="sayWord(this,'${w.w}')" title="点我三读：标准 → 慢速拼读 → 标准">
            <div class="we">${w.e}</div>
            <b>${w.w}</b><span>${w.zh}</span>
            ${w.dec ? `<div class="dec">🔎 ${w.dec}</div>` : ''}
          </div>`).join('')}
      </div>

      <div class="card quiz-area" style="margin-top:16px">
        <h2>🎯 小练习（答对得星星）</h2>
        <div class="quiz-q">1️⃣ 听一听、看一看：哪个单词是 ${l.L} 开头的？</div>
        <div class="opt-row" id="q1row">
          ${q1opts.map(o => `<button class="opt" onclick="q1(this,'${String(o.w).replace(/'/g, "\\'")}',${o.right})"><span class="oe">${o.e}</span>${o.w}</button>`).join('')}
        </div>
        <div class="quiz-q" style="margin-top:16px">2️⃣ ${l.L}${l.L.toLowerCase()} 的象形朋友是谁？</div>
        <div class="opt-row" id="q2row">
          ${q2opts.map(o => `<button class="opt" onclick="q2(this,${o.right})">${o.s}</button>`).join('')}
        </div>
        <div class="explain" id="quizExplain"></div>
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center">
        <button class="btn mint big" id="learnBtn" onclick="learnNow(this)">${learned ? '✅ 已经学会啦（再练练）' : '🌟 我学会这个字母啦！'}</button>
        ${cur < LETTERS.length - 1 ? `<button class="btn orange big" onclick="nextAfterLearn()">下一个字母 ▶</button>` : `<button class="btn orange big" onclick="location.href='words.html'">去单词镇 →</button>`}
      </div>

      <div class="card" style="margin-top:16px;border-color:var(--lemon)">
        <h2>✏️ 写一写</h2>
        <div style="display:flex;gap:8px;margin-bottom:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn ${traceCase === 'upper' ? 'mint' : 'ghost'}" style="padding:6px 16px;font-size:.85rem" id="btnUpper" onclick="traceCase='upper';initTrace()">${l.L} 大写</button>
          <button class="btn ${traceCase === 'lower' ? 'mint' : 'ghost'}" style="padding:6px 16px;font-size:.85rem" id="btnLower" onclick="traceCase='lower';initTrace()">${l.L.toLowerCase()} 小写</button>
        </div>
        <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center">
          <canvas id="tracePad" width="280" height="280" style="touch-action:none;background:#fff;border:3px solid var(--lemon);border-radius:24px;box-shadow:0 5px 0 rgba(45,49,66,.1);cursor:crosshair"></canvas>
          <div style="text-align:center">
            <div style="font-size:.9rem;margin-bottom:8px">描红进度</div>
            <div style="width:140px;height:18px;background:#EEF3F8;border-radius:999px;overflow:hidden;margin:0 auto 10px">
              <div id="traceBar" style="height:100%;width:0%;background:linear-gradient(90deg,#FFD93D,#FF9F45);border-radius:999px;transition:.2s"></div>
            </div>
            <div id="traceStatus" style="font-size:.85rem;margin-bottom:8px;color:#5C6273">用手指沿着虚线描 ✏️</div>
            <button class="btn ghost" onclick="initTrace()">🧽 擦掉重写</button>
          </div>
        </div>
      </div>
      <p style="color:#5C6273;font-size:.78rem;margin-top:10px">💡 小提示：点单词卡片可以听发音；红色 a e i o u 是"歌手"，蓝色辅音是"画家"。</p>
    </div>`;
  if (speakIt) sayName(); // 只有用户点击切换时才朗读；首次打开页面保持安静
  // 预拉取双音频（字母名 + 代表词），用户一点就秒响
  prewarmWord(l.L);
  prewarmWord(l.words[0].w);
  l.words.slice(1).forEach(w => prewarmWord(w.w)); // 其余示例词也预热
  initTrace();
}

/* ---------------- 字母描红系统 v2 ----------------
   改进：虚线引导、细笔刷、精确计格、90%阈值、通过后仍可继续写 */
let traceCase = 'upper';
let __traceTarget = null, __traceDone = false, __traceTouched = new Set(), __traceDrawing = false;

function initTrace() {
  const cv = document.getElementById('tracePad'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const l = LETTERS[cur];
  const ch = traceCase === 'upper' ? l.L : l.L.toLowerCase();
  ctx.clearRect(0, 0, 280, 280);

  // 画虚线目标字母（描红引导线）
  ctx.save();
  ctx.font = '900 180px "Comic Sans MS","Segoe UI",Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = '#C5CDD8';
  ctx.lineWidth = 2;
  ctx.strokeText(ch, 140, 148);
  ctx.restore();

  // 画极淡的填充底色（帮助识别）
  ctx.save();
  ctx.font = '900 180px "Comic Sans MS","Segoe UI",Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(200,210,220,.08)';
  ctx.fillText(ch, 140, 148);
  ctx.restore();

  // 更新按钮高亮
  const bu = document.getElementById('btnUpper'), bl = document.getElementById('btnLower');
  if (bu) { bu.className = 'btn ' + (traceCase === 'upper' ? 'mint' : 'ghost'); bu.style.padding = '6px 16px'; bu.style.fontSize = '.85rem'; }
  if (bl) { bl.className = 'btn ' + (traceCase === 'lower' ? 'mint' : 'ghost'); bl.style.padding = '6px 16px'; bl.style.fontSize = '.85rem'; }

  // 采样目标格子（离屏画布）——字体直接写死，不依赖 ctx.font 的运行时状态
  const off = document.createElement('canvas'); off.width = 280; off.height = 280;
  const octx = off.getContext('2d');
  octx.font = '900 180px "Comic Sans MS","Segoe UI",Arial';
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#000';
  octx.fillText(ch, 140, 148);
  const data = octx.getImageData(0, 0, 280, 280).data;
  const cell = 14, n = Math.floor(280 / cell);
  __traceTarget = new Set();
  // 完整逐像素扫描（步长1），确保每个覆盖格子都被采样到
  for (let y = 0; y < 280; y++) {
    const gy = Math.floor(y / cell);
    for (let x = 0; x < 280; x++) {
      if (data[(y * 280 + x) * 4 + 3] > 40) {
        __traceTarget.add(gy * n + Math.floor(x / cell));
      }
    }
  }
  __traceDone = false;
  __traceTouched = new Set();
  updateTraceBar();
  const st = document.getElementById('traceStatus');
  if (st) { st.textContent = '用手指沿着虚线描 ✏️'; st.style.color = '#5C6273'; }
}

function updateTraceBar() {
  const bar = document.getElementById('traceBar'); if (!bar || !__traceTarget) return 0;
  const need = Math.ceil(__traceTarget.size * 0.88); // 88% 才过关
  const pct = Math.min(100, Math.round(__traceTouched.size / Math.max(1, need) * 100));
  bar.style.width = pct + '%';
  return pct;
}

(function bindTrace() {
  document.addEventListener('pointerdown', e => {
    if (e.target.id !== 'tracePad') return;
    __traceDrawing = true;
    const cv = e.target, ctx = cv.getContext('2d');
    const cell = 14, n = Math.floor(280 / cell);

    const draw = ev => {
      if (!__traceDrawing) return;
      const r = cv.getBoundingClientRect();
      const x = (ev.clientX - r.left) * (280 / r.width);
      const y = (ev.clientY - r.top) * (280 / r.height);
      // 细笔刷：半径10，更精准
      ctx.fillStyle = 'rgba(255,107,107,.45)';
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
      // 只计笔刷中心直接经过的格子（不做 3x3 扩张）
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      const k = gy * n + gx;
      if (__traceTarget && __traceTarget.has(k)) __traceTouched.add(k);
      // 笔刷边缘也稍微计入（半径一半处）
      const gx2 = Math.floor((x + 5) / cell), gy2 = Math.floor((y + 5) / cell);
      const gx3 = Math.floor((x - 5) / cell), gy3 = Math.floor((y - 5) / cell);
      [gx2, gx3].forEach(cx => { const kk = gy * n + cx; if (__traceTarget && __traceTarget.has(kk)) __traceTouched.add(kk); });
      [gy2, gy3].forEach(cy => { const kk = cy * n + gx; if (__traceTarget && __traceTarget.has(kk)) __traceTouched.add(kk); });

      const pct = updateTraceBar();
      if (pct >= 100 && !__traceDone) {
        __traceDone = true;
        addStars(1); confetti(); sfx.win();
        toast('✍️ 写得真棒！+1 ⭐');
        const st = document.getElementById('traceStatus');
        if (st) { st.innerHTML = '✅ 太棒了！可以 🧽 重写练，或切大写/小写'; st.style.color = '#4E9E59'; }
        // 不 return，不阻止继续写
      }
    };
    draw(e);
    const move = ev => { ev.preventDefault(); draw(ev); };
    const up = () => { __traceDrawing = false; document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
    document.addEventListener('pointermove', move, { passive: false });
    document.addEventListener('pointerup', up);
  });
})();

/* ============ 字母岛语音系统（三按钮，逻辑清晰） ============
   ① 字母名：只播字母名（如 A 读 "ay"）
   ② 字母音：只播代表词 0.5 倍慢速——孩子听清 A 在 "aaapple" 开头的 /æ/ 音
   ③ 完整口诀：字母名 → 慢词 → 常词，三段全真人女声
   故障隔离：单次失败只影响当次播放，不触发 45 秒全站冷却 */
function sayName() {
  const l = LETTERS[cur];
  sfx.pop();
  __engineCooldownUntil = 0; // 字母岛不冷却——单次失败下次重试即可
  speak(l.L, 'en-US', 1);
}
function saySound() {
  const l = LETTERS[cur];
  const w = l.words[0].w;
  sfx.pop();
  /* 拼读音：全部真人录音。超慢速两遍把词首拼读音拖长（A→"啊…"），
     再常速一遍收尾——课堂领读的标准做法，无任何机器合成音。 */
  speakChain([
    { text: w, rate: 0.5 },
    { text: w, rate: 0.5 },
    { text: w, rate: 1 }
  ]);
}
function sayChant() {
  const l = LETTERS[cur];
  const w = l.words[0].w;
  sfx.pop();
  /* 完整口诀：字母名 → 超慢词（听清拼读音）→ 常速词，全真人录音 */
  speakChain([
    { text: l.L, rate: 1 },
    { text: w, rate: 0.5 },
    { text: w, rate: 1 }
  ]);
}

function sayWord(el, w) { flyStar(el); speakWordDouble(w); } /* 第一遍发音，第二遍拼读 */

function q1(btn, w, right) {
  if (right) {
    if (!q1ok) { q1ok = true; addStars(1); flyStar(btn); confetti(); touchWord(w, true); }
    feedback(btn, true); sfx.correct();
    $('#quizExplain').innerHTML = `✅ <b>${w}</b> 就是 ${LETTERS[cur].L} 开头的单词！`;
  } else { feedback(btn, false); sfx.wrong(); $('#quizExplain').innerHTML = `🤔 再想想：找 ${LETTERS[cur].L} 开头的单词哦～`; }
}
function q2(btn, right) {
  const l = LETTERS[cur];
  if (right) {
    if (!q2ok) { q2ok = true; addStars(1); flyStar(btn); }
    feedback(btn, true); sfx.correct();
    $('#quizExplain').innerHTML = `✅ 对啦！${l.L} 就是「${l.shape}」${l.emoji}`;
  } else { feedback(btn, false); sfx.wrong(); $('#quizExplain').innerHTML = `🤔 再看看上面的故事吧～`; }
}

function learnNow(btn) {
  const l = LETTERS[cur];
  const first = !Store.d.letters[l.L];
  learnLetter(l.L);
  if (first) { addStars(2); confetti(); toast(`🎉 学会了字母 ${l.L}（${l.shape}）！+2 ⭐`); }
  else { toast('💪 温故知新，真棒！'); }
  btn.textContent = '✅ 已经学会啦（再练练）';
  renderGrid();
}
function nextAfterLearn() { pick(Math.min(cur + 1, LETTERS.length - 1)); }
function prevL() { pick(Math.max(cur - 1, 0)); }
function nextL() { pick(Math.min(cur + 1, LETTERS.length - 1)); }

/* 初始：定位到第一个没学的字母（安静加载，不自动发音） */
(function init() {
  let idx = LETTERS.findIndex(l => !Store.d.letters[l.L]);
  if (idx < 0) idx = 0;
  cur = idx;
  renderGrid(); renderStage(false);
})();
</script>
</body>
</html>
