<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4EC5F1">
<meta name="description" content="26 个英文字母的象形小故事 + 自然拼读（字母名/字母音各读一遍），还有拼音小桥梁，防止 b/d/p/q 混淆。">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="小鸟英语乐园 Birdie ABC">
<meta property="og:title" content="字母岛 · 26 个字母朋友 · 小鸟英语乐园">
<meta property="og:description" content="26 个英文字母的象形小故事 + 自然拼读（字母名/字母音各读一遍），还有拼音小桥梁，防止 b/d/p/q 混淆。">
<meta property="og:image" content="https://heijialun19.github.io/yingyu/og-cover.png">
<meta property="og:url" content="https://heijialun19.github.io/yingyu/letters.html">
<meta name="twitter:card" content="summary_large_image">
<title>字母岛 · 小鸟英语乐园</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=36">
</head>
<body>
<main>
  <div class="page-title">
    <h1>🏝️ 字母岛 · 26 位字母朋友</h1>
    <p>字母像画画一样，每个都有小故事——<b style="color:#FF6B6B">红色</b>是会唱歌的元音宝宝，<b style="color:#4EC5F1">蓝色</b>是有含义的辅音朋友</p>
  </div>

  <div style="max-width:680px;margin:0 auto 6px;display:flex;align-items:center;gap:12px;background:#EDFAF0;border:3px solid var(--mint);border-radius:18px;padding:10px 16px;flex-wrap:wrap">
    <span style="font-size:22px">🎓</span>
    <b style="flex:1;min-width:160px;font-size:.9rem">已经会 26 个字母了？</b>
    <button class="btn mint" onclick="skipLetters()" style="padding:8px 16px;font-size:.85rem">我会字母了，直接学单词 →</button>
  </div>

  <!-- 字母选格 -->
  <section class="section">
    <div class="card">
      <h2>👀 点一个字母，认识它</h2>
      <div class="letter-grid" id="letterGrid" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- 字母详情 -->
  <section class="section">
    <div class="letter-stage" id="letterStage"></div>
  </section>
<div style="text-align:center;margin-top:20px;font-size:.75rem"><a href="disclaimer.html" style="color:#6B7280">📋 免责声明 · 隐私政策 · 使用条款</a></div></main>

<script src="js/words-data.js?v=30"></script>
<script src="svg/word-svg.js"></script>
<script src="js/data.js?v=32"></script>
<script src="js/app.js?v=47"></script>
<script src="js/sentence.js?v=42"></script>
<script>
renderNav('letters'); renderDecor();
function skipLetters() {
  if (confirm('确认：把 26 个字母都标记为已学会？以后直接从单词开始。')) {
    markAllLettersKnown();
    setTimeout(() => location.href = 'words.html', 800);
  }
}

let cur = 0;
let q1ok = false, q2ok = false;

/* ---------------- 字母选格 ---------------- */
function renderGrid() {
  $('#letterGrid').innerHTML = LETTERS.map((l, i) => {
    const learned = !!Store.d.letters[l.L];
    return `<button class="letter-card ${l.v ? 'vowel' : ''} ${i === cur ? 'active' : ''}" onclick="pick(${i})">
      ${learned ? '<span class="mark">⭐</span>' : ''}
      <span class="big">${l.L}</span><span class="sm">${l.L.toLowerCase()} · ${l.short || l.shape}</span>
    </button>`;
  }).join('');
}

function pick(i) { cur = i; q1ok = q2ok = false; renderGrid(); renderStage(true); window.scrollTo({ top: $('#letterStage').offsetTop - 90, behavior: 'smooth' }); }

/* ---------------- 详情舞台 ---------------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderStage(speakIt) {
  const l = LETTERS[cur];
  const learned = !!Store.d.letters[l.L];
  const type = l.v ? '会唱歌的元音宝宝' : '有含义的辅音朋友';

  /* 小练习题目：正确项一定以该字母开头；干扰项一律不以该字母开头 */
  const lower = l.L.toLowerCase();
  const rightWord = l.words[0];
  const pool = [];
  LETTERS.forEach(x => { if (x.L !== l.L) x.words.forEach(wd => pool.push(wd)); });
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const seen = new Set([rightWord.w.toLowerCase()]);
  const otherWords = [];
  for (const cand of pool) {
    if (otherWords.length >= 3) break;
    const key = cand.w.toLowerCase();
    if (!seen.has(key) && !key.startsWith(lower)) { seen.add(key); otherWords.push(Object.assign({}, cand, { right: false })); }
  }
  const q1opts = shuffle([Object.assign({}, rightWord, { right: true }), ...otherWords]);
  const q2opts = shuffle([
    { s: l.shape, right: true },
    ...shuffle(LETTERS.filter(x => x.L !== l.L && x.shape !== l.shape)).slice(0, 3).map(x => ({ s: x.shape, right: false }))
  ]);

  $('#letterStage').innerHTML = `
    <div class="letter-hero bounce-in" style="background:${l.color}">
      <button class="speak-btn" onclick="sayChant()" title="听拼读口诀">🎵</button>
      <div class="glyph">${l.L}<small> ${l.L.toLowerCase()}</small></div>
      <div class="shape">${l.emoji} ${l.shape}</div>
      <div style="margin-top:6px;font-size:.8rem;opacity:.95">${type}</div>
      <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="sayName()" title="播放字母的名字，如 A 读 'ay'">🔤 字母名 ${l.L}</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="saySound()" title="慢速播放代表词，听清 ${l.L} 在开头的读音">📢 字母音（听${l.words[0].w}）</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:.78rem" onclick="sayChant()" title="完整三遍：名字 + 慢词 + 常速词">🎵 完整口诀</button>
      </div>
      <div style="margin-top:10px">
        <button class="btn ghost" style="padding:8px 18px;font-size:.85rem" onclick="prevL()">◀ 上一个</button>
        <button class="btn ghost" style="padding:8px 18px;font-size:.85rem" onclick="nextL()">下一个 ▶</button>
      </div>
    </div>

    <div>
      <div class="story-box">
        <h3>📖 ${l.L} 的故事：${l.shape}</h3>
        <p style="margin:0;line-height:1.9;font-size:.95rem">${l.story}</p>
        <div style="margin-top:10px;background:#fff;border-radius:14px;padding:8px 12px;font-size:.85rem;line-height:1.8">
          🎵 拼读小口诀：<b>${l.L} 的名字读 "${l.nameEn}"</b>，
          它在单词里发 <b>${l.szh}</b> 的音——
          听听 <b>${l.words[0].w}</b> ${l.words[0].e} 开头的那个音！
          <span style="color:#5C6273;display:block;margin-top:4px">（点上方按钮听发音，想多听几遍就多点几次）</span>
        </div>
      </div>
      ${l.py ? `<div class="py-note">🌉 <b>拼音小桥梁：</b>${l.py}</div>` : ''}

      <div class="word-mini-row">
        ${l.words.map(w => `
          <div class="word-mini" onclick="sayWord(this,'${w.w}')" title="点一下，读一遍">
            <div class="we">${wordIcon(w)}</div>
            <b>${w.w}</b><span>${w.zh}</span>
            ${w.dec ? `<div class="dec">🔎 ${w.dec}</div>` : ''}
          </div>`).join('')}
      </div>

      <div class="card quiz-area" style="margin-top:16px">
        <h2>🎯 小练习（答对得星星）</h2>
        <div class="quiz-q">1️⃣ 听一听、看一看：哪个单词是 ${l.L} 开头的？</div>
        <div class="opt-row" id="q1row">
          ${q1opts.map(o => `<button class="opt" onclick="q1(this,'${String(o.w).replace(/'/g, "\\'")}',${o.right})"><span class="oe">${o.e}</span>${o.w}</button>`).join('')}
        </div>
        <div class="quiz-q" style="margin-top:16px">2️⃣ ${l.L}${l.L.toLowerCase()} 的象形朋友是谁？</div>
        <div class="opt-row" id="q2row">
          ${q2opts.map(o => `<button class="opt" onclick="q2(this,${o.right})">${o.s}</button>`).join('')}
        </div>
        <div class="explain" id="quizExplain"></div>
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center">
        <button class="btn mint big" id="learnBtn" onclick="learnNow(this)">${learned ? '✅ 已经学会啦（再练练）' : '🌟 我学会这个字母啦！'}</button>
        ${cur < LETTERS.length - 1 ? `<button class="btn orange big" onclick="nextAfterLearn()">下一个字母 ▶</button>` : `<button class="btn orange big" onclick="location.href='words.html'">去单词镇 →</button>`}
      </div>

      <p style="color:#5C6273;font-size:.78rem;margin-top:10px">💡 小提示：点单词卡片可以听发音；红色 a e i o u 是"歌手"，蓝色辅音是"画家"。</p>
    </div>`;
  if (speakIt) sayName(); // 只有用户点击切换时才朗读；首次打开页面保持安静
  // 预拉取双音频（字母名 + 代表词），用户一点就秒响
  prewarmWord(l.L);
  prewarmWord(l.words[0].w);
}


/* ============ 字母岛语音系统（三按钮，逻辑清晰） ============
   ① 字母名：只播字母名（如 A 读 "ay"）
   ② 字母音：只播代表词一遍——孩子听清 A 在 "apple" 开头的 /æ/ 音
   ③ 完整口诀：字母名 → 代表词，各一遍
   每次点击只出一个声音；想多听几遍，多点几次就好 */
function sayName() {
  const l = LETTERS[cur];
  sfx.pop();
  /* 用字母名的英文拼写请求：有道对单字母 Z/E/P/R/T/X 等音质只有 56kbps，
     用 "zee"/"ee"/"pee" 等请求能拿到 128-224kbps，听感差别很大。 */
  speak(l.nameEn || l.L, 'en-US', 1);
}
function saySound() {
  const l = LETTERS[cur];
  sfx.pop();
  speak(l.words[0].w, 'en-US', 1); // 点一下，读一遍
}
function sayChant() {
  const l = LETTERS[cur];
  const w = l.words[0].w;
  sfx.pop();
  speakChain([
    { text: l.nameEn || l.L, rate: 1 },
    { text: w, rate: 1 }
  ]);
}

function sayWord(el, w) { flyStar(el); speakWord(w); } /* 点一下，读一遍 */

function q1(btn, w, right) {
  if (right) {
    if (!q1ok) { q1ok = true; addStars(1); flyStar(btn); confetti(); touchWord(w, true); }
    feedback(btn, true); sfx.correct();
    $('#quizExplain').innerHTML = `✅ <b>${w}</b> 就是 ${LETTERS[cur].L} 开头的单词！`;
  } else { feedback(btn, false); sfx.wrong(); $('#quizExplain').innerHTML = `🤔 再想想：找 ${LETTERS[cur].L} 开头的单词哦～`; }
}
function q2(btn, right) {
  const l = LETTERS[cur];
  if (right) {
    if (!q2ok) { q2ok = true; addStars(1); flyStar(btn); }
    feedback(btn, true); sfx.correct();
    $('#quizExplain').innerHTML = `✅ 对啦！${l.L} 就是「${l.shape}」${l.emoji}`;
  } else { feedback(btn, false); sfx.wrong(); $('#quizExplain').innerHTML = `🤔 再看看上面的故事吧～`; }
}

function learnNow(btn) {
  const l = LETTERS[cur];
  const first = !Store.d.letters[l.L];
  learnLetter(l.L);
  if (first) { addStars(2); confetti(); toast(`🎉 学会了字母 ${l.L}（${l.shape}）！+2 ⭐`); }
  else { toast('💪 温故知新，真棒！'); }
  btn.textContent = '✅ 已经学会啦（再练练）';
  renderGrid();
}
function nextAfterLearn() { pick(Math.min(cur + 1, LETTERS.length - 1)); }
function prevL() { pick(Math.max(cur - 1, 0)); }
function nextL() { pick(Math.min(cur + 1, LETTERS.length - 1)); }

/* 初始：定位到第一个没学的字母（安静加载，不自动发音） */
(function init() {
  let idx = LETTERS.findIndex(l => !Store.d.letters[l.L]);
  if (idx < 0) idx = 0;
  cur = idx;
  renderGrid(); renderStage(false);
})();
</script>
</body>
</html>
