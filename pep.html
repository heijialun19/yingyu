      view: view, lv: curLevel && curLevel.id, u: curUnit && curUnit.id

}

/* ---------- 换册 ---------- */

  };

    const on = lv.id === pepActiveLevelId();

}
function spellSkip() {
  const cur = S.list[S.qIdx];
  if (!S.bad.includes(cur) && !S.ok.includes(cur)) S.bad.push(cur);
  toast('没关系，这个词待会儿再练！');
  spellNext();
}
function spellQuit() { stopAllSpeech(); renderLevelHome(); }
function spellFinish() {
  const u = curUnit;
  const total = S.list.length;
  const okN = S.ok.length, badN = S.bad.length;
  const pct = Math.round(okN / total * 100);
  const stars = pct === 100 ? 5 : pct >= 80 ? 3 : pct >= 60 ? 2 : 1;
  addStars(stars);
  pepMarkDone(u.id, pct, stars);
  confetti(); sfx.win();
  Store.d.daily && (Store.d.daily.tasks.words = true);
  const rows = S.list.map(w => {
    const good = S.ok.includes(w);
    return `<div class="res-row">
      <div class="ri">${pepIconOf(w)}</div><b lang="en">${esc(w.w)}</b>
      <span class="rw">${esc(w.zh)}</span>
      <span class="rk">${good ? '✅' : '❌'}</span>
    </div>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="card" style="max-width:560px;margin:0 auto;text-align:center;padding:24px 18px">
      <div style="font-size:56px">${pct === 100 ? '🏆' : pct >= 60 ? '🎉' : '💪'}</div>
      <h2 style="justify-content:center">${pct === 100 ? '全部拼对，太棒了！' : '拼词完成！'}</h2>
      <div class="res-nums">
        <div><b class="g">${okN}</b><small>拼写正确</small></div>
        <div><b class="o">${badN}</b><small>还需练习</small></div>
        <div><b class="p">${pct}%</b><small>正确率</small></div>
      </div>
      <p style="color:#6B7280;font-size:.85rem">奖励 +${stars} ⭐ · 每一次练习，都让单词更熟悉</p>
    </div>
    <div class="card res-list" style="max-width:560px;margin:10px auto">
      <b>这次的单词</b>
      ${rows}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        ${badN ? `<button class="btn coral big" onclick="startSpellWrong()">🔁 重拼错词（${badN} 个）</button>` : ''}
        <button class="btn grape big" onclick="startSpell('${u.id}')">🔄 再拼一遍</button>
        <button class="btn ghost big" onclick="renderLevelHome()">🏠 回单元列表</button>
      </div>
      <div style="margin-top:12px"><button class="btn" style="width:100%;background:#6366F1;color:#fff" onclick="location.href='games.html'">🎮 去游戏乐园再巩固一轮</button></div>
    </div>`;
}
function startSpellWrong() {
  const wrong = S.bad.slice();
  if (!wrong.length) return;
  S = { qIdx: 0, list: shuffle(wrong), ok: [], bad: [], tries: {}, hinted: {} };
  renderSpell();
}

/* ---------- 启动 ---------- */
(function init() {
  const params = new URLSearchParams(location.search);
  /* 深链：?points=pep3a-u1 直达某单元知识点（单词镇课本区块跳过来用） */
  const pid = params.get('points');
  if (pid && findUnit(pid)) {
    const un = findUnit(pid);
    pepSetActiveLevel(un.lv.id);
    renderPoints(pid);
    return;
  }
  /* ★ 2026-11-08：刷新后回到原来的册 / 单元，不再弹回换册页。
     知识点页能原样恢复；逐词学习、拼词不恢复答题进度（题目和答案绝不落盘），
     只回到同一册的单元列表。只认 reload，从首页正常点进来不受影响。 */
  try {
    if (window.__isReload && window.__isReload()) {
      const snap = window.__navLoad && window.__navLoad('pep', 30 * 60 * 1000);
      if (snap) {
        const un = snap.u ? findUnit(snap.u) : null;
        if (un) {
          pepSetActiveLevel(un.lv.id);
          if (snap.view === 'points') { renderPoints(snap.u); toast('↩️ 已回到刚才的知识点'); return; }
          renderLevelHome(); toast('↩️ 已回到刚才那一册'); return;
        }
        if (snap.lv && PEP_LEVELS.some(l => l.id === snap.lv)) {
          pepSetActiveLevel(snap.lv); renderLevelHome(); return;
        }
      }
    }
  } catch (e) {}
  const lv = PEP_LEVELS.find(l => l.id === pepActiveLevelId());
  if (lv) { curLevel = lv; renderLevelHome(); } else renderLevels();
})();
</script>
</body>
