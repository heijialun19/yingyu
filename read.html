<script>
renderNav('read'); renderDecor();

/* 读书馆进度：{done:{b1:ts}, stars:{b1:2}} —— 必须按档案隔离，
   否则兄弟姐妹共用一个浏览器时，读完的书和星星会串台。
   老版本只用一个 'bk1'，首次读取时迁移一次，不让家长丢进度。 */
const BK_KEY = 'bk4_' + ((typeof Profiles !== 'undefined' && Profiles.meta && Profiles.meta.activeId)
  ? Profiles.meta.activeId : 'default');
function bkProg() {
  try {
    const p = JSON.parse(localStorage.getItem(BK_KEY));
    if (p) return p;
  } catch (e) {}
  return {};
}
function bkSave(p) { try { localStorage.setItem(BK_KEY, JSON.stringify(p)); } catch (e) {} }

/* v4：中文默认隐藏。先让孩子读英文、听整句、看图猜意思，
   卡住了再按「看中文」求助 —— 逐句中文全摊开会把阅读变成读译文。
   偏好跨页、跨书、跨会话保持；家长想全程对照，点一次就一直显示。 */
const BK_ZH_KEY = 'birdie_books_zh_v4';
let BK_SHOW_ZH = false;
try { const s = localStorage.getItem(BK_ZH_KEY); if (s !== null) BK_SHOW_ZH = (s === '1'); } catch (e) {}

/* 读后输出：v4 由 _v4_build.py 为每本单独写 retell 与 think，
   不再用按级别的通用模板（那会带来「120 本只有 5 种复述任务」的模板腔）。 */
function retellTask(b) {
  return b && b.retell ? b.retell : '合上书，用三句话把这一本讲给家长听。';
}

/* 晋级路径（2026-11-22 修）：
   ★ 原写法是「本级还没读完的第一本」——只要不是从 b1 顺着读，
     比如孩子直接读了 b5，下一本就跳回 b1（家长报的 bug）。
   ★ 新写法按「当前位置往后找」，不回头：
       ① 本级里当前书之后的第一本未读完；
       ② 本级读完 → 全局往后第一本未读完（进入下一级）；
       ③ 后面全读完 → 才从头找，但仍排除刚读完的这本。
   仍然不会跳过每站第 12 本的复习册，因为找的是「未读完」而不是线性 i+1。 */
function nextBookId(id) {
  const prog = bkProg(), done = prog.done || {};
  const i = BOOKS.findIndex(b => b.id === id);
  if (i < 0) return BOOKS.length ? BOOKS[0].id : null;
  const cur = BOOKS[i];
  for (let j = i + 1; j < BOOKS.length; j++) {
    if (BOOKS[j].lv !== cur.lv) break;
    if (!done[BOOKS[j].id]) return BOOKS[j].id;
  }
  for (let j = i + 1; j < BOOKS.length; j++) {
    if (!done[BOOKS[j].id]) return BOOKS[j].id;
  }
  const rest = BOOKS.filter(b => !done[b.id] && b.id !== id);
  return rest.length ? rest[0].id : null;
}

let CUR = null;      // 当前书
let PAGE = 0;        // 当前页码
let QUIZI = 0;       // 当前题号
let QUIZ_OK = 0;     // 答对数
let SEQ = [];        // 当前书的渲染序列（读前页 + 正文页）

/* esc 使用 app.js 的全局版本（本地重复声明会与 app.js 的 const esc 冲突导致整段脚本解析失败） */

/* ============ 书架 ============ */
function wc(b) {
  return (b.pages || []).reduce((n, p) => n + String(p.en || '').split(/\s+/).filter(Boolean).length, 0);
}
const TRACK_LABEL = { story:'📖 故事', drill:'🔬 发音专项',
                      info:'🌍 小科普', review:'🔁 复习册',
                      fantasy:'🧚 想象', humor:'😄 好笑', rhyme:'🎵 韵文' };
/* 书架一次只开一站（12 本）。站在这里记住，下次进来还在同一站。
   ★ 为什么不再一口气铺 120 本：手机上那是十几屏，孩子滑到第 4 站就忘了自己在找什么。 */
const SHELF_KEY = 'birdie.read.station';
const STATION_ORDER = ['L1','L2','L3','L4','L5','L6','L7','L8','L9','L10'];
const STATION_NAME = { L1:'短句起步', L2:'读小故事', L3:'故事更完整', L4:'独立小读本',
                       L5:'每页两句话', L6:'故事更长了', L7:'开始有从句', L8:'复合句',
                       L9:'篇章阅读', L10:'长篇读物' };
function shelfStation() {
  let lv = null;
  try { lv = localStorage.getItem(SHELF_KEY); } catch (e) {}
  if (STATION_ORDER.indexOf(lv) < 0) {
    const prog = bkProg(), done = prog.done || {};
    const nb = BOOKS.find(b => !done[b.id]);
    lv = nb ? nb.lv : (BOOKS.length ? BOOKS[BOOKS.length - 1].lv : 'L1');
  }

/* ============ 绘本原图 ============
   1260 页逐页手绘场景由本地开源模型绘制，按 art/books/<书号>/pNN.webp 存放。
   缺图、断网、首次离线时自动回落到上面的内联 SVG 分镜，阅读不中断。 */
function pageArtSrc(p) {
  const i = (CUR.pages || []).indexOf(p);
  if (i < 0) return '';
  return 'art/books/' + CUR.id + '/p' + String(i + 1).padStart(2, '0') + '.webp';
}
function pageArt(p) {
  const src = pageArtSrc(p);
  if (!src) return drawScene(p.art);
  return '<img src="' + src + '" alt="本页插画" width="1200" height="800" ' +
         'loading="lazy" decoding="async">';
}

/* ============ 阅读器 ============ */
function openBook(id) {
  CUR = BOOKS.find(b => b.id === id);
  if (!CUR) return;
  /* 打开即记下这一站：从「下一本」跨到下一站后，回书架会停在正确的站 */
  try { localStorage.setItem(SHELF_KEY, CUR.lv); } catch (e) {}
  /* 读前页（若该书带 pre）：渲染序列 = [读前] + 正文；老书没有 pre 就与 pages 完全等价 */
  SEQ = [];
  if (CUR.pre && CUR.pre.length) SEQ.push({ __pre: true });
  CUR.pages.forEach(p => SEQ.push(p));
  PAGE = 0;
  document.getElementById('shelf').style.display = 'none';
  document.querySelector('.hero').classList.add('compact');
  document.getElementById('reader').style.display = '';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('bkNum').textContent = CUR.emoji;
  document.getElementById('bkTitle').textContent = CUR.title + ' · ' + CUR.zh;
  const TRK = { drill: '🔬 发音专项', story: '📖 故事',
                info: '🌍 小科普', review: '🔁 复习册',
                fantasy: '🧚 想象', humor: '😄 好笑', rhyme: '🎵 韵文' };
  document.getElementById('bkMeta').innerHTML = CUR.goal
    ? `<span class="bk-goal">🎯 <b>${esc(CUR.goal)}</b></span>` +
      `<span class="bk-meta2">${TRK[CUR.track] ? TRK[CUR.track] + ' · ' : ''}` +
      `${CUR.pages.length} 页 · ${CUR.quiz.length} 题` +
      `${CUR.pep ? ' · ' + esc(CUR.pep) : ''}</span>`
    : `🎯 练习：<b>${esc(CUR.tag)}</b> · 共 ${CUR.pages.length} 页 · 读后 3 题 · ` +
      `点句子听整句，点<span style="background:#FFE28A;border-radius:6px;padding:0 4px">单词</span>听发音`;
  /* 词卡：预教词带中文，整体认读词（本级还没教的字素）标黄；
     超过 8 个折起来，避免高年级长书把整屏都占满。 */
  const chips = (CUR.pre || []).map(w =>
      `<button class="bk-wchip" data-w="${esc(w.en)}">${esc(w.en)}<small>${esc(w.zh)}</small></button>`)
    .concat((CUR.sight || []).map(w =>
      `<button class="bk-wchip" data-w="${esc(w)}" style="border-color:var(--lemon);background:#FFF9E3">${esc(w)}<small>整体认读</small></button>`));
  const SHOW = 8;
  document.getElementById('bkWords').innerHTML = chips.slice(0, SHOW).join('') +
    (chips.length > SHOW
      ? `<details class="bk-more"><summary>还有 ${chips.length - SHOW} 个词，点开看 ▾</summary>` +
        `<span class="bk-morelist">${chips.slice(SHOW).join('')}</span></details>`
      : '');
  document.querySelectorAll('.bk-wchip').forEach(c => c.onclick = () => { speak(c.dataset.w, 'en-US', 1); });
  paintPage();
  window.scrollTo(0, 0);
}

function paintPage() {
  const p = SEQ[PAGE];
  if (p && p.__pre) { paintPre(); return; }
  const stage = document.getElementById('bkStage');
  /* 长篇读物整本统一用段落版式（不要同一本里字号忽大忽小）；
     L9 里特别长的单页也降一级。低级别按句长轻微缩放即可。 */
  const para = CUR.lv === 'L10' || String(p.en).length > 110;
  const long = !para && String(p.en).length > 58;
  stage.innerHTML = `
    <div class="bk-page ${para ? 'para' : ''}">
      <div class="bk-art">${pageArt(p)}</div>
      <div class="bk-sent ${para ? 'para' : (long ? 'long' : '')}" id="bkSent"></div>
      <div class="bk-zh">${esc(p.zh)}</div>
      <div class="bk-zhhint" id="bkZhHint"></div>
      <div class="bk-tools">
        <button class="btn coral" id="bkPlay">🔊 听整句</button>
        <button class="btn ghost" id="bkZh">👀 看中文</button>
      </div>
    </div>`;
  /* 插画加载：失败（缺图/断网/未下载）就回落到 SVG 分镜，绝不空着；
     同时把下一页的图悄悄预取，翻页时几乎瞬开。 */
  const artImg = stage.querySelector('.bk-art img');
  if (artImg) {
    artImg.onerror = () => { artImg.parentNode.innerHTML = drawScene(p.art); };
    const nx = SEQ[PAGE + 1];
    if (nx && !nx.__pre) {
      const s = pageArtSrc(nx);
      if (s) { const pre = new Image(); pre.decoding = 'async'; pre.src = s; }
    }
  }
  /* 逐词 span：点词发音 + 整句高亮容器 */
  const sentEl = document.getElementById('bkSent');
  sentEl.innerHTML = p.en.split(/\s+/).map(t => {
    const bare = t.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, '');
    return `<span class="w" data-w="${esc(bare)}">${esc(t)}</span>`;
  }).join(' ');
  sentEl.querySelectorAll('.w').forEach(w => w.onclick = () => {
    speakWord(w.dataset.w); w.classList.add('said'); setTimeout(() => w.classList.remove('said'), 600);
  });
  document.getElementById('bkPlay').onclick = () => speakSentence(p.en, sentEl);
  const zhEl = stage.querySelector('.bk-zh');
  const zhBtn = document.getElementById('bkZh');
  const hintEl = document.getElementById('bkZhHint');
  const paintZh = () => {
    zhEl.style.display = BK_SHOW_ZH ? '' : 'none';
    zhBtn.textContent = BK_SHOW_ZH ? '🙈 藏中文' : '👀 看中文';
    hintEl.textContent = BK_SHOW_ZH ? '' : '先自己读英文 · 看图猜意思 · 卡住了再点「看中文」';
  };
  zhBtn.onclick = () => {
    BK_SHOW_ZH = !BK_SHOW_ZH;
    try { localStorage.setItem(BK_ZH_KEY, BK_SHOW_ZH ? '1' : '0'); } catch (e) {}
    paintZh();
  };
  paintZh();
  /* 没有读前页时，第 1 页顶部给一次发音提示 */
  if (CUR.trap && !(CUR.pre && CUR.pre.length) && PAGE === 0) {
    const tip = document.createElement('div');
    tip.className = 'bk-trap';
    tip.innerHTML = '🔈 <b>发音提示</b> ' + esc(CUR.trap);
    stage.querySelector('.bk-page').appendChild(tip);
  }
  /* 翻页点 */
  document.getElementById('bkNav').innerHTML = `
    <button class="btn ghost" id="bkPrev" ${PAGE === 0 ? 'disabled' : ''}>← 上一页</button>
    <div class="bk-dots">${SEQ.map((_, i) => `<span class="bk-dot ${i === PAGE ? 'on' : ''}"></span>`).join('')}</div>
    <button class="btn grape" id="bkNext">${PAGE === SEQ.length - 1 ? '读后小测 →' : '下一页 →'}</button>`;
  document.getElementById('bkPrev').onclick = () => { if (PAGE > 0) { PAGE--; paintPage(); prewarm(); } };
  document.getElementById('bkNext').onclick = () => {
    if (PAGE < SEQ.length - 1) { PAGE++; paintPage(); prewarm(); sfx.pop(); }
    else { startQuiz(); }
  };
}

/* ============ 读前看图说词 ============ */
/* ★ 2026-11-22.6：读前词卡的图案原来直接用 books-data 里的 `w.art`（手填 emoji）。
   两个问题：① 和单词镇不是一套图 —— 单词镇走 wordIcon()，优先内置 SVG；
   ② 424 个词只用了 113 个图案，68 个图案被多个词共用（b32 的 stone/sand/rock/wind
   全是 🌿，b13 的 fat/afraid 都是 ✨）。
   现在：词库里有的词，一律用单词镇同一个 wordIcon()（连 emoji 为空也照旧走自绘 SVG）；
   词库里没有的 66 个词，用下面这张 PRE_ART 表给它们各自不重复的图案。 */
const PRE_ART = {
  clap:'👏', hold:'🤲', animal:'🐾', ground:'🧱', box:'📦', fat:'🍔', mud:'🍫',
  pot:'🍲', lid:'🥣', bun:'🍞', jam:'🍯', pin:'📌', nut:'🌰', turn:'🔄',
  cheese:'🧀', king:'👑', thin:'📏', path:'🛤️', snail:'🐚', bug:'🦋', soft:'🧸',
  piece:'🧩', break:'🔨', chip:'🍟', fun:'🎉', dish:'🍽', shed:'🏠', pond:'💧',
  basket:'🧺', empty:'⬜', gate:'🚪', stem:'🌿', spin:'🔄', seed:'🌱', tail:'🐕',
  chain:'🔗', nice:'😊', room:'🪑', smell:'👃', feed:'🥣', note:'📝', hole:'⭕',
  wheat:'🌾', oven:'🍳', bake:'🍪', board:'📋', cape:'🦸', rise:'🌅', heat:'🔥',
  search:'🔍', winter:'🧊', touch:'🫳', mid:'⏳', night:'🌃', shout:'📢', wheel:'🎡',
  shadow:'👤', mark:'🪶', ago:'⏰', tool:'🔧', toward:'👉', knock:'🚪', problem:'❓',
  reason:'💭', pace:'🎵', brain:'🧠',
};
const PRE_BANK = (() => {
  const m = {};
  try {
    GRADES.forEach(g => g.themes.forEach(t => t.words.forEach(w => {
      const k = String(w.w || '').toLowerCase();
      if (k && !m[k]) m[k] = w;
    })));
  } catch (e) {}
  return m;
})();
function preArt(p) {
  const k = String(p.en || '').toLowerCase();
  const rec = PRE_BANK[k];
  /* 词库里的词严格跟随单词镇：e 为空也传空，让它走 WORD_SVG，不要退回手填 emoji */
  const emo = rec ? (rec.e || '') : (PRE_ART[k] || p.art || '📘');
  const word = { w: p.en, e: emo, zh: p.zh || (rec && rec.zh) || '' };
  try { if (typeof wordIcon === 'function') return wordIcon(word); } catch (e) {}
  return `<span class="emj" aria-hidden="true">${esc(emo || '📘')}</span>`;
}

function paintPre() {
  const stage = document.getElementById('bkStage');
  stage.innerHTML = `
    <div class="bk-page bk-prepage">
      <div class="bk-pretitle">👀 先看词卡，听一遍</div>
      <div class="bk-pregrid">
        ${CUR.pre.map(w => `<button class="bk-prew" data-w="${esc(w.en)}">
            <span class="bk-preart">${preArt(w)}</span>
            <b>${esc(w.en)}</b><small>${esc(w.zh)}</small></button>`).join('')}
      </div>
      ${CUR.trap ? `<div class="bk-trap">🔈 <b>发音提示</b> ${esc(CUR.trap)}</div>` : ''}
      <div class="bk-prehint">这几个词会在这一本里出现，先点一下听一遍。
        ${(CUR.newWords && CUR.newWords.length) ? '其中新词已经在词卡里，读完你就能认出它们。' : '这一本不引入新词，全是你读过的词。'}</div>
    </div>`;
  stage.querySelectorAll('.bk-prew').forEach(b => b.onclick = () => {
    speak(b.dataset.w, 'en-US', 1);
    b.classList.add('said');
    setTimeout(() => b.classList.remove('said'), 600);
  });
  document.getElementById('bkNav').innerHTML = `
    <button class="btn ghost" id="bkPrev" disabled>← 上一页</button>
    <div class="bk-dots">${SEQ.map((_, i) => `<span class="bk-dot ${i === PAGE ? 'on' : ''}"></span>`).join('')}</div>
    <button class="btn grape" id="bkNext">开始读 →</button>`;
  document.getElementById('bkNext').onclick = () => { PAGE++; paintPage(); prewarm(); };
}

function prewarm() {
  const p = SEQ[PAGE + 1];
  if (p && p.en && typeof prewarmSentence === 'function') prewarmSentence(p.en);
}

/* ============ 读后小测 ============ */
function startQuiz() {
  QUIZI = 0; QUIZ_OK = 0;
  document.getElementById('reader').style.display = 'none';
  document.getElementById('quiz').style.display = '';
  paintQuiz();
  window.scrollTo(0, 0);
}

function paintQuiz() {
  const q = CUR.quiz[QUIZI];
  const KIND = { recall:'① 找得到', infer:'② 想得通', transfer:'③ 用得上' };
  document.getElementById('qBox').innerHTML = `
    <h3>📝 读后小测 · ${QUIZI + 1} / ${CUR.quiz.length}<span class="bk-kind">${KIND[q.kind] || '读一读'}</span></h3>
    <div class="bk-q">${esc(q.q)}</div>
    <div class="bk-opts">${q.opts.map((o, i) => `<button class="bk-opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="qFeed" style="min-height:28px;margin:10px 4px 2px;font-size:.92rem;font-weight:700"></div>`;
  document.querySelectorAll('.bk-opt').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.i, right = i === q.a;
    document.querySelectorAll('.bk-opt').forEach((b, j) => {
      b.disabled = true;
      if (j === q.a) b.classList.add('right');
    });
    if (!right) btn.classList.add('wrong');
    if (right) { QUIZ_OK++; sfx.good ? sfx.good() : sfx.pop(); }
    else sfx.no && sfx.no();
    document.getElementById('qFeed').textContent = right
      ? '✅ 答对啦！' : '❌ 别急，答案藏在故事里，等一下可以翻回去找一找';
    setTimeout(() => {
      if (QUIZI < CUR.quiz.length - 1) { QUIZI++; paintQuiz(); }
      else finishBook();
    }, 900);
  });
}

function finishBook() {
  const prog = bkProg();
  prog.done = prog.done || {};
  const first = !prog.done[CUR.id];
  prog.done[CUR.id] = Date.now();
  prog.stars = prog.stars || {};
  prog.stars[CUR.id] = Math.max(prog.stars[CUR.id] || 0, QUIZ_OK);
  bkSave(prog);
  if (first) addStars(2);
  const weak = QUIZ_OK < 2;
  document.getElementById('qBox').innerHTML = `
    <div style="text-align:center;padding:12px 4px 6px">
      <div style="font-size:64px">${QUIZ_OK === CUR.quiz.length ? '🏆' : '📖'}</div>
      <h3>${QUIZ_OK === CUR.quiz.length ? '太棒了，全对！' : '读完啦！'}</h3>
      ${CUR.summary ? `<div class="bk-summary"><b>这本书练了什么</b><br>${esc(CUR.summary)}</div>` : ''}
      <div class="bk-summary" style="text-align:left"><b>🎤 合上书，说一说</b><br>${esc(retellTask(CUR))}</div>
      ${CUR.think ? `<div class="bk-summary" style="text-align:left"><b>💡 再想一想（说给家长听，没有标准答案）</b><br>${esc(CUR.think)}</div>` : ''}
      ${weak ? '<p style="margin:6px 4px;color:var(--ink2);line-height:1.6;font-size:.92rem">这一本建议再读一遍：先听整句，再自己读，最后重做小测。读顺了再往下一本走。</p>' : ''}
      <p style="margin:8px 4px;color:var(--ink2);line-height:1.7">
        《${esc(CUR.title)}》· 答对 <b>${QUIZ_OK}</b> / ${CUR.quiz.length} 题
        ${first ? ' · 奖励 ⭐+2' : ''}
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px">
        ${weak ? '<button class="btn coral" id="qAgain">📖 再读一遍</button>'
               : '<button class="btn coral" id="qNextBook">下一本书 →</button>'}
        ${weak ? '<button class="btn ghost" id="qNextBook">下一本书 →</button>'
               : '<button class="btn ghost" id="qAgain">📖 再读一遍</button>'}
        <button class="btn ghost" id="qShelf">回书架</button>
      </div>
    </div>`;
  if (QUIZ_OK === CUR.quiz.length) { sfx.win && sfx.win(); confetti(); }
  document.getElementById('qNextBook').onclick = () => {
    const nid = nextBookId(CUR.id);
    if (nid) openBook(nid); else backShelf();
  };
  document.getElementById('qAgain').onclick = () => openBook(CUR.id);
  document.getElementById('qShelf').onclick = backShelf;
}

function backShelf() {
  document.querySelector('.hero').classList.remove('compact');
  document.getElementById('shelf').style.display = '';
  document.getElementById('reader').style.display = 'none';
  document.getElementById('quiz').style.display = 'none';
  renderShelf();
  window.scrollTo(0, 0);
}

document.getElementById('bkBack').onclick = backShelf;
document.getElementById('qBack').onclick = () => {
  document.getElementById('reader').style.display = '';
  document.getElementById('quiz').style.display = 'none';
};

/* ============ 启动：支持 read.html#bN 直开某本书 ============ */
renderShelf();
(function () {
  const m = (location.hash || '').match(/^#(b\d+)$/);
  if (m && BOOKS.some(b => b.id === m[1])) openBook(m[1]);
})();
</script>
