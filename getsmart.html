<!DOCTYPE html>

<head>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=44">
<style>
/* ---- Get Smart 学堂专属样式（其余复用全站） ---- */
.gs-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gs-level{background:#fff;border-radius:22px;border:3px solid var(--sky2);box-shadow:0 5px 0 rgba(45,49,66,.08);padding:16px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.gs-level:hover{transform:translateY(-4px);border-color:var(--lemon)}
.gs-level.now{border-color:#FF6B6B;box-shadow:0 5px 0 rgba(255,107,107,.25)}
.gs-level .gle{font-size:40px;line-height:1.1}
.gs-level b{display:block;margin-top:4px;font-size:1rem}
.gs-level small{color:#6B7280;font-size:.72rem;display:block;margin-top:2px}
.gs-badge{position:absolute;top:-10px;right:-6px;background:#FF6B6B;color:#fff;font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.gs-prog{height:10px;background:#EEF3F8;border-radius:999px;overflow:hidden;margin-top:8px}
.gs-prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--lake))}
.gs-modhead{margin:20px 0 10px;font-size:1.02rem;font-weight:800;color:#374151;display:flex;align-items:center;gap:8px}
.gs-modhead small{font-weight:400;color:#6B7280;font-size:.78rem}
.gs-unit{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;border:3px solid var(--sky2);box-shadow:0 4px 0 rgba(45,49,66,.07);padding:13px 14px;cursor:pointer;transition:.13s;margin-bottom:10px}
.gs-unit:hover{transform:translateY(-2px);border-color:var(--lemon)}
.gs-unit.done{border-color:#BBE5C0;background:#F7FCF7}
.gs-unit .gu-ic{font-size:30px;flex:none}
.gs-unit .gu-main{flex:1;min-width:0}
.gs-unit .gu-main b{font-size:.98rem}
.gs-unit .gu-main small{display:block;color:#6B7280;font-size:.74rem;margin-top:2px}
.gs-unit .gu-st{flex:none;font-size:.8rem;font-weight:800;color:#4E9E59}
.gs-unit .gu-st.todo{color:#9CA3AF}
.gs-catch{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF4E0,#FFE9EC);border:3px solid var(--coral);border-radius:20px;padding:13px 16px;margin:0 0 14px}
.gs-steps{display:flex;gap:6px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.gs-step{font-size:.72rem;font-weight:800;color:#9CA3AF;background:#F3F4F6;border-radius:999px;padding:4px 12px}
.gs-step.on{color:#fff;background:var(--lake)}
.gs-step.lk{cursor:pointer}
.gs-step.lk:hover{filter:brightness(.95)}
.gs-step.ok{color:#4E9E59;background:#E8F7EB}
.gs-bigword{text-align:center;padding:10px 0 4px}
.gs-bigword .gw-ic{font-size:88px;line-height:1.15;display:block}
.gs-bigword .gw-word{font-size:2.1rem;font-weight:900;letter-spacing:.5px;margin:6px 0 0}
.gs-bigword .gw-ipa{color:#6B7280;font-size:1rem;min-height:1.4em}
.gs-bigword .gw-zh{font-size:1.15rem;font-weight:800;color:var(--ink);margin:2px 0 8px}
.gs-sent{background:#FAFDFF;border:3px dashed var(--lake);border-radius:16px;padding:10px 14px;margin-top:10px;text-align:left;font-size:.95rem;line-height:1.7}
.gs-navrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.gs-sentcard{background:#fff;border-radius:18px;border:3px solid var(--sky2);padding:14px 16px;margin-bottom:12px}
.gs-sentcard .se{font-size:1.25rem;font-weight:800;line-height:1.6}
.gs-sentcard .sz{color:#6B7280;font-size:.9rem;margin-top:4px}
.gs-num{display:inline-flex;align-items:center;justify-content:center;min-width:62px;height:62px;padding:0 10px;border-radius:14px;background:#FFF7DA;border:3px solid var(--lemon);font-size:1.45rem;font-weight:900;color:var(--ink)}
</style>

<body>
  <div id="bootLoader" style="position:fixed;inset:0;background:#E8F4FD;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:12px;transition:opacity .3s">

<main>

    <p>课本同步专栏 · <b>Get Smart 1 - 6 全系列</b> · 每一课 = 教材一个单元，按「学单词 → 听音辨词 → 认词选义 → 句型闯关」四步学懂一课</p>
  </div>

<div style="text-align:center;margin-top:20px;font-size:.75rem"><a href="disclaimer.html" style="color:#78909C">📋 免责声明 · 隐私政策 · 使用条款</a></div></main>

<script src="js/words-data.js?v=32"></script>
<script src="svg/word-svg.js?v=3"></script>
<script src="svg/emoji-svg.js?v=2"></script>

<script>
renderNav('getsmart'); renderDecor();

/* $/esc/iconOf/playDictAudio 等全部来自 app.js，这里只补页面自己的工具 */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

/* ---------- 进度（按档案隔离） ----------
   gsEnsure：切档案后 Store.d.getsmart 可能还没建，任何入口先兜底。 */
function gsEnsure() { if (!Store.d.getsmart) Store.d.getsmart = {}; }
gsEnsure();
const gsDone = uid => { gsEnsure(); return !!Store.d.getsmart[uid]; };
const levelDone = lv => { gsEnsure(); return lv.units.filter(u => gsDone(u.id)).length; };
function gsMarkDone(uid, stars) {
  gsEnsure();
  const old = Store.d.getsmart[uid];
  Store.d.getsmart[uid] = { t: Date.now(), stars: Math.max(stars, old ? old.stars : 0) };
  markActivity('getsmart'); completeDailyTask('words'); Store.save();
}

/* ---------- 视图状态 ---------- */
let view = 'levels', curLevel = null, curUnit = null;
let L = null;   /* 当前课的运行时状态 */
let __lessonToken = 0;  /* 作废旧计时器/旧音频链 */

/* ================= 教材总览（六册选书） ================= */
function renderLevels() {
  view = 'levels'; stopAllSpeech(); __lessonToken++;
  $('#app').innerHTML = `
    <div class="card" style="border-color:var(--lemon)">
      <h2>🎒 学哪一册？</h2>
      <p style="margin:6px 0 0;color:#5C6273;font-size:.88rem;line-height:1.8">
        和学校的 <b>Get Smart 课本</b> 一课一课对应：每个格子就是课本里的一个单元（或复习课）。
        点开就能学——不用怕请假落下，<b>落下的课会排在最前面等你补上</b>。
        <b>「正在学」跟着每个小伙伴的档案走</b>，兄妹俩各学各的互不打扰。</p>
      <div style="margin-top:12px"><button class="btn grape big" onclick="renderTodayFlow()">🚀 今天学什么？一键任务 ▶</button></div>
    </div>
    <div class="gs-levels" style="margin-top:14px">
      ${GS_LEVELS.map(lv => {
        const dn = levelDone(lv), all = lv.units.length;
        const isNow = lv.id === gsActiveLevelId();
        return `<div class="gs-level ${isNow ? 'now' : ''}" onclick="openLevel('${lv.id}')">
          ${isNow ? '<span class="gs-badge">📍 正在学</span>' : ''}
          <span class="gle">${lv.emoji}</span>
          <b>${lv.name}</b>
          <small>${lv.zh}</small>
          <div class="gs-prog"><i style="width:${all ? Math.round(dn / all * 100) : 0}%"></i></div>
          <small style="margin-top:6px;font-weight:800;color:#4E9E59">${dn} / ${all} 课</small>
        </div>`;
      }).join('')}
    </div>`;
}

function openLevel(lid) {
  curLevel = GS_LEVELS.find(l => l.id === lid); if (!curLevel) return;
  view = 'level'; stopAllSpeech(); __lessonToken++;
  renderLevelHome();
}

/* 「正在学」跟档案走：给当前档案设定在学的册 */
function gsSetActive(lid) {
  gsSetActiveLevel(lid);
  curLevel = GS_LEVELS.find(l => l.id === lid) || curLevel;
  const lv = GS_LEVELS.find(l => l.id === lid);
  toast('📍 已设为「' + (lv ? lv.name : lid) + '」正在学');
  renderLevelHome();
}

/* ================= 一册的课程表 ================= */
function renderLevelHome() {
  const lv = curLevel;
  const dn = levelDone(lv);
  /* 补课 = 按顺序第一节没学过的正课 */
  const firstGap = lv.units.find(u => u.kind === 'unit' && !gsDone(u.id));
  const byModule = [];
  lv.units.forEach(u => {
    const mk = u.mod || 0;
    if (!byModule[mk]) byModule[mk] = [];
    byModule[mk].push(u);
  });
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevels()">← 换一册</button>
    <div class="card" style="border-color:${lv.color}">
      <h2>${lv.emoji} ${lv.name} <small style="font-weight:400;color:#5C6273">已完成 ${dn}/${lv.units.length} 课</small></h2>
      <div class="gs-prog" style="margin-top:10px"><i style="width:${Math.round(dn / lv.units.length * 100)}%"></i></div>
      <div style="margin-top:12px">${gsActiveLevelId() === lv.id
        ? '<span class="gs-step on">📍 正在学这一册</span>'
        : `<button class="btn mint" onclick="gsSetActive('${lv.id}')">📍 设为正在学</button>`}</div>
    </div>
    <div style="margin-top:14px">
      ${byModule.map((us, mi) => us.length ? `
        ${us[0].modName ? `<div class="gs-modhead">${us[0].modEmoji || '📘'} ${us[0].modName}</div>` : ''}
        ${us.map(u => {
          const dn2 = gsDone(u.id);
          return `<div class="gs-unit ${dn2 ? 'done' : ''}" onclick="startUnit('${u.id}')">
            <span class="gu-ic">${u.kind === 'review' ? '🔁' : '📖'}</span>
            <div class="gu-main">
              <b>${u.title}</b>
              <small>${u.zh}${u.words && u.words.length ? ' · ' + u.words.length + ' 词' : ''}${u.kind === 'review' ? ' · 混合闯关' : ''}</small>
            </div>
            <span class="gu-st ${dn2 ? '' : 'todo'}">${dn2 ? '⭐' + (Store.d.getsmart[u.id].stars || 0) + ' ✅' : '未学 ▶'}</span>
          </div>`;
        }).join('')}
        ${moduleTestCardHtml(lv, us)}` : '').join('')}
    </div>`;
}

/* ================= 上课（四步法） ================= */
function unitById(uid) {
  for (const lv of GS_LEVELS) { const u = lv.units.find(x => x.id === uid); if (u) return { lv, u }; }
  return null;
}
function startUnit(uid) {
  const found = unitById(uid); if (!found) return;
  curLevel = found.lv; curUnit = found.u; view = 'unit';
  stopAllSpeech(); __lessonToken++;
  const u = curUnit;
  if (u.kind === 'review') {
    /* 复习课：把来源单元的词和句混成一套闯关题 */
    const srcWords = [];
    const srcSents = [];
    (u.from || []).forEach(fid => {
      const f = unitById(fid); if (!f) return;
      (f.u.words || []).forEach(w => { if (!srcWords.some(x => x.w === w.w)) srcWords.push(w); });
      (f.u.sentences || []).forEach(s => srcSents.push(s));
    });
    L = { kind: 'review', step: 1, qs: buildReviewQs(srcWords, srcSents, u.count || 10), qIdx: 0, score: 0, firstTry: true, lock: false, words: srcWords };
    renderStep();
    return;
  }
  L = { kind: 'unit', step: 0, wIdx: 0, sIdx: 0, qs: [], qIdx: 0, score: 0, firstTry: true, lock: false };
  (u.words || []).forEach(w => prewarmWord(w.w));
  renderStep();
}

const STEP_NAMES = ['学单词', '听音辨词', '认词选义', '句型闯关', '完成'];
function stepBar() {
  if (L.kind === 'test') return '<div class="gs-steps"><span class="gs-step on">📝 单元小测</span></div>';
  if (L.kind === 'flowreview') return '<div class="gs-steps"><span class="gs-step on">🔔 今日复习</span></div>';
  const n = L.kind === 'review' ? 2 : 5;
  let items = '';
  for (let i = 1; i <= n; i++) {
    const label = L.kind === 'review' ? (i === 1 ? '混合闯关' : '完成') : STEP_NAMES[i - 1];
    const cls = i < L.step ? 'ok' : i === L.step ? 'on' : '';
    const clickable = L.kind !== 'review' && i >= 1 && i <= 3;
    items += `<span class="gs-step ${cls} ${clickable ? 'lk' : ''}" ${clickable ? `onclick="gsJump(${i})" title="点这里切换步骤"` : ''}>${label}</span>`;
  }
  return `<div class="gs-steps">${items}</div>`;
}
/* 步骤条可点击：已到过的步骤随意跳，往回重练；没到的会提示先完成当前步骤 */
function gsJump(i) {
  if (!L || L.kind === 'review') return;
  if (i === 4) { toast('完成页在闯关结束后自动打开 🏁'); return; }
  if (i > (L.maxStep || L.step)) { toast('先完成当前步骤，后面会自动解锁哦'); return; }
  __lessonToken++;
  stopAllSpeech();
  const u = curUnit;
  if (i === 1) { L.step = 1; const n = (u.words || []).length; L.wIdx = Math.max(0, Math.min(L.wIdx || 0, n - 1)); if (!n) { L.step = 2; } }
  if (i === 2) { if (!L.qs || !L.qs.length) { L.qs = buildUnitQs(u); L.score = L.score || 0; } L.qIdx = 0; L.step = 2; }
  if (i === 3) { L.step = 3; L.sIdx = 0; }
  renderStep();
}

function renderStep() {
  const u = curUnit;
  L.maxStep = Math.max(L.maxStep || 0, L.step);
  if (L.step === 0) return renderIntro();
  if (L.step === 1) return L.kind === 'review' ? renderQuiz() : renderLearn();
  if (L.step === 2) return renderQuiz();
  if (L.step === 3) return renderSentences();
  return renderFinish();
}

/* ---- Step 0 开场 ---- */
function renderIntro() {
  const u = curUnit, lv = curLevel;
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevelHome()">← 回课程表</button>
    ${stepBar()}
    <div class="card bounce-in" style="max-width:620px;margin:0 auto;text-align:center;border-color:${lv.color}">
      <div style="font-size:56px">${u.kind === 'review' ? '🔁' : (lv.emoji)}</div>
      <h2 style="justify-content:center">${u.title}</h2>
      <p style="color:#5C6273;margin:4px 0 10px">${u.zh}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px">
        ${(u.words || []).length ? `<span class="gs-step on">📘 ${u.words.length} 个单词</span>` : ''}
        ${(u.sentences || []).length ? `<span class="gs-step on">💬 ${u.sentences.length} 个句型</span>` : ''}
        ${u.grammar ? `<span class="gs-step on">🧩 ${u.grammar}</span>` : ''}
      </div>
      ${u.tip ? `<p style="font-size:.86rem;color:#6B7280;margin:10px 0 0">💡 ${u.tip}</p>` : ''}
      <div style="margin-top:16px"><button class="btn grape big" onclick="L.step=1;renderStep()">🚀 开始上课</button></div>
    </div>`;
}

/* ---- Step 1 学单词（一卡一词） ---- */
function renderLearn() {
  const u = curUnit, w = u.words[L.wIdx];
  const ipa = ipaOf(w.w);
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevelHome()">← 回课程表</button>
    ${stepBar()}
    <div class="card" style="max-width:560px;margin:0 auto">
      <div class="score-bar"><b>📘 学单词</b><span>第 ${L.wIdx + 1} / ${u.words.length} 个</span></div>
      <div class="gs-bigword">
        <span class="gw-ic">${gsIcon(w)}</span>
        <button class="btn coral" style="font-size:1.5rem;margin:8px 0;padding:10px 26px" onclick="speakWord('${jsq(w.w)}')">🔊 ${esc(w.w)}</button>
        <div class="gw-ipa">${ipa ? '/' + esc(ipa) + '/' : ''}</div>
        <div class="gw-zh">${esc(w.zh)}</div>
        ${w.sent ? `<div class="gs-sent">💬 <b lang="en">${esc(w.sent)}</b>　<button class="mini-speaker" onclick="speakSentence('${jsq(w.sent)}')">🔊</button><br><span style="color:#6B7280">${esc(w.sentZh || '')}</span></div>` : ''}
      </div>
      <div class="gs-navrow">
        ${L.wIdx > 0 ? '<button class="btn ghost big" onclick="L.wIdx--;renderStep()">◀ 上一个</button>' : ''}
        <button class="btn grape big" onclick="gsNextWord()">${L.wIdx === u.words.length - 1 ? '都认识啦 ▶' : '下一个 ▶'}</button>
      </div>
    </div>`;
  prewarmWord(u.words[L.wIdx + 1] ? u.words[L.wIdx + 1].w : '');
}
function gsNextWord() {
  const u = curUnit;
  if (L.wIdx >= u.words.length - 1) {
    L.step = 2;
    L.qs = buildUnitQs(u);
    L.qIdx = 0; L.score = 0;
    renderStep();
  } else { L.wIdx++; renderStep(); }
}

/* ---- 出题器 ---- */
/* 数字词用真数字块显示（eleven→11），避免所有数字共用一个 emoji 图 */
const GS_NUM = { eleven:'11', twelve:'12', thirteen:'13', fourteen:'14', fifteen:'15', sixteen:'16', seventeen:'17', eighteen:'18', nineteen:'19', twenty:'20', thirty:'30', forty:'40', fifty:'50', sixty:'60', seventy:'70', eighty:'80', ninety:'90', hundred:'100' };
/* 颜色词一律画实色色块（课本教颜色的方式）：
   🔴🔵⚪ 这类圆形 emoji 一来部分设备渲染发白/空白，二来白色在白卡上隐形 */
const GS_COLORS = {
  red: '#EF4444', blue: '#3B82F6', yellow: '#FACC15', green: '#22C55E',
  white: '#FFFFFF', black: '#1F2937', orange: '#F97316', pink: '#F472B6',
  purple: '#A855F7', brown: '#92400E', grey: '#9CA3AF', gray: '#9CA3AF',
  gold: '#D4A017', silver: '#C0C0C0'
};
function gsIcon(w) {
  const name = String(w.w).toLowerCase();
  const n = GS_NUM[name];
  if (n) return '<span class="gs-num">' + n + '</span>';
  if (GS_COLORS[name]) return '<span class="gs-num" style="background:' + GS_COLORS[name] + ';border:3px solid rgba(45,49,66,.22)"></span>';
  return iconOf(w);
}
/* 图选项必须互不相同：有任何重复就整体退回文字选项（孩子永远能选）。
   系统 emoji 渲染因设备而异（部分机型空白），出现即整题退回文字。 */
function imgOpts(list) {
  const htmls = list.map(gsIcon);
  if (!list.every(hasIcon) || new Set(htmls).size !== list.length) return null;
  if (htmls.some(h => h.includes('class="emj"'))) return null;
  return htmls;
}
function buildUnitQs(u) {
  const ws = u.words || [];
  /* 词少的课从同模块相邻课借干扰项，保证每课都有听辨/认义练习 */
  const siblings = curLevel.units
    .filter(x => x.kind === 'unit' && x.id !== u.id)
    .flatMap(x => (x.words || []))
    .filter(x => !ws.some(w => w.w === x.w));
  const distractFor = w => shuffle(ws.filter(x => x.w !== w.w)).concat(shuffle(siblings)).slice(0, 3);
  const qs = [];
  /* 听音辨词 6 题：图选项需 4 图互异，否则单词文字 */
  shuffle(ws).slice(0, 6).forEach(w => {
    const distract = distractFor(w);
    if (distract.length < 3) return;
    const list = shuffle([w, ...distract]);
    const imgs = imgOpts(list);
    qs.push({ type: 'listen', word: w, ok: w.w,
      opts: list.map((x, i) => ({ key: x.w, html: imgs ? imgs[i] : `<b lang="en">${esc(x.w)}</b>` })) });
  });
  /* 认词选义 6 题 */
  shuffle(ws).slice(0, 6).forEach(w => {
    const distract = distractFor(w);
    if (distract.length < 3) return;
    qs.push({ type: 'look', word: w, ok: w.zh,
      opts: shuffle([w, ...distract]).map(x => ({ key: x.zh, html: esc(x.zh) })) });
  });
  return shuffle(qs);
}
function buildReviewQs(words, sents, count) {
  const qs = [];
  const pool = words.slice();
  shuffle(pool).forEach(w => {
    const distract = shuffle(words.filter(x => x.w !== w.w)).slice(0, 3);
    if (distract.length < 3 || qs.length >= count - Math.min(2, sents.length)) return;
    const list = shuffle([w, ...distract]);
    const imgs = imgOpts(list);
    const qType = Math.random() < 0.5 ? 'listen' : 'look';
    qs.push({ type: qType, word: w, ok: w.w,
      opts: list.map((x, i) => ({ key: x.w, html: imgs ? imgs[i] : `<b lang="en">${esc(x.w)}</b>` })) });
  });
  /* 句型填空 1-2 题 */
  shuffle(sents).slice(0, 2).forEach(s => {
    const q = sentBlank(s.en);
    if (q) qs.push({ type: 'sent', sent: s, ok: q.answer, opts: shuffle([q.answer, ...q.distract]).map(x => ({ key: x, html: `<b lang="en">${esc(x)}</b>` })), blankText: q.text });
  });
  return shuffle(qs).slice(0, count);
}
/* 把句子里一个实词挖空 */
function sentBlank(en) {
  const words = en.replace(/[.!?]+$/, '').split(/\s+/).filter(x => /^[A-Za-z]{3,}$/.test(x));
  if (!words.length) return null;
  const answer = pick(words);
  const distract = shuffle(words.filter(x => x !== answer)).slice(0, 2);
  if (distract.length < 2) return null;
  return { text: en.replace(answer, '＿＿＿'), answer, distract };
}

/* ---- Step 2/4 答题 ---- */
function renderQuiz() {
  const u = curUnit;
  if (L.qIdx >= L.qs.length) {
    if (L.kind === 'review' || L.kind === 'test' || L.kind === 'flowreview') { L.step = 4; return renderFinish(); }
    L.step = 3; L.sIdx = 0; return renderStep();
  }
  const q = L.qs[L.qIdx];
  const label = q.type === 'listen' ? '👂 听音辨词' : q.type === 'look' ? '👀 认词选义' : '💬 句型闯关';
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevelHome()">← 回课程表</button>
    ${stepBar()}
    <div class="card" style="max-width:620px;margin:0 auto;text-align:center">
      <div class="score-bar"><b>${label} · ${curUnit.kind === 'review' ? '复习课' : curUnit.title}</b><span>第 ${L.qIdx + 1} / ${L.qs.length} 题 · ✅ ${L.score}</span></div>
      ${q.type === 'listen' ? `<button class="btn coral big" style="font-size:1.4rem;margin:6px 0 12px" onclick="playDictAudio('${jsq(q.word.w)}')">🔊 点我听</button>` : ''}
      ${q.type === 'look' ? `<div class="quiz-q">「<b style="font-size:1.3rem;color:#9B72FF">${esc(q.word.w)}</b>」是什么意思？ <button class="mini-speaker" onclick="playDictAudio('${jsq(q.word.w)}')">🔊</button></div>` : ''}
      ${q.type === 'sent' ? `<div class="quiz-q" lang="en" style="font-size:1.2rem">${esc(q.blankText)}</div>` : ''}
      <div class="opt-row">
        ${q.opts.map(o => `<button class="opt" onclick="gsAns(this,'${jsq(o.key)}')">${o.html}</button>`).join('')}
      </div>
      <div class="explain" id="qexp"></div>
    </div>`;
  if (q.type === 'listen') setTimeout(() => playDictAudio(q.word.w), 400);
}
function gsAns(btn, key) {
  if (L.lock) return;
  const q = L.qs[L.qIdx];
  const ok = key === q.ok;
  if (ok) L.lock = true;
  feedback(btn, ok);
  if (ok) {
    if (L.firstTry) { L.score++; addStars(1); flyStar(btn); }
    sfx.correct();
    if (q.word) touchWord(q.word.w, true);
    $('#qexp').innerHTML = q.word ? `✅ <b>${esc(q.word.w)}</b> ${esc(q.word.zh)}` : `✅ <b>${esc(q.ok)}</b>`;
    setTimeout(() => { L.qIdx++; L.firstTry = true; L.lock = false; renderQuiz(); }, 1400);
  } else {
    L.firstTry = false; sfx.wrong();
    if (q.word) touchWord(q.word.w, false);
    $('#qexp').innerHTML = `🤔 再想想哦～`;
  }
}

/* ---- Step 3 句型 ---- */
function renderSentences() {
  const u = curUnit;
  const sents = u.sentences || [];
  if (!sents.length || L.sIdx >= sents.length) { L.step = 4; return renderStep(); }
  const s = sents[L.sIdx];
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevelHome()">← 回课程表</button>
    ${stepBar()}
    <div class="card" style="max-width:620px;margin:0 auto">
      <div class="score-bar"><b>💬 句型闯关</b><span>第 ${L.sIdx + 1} / ${sents.length} 句</span></div>
      <div class="gs-sentcard" id="sentBox" onclick="speakSentence('${jsq(s.en)}',this)" title="点一下，跟着读">
        <div class="se" lang="en">${esc(s.en)}</div>
        <div class="sz">${esc(s.zh)}</div>
      </div>
      <div style="text-align:center;margin:6px 0">
        <button class="btn ghost" onclick="speakSentence('${jsq(s.en)}')">🔊 再听一遍</button>
      </div>
      <p style="text-align:center;color:#6B7280;font-size:.85rem">大声跟着读两遍，再点「会了」👇</p>
      <div class="gs-navrow">
        ${L.sIdx > 0 ? '<button class="btn ghost big" onclick="L.sIdx--;renderStep()">◀ 上一句</button>' : ''}
        <button class="btn grape big" onclick="gsNextSent()">${L.sIdx === sents.length - 1 ? '都会议论啦 ▶' : '会了 ▶'}</button>
      </div>
    </div>`;
  setTimeout(() => speakSentence(s.en), 500);
}
function gsNextSent() {
  const u = curUnit;
  if (L.sIdx >= (u.sentences || []).length - 1) { L.step = 4; L.score += 0; renderStep(); }
  else { L.sIdx++; renderStep(); }
}

/* ---- Step 完成 ---- */
function renderFinish() {
  if (L.kind === 'test') return renderTestFinish();
  if (L.kind === 'flowreview') return renderFlowDone();
  const u = curUnit, lv = curLevel;
  const total = L.qs.length || 1;
  const perfect = L.score >= total;
  const bonus = L.kind === 'review' ? 3 : 2;
  addStars(bonus);
  gsMarkDone(u.id, L.score);
  confetti(); sfx.win();
  const next = nextUnitOf(lv, u);
  __lessonToken++;
  $('#app').innerHTML = `
    <div class="card bounce-in" style="max-width:560px;margin:0 auto;text-align:center;padding:34px 24px">
      <div style="font-size:70px">${perfect ? '🏆' : '🌟'}</div>
      <h2 style="justify-content:center">${perfect ? '全对！这节课学完啦！' : '这节课完成啦！'}</h2>
      <p style="font-size:1.05rem">闯关答对 <b style="color:#FF6B6B;font-size:1.5rem">${L.score}</b> / ${total} 题 · 奖励 +${bonus} ⭐</p>
      <p style="color:#5C6273;font-size:.85rem">学过的单词已自动排好复习计划：1 天后、2 天后、4 天后、7 天后、15 天后提醒。</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        ${next ? `<button class="btn grape big" onclick="startUnit('${next.id}')">下一课：${next.title} ▶</button>` : `<button class="btn grape big" onclick="renderLevels()">🎓 这一册通关啦！</button>`}
        <button class="btn ghost big" onclick="renderLevelHome()">课程表</button>
      </div>
    </div>`;
}
function nextUnitOf(lv, u) {
  const i = lv.units.findIndex(x => x.id === u.id);
  return i >= 0 && i + 1 < lv.units.length ? lv.units[i + 1] : null;
}

/* ================= 单元小测（模拟学校考试） =================
   每个 Module 自动生成一张卷子：听力 4 + 词汇 4 + 句型 3 = 11 题，
   按学校习惯评级：优(≥90%) / 良(≥75%) / 达标(≥60%)。学完本模块解锁。 */
function testGradeOf(pct) {
  if (pct >= 0.9) return { g: '优', emoji: '🏅', msg: '全班最棒！课本内容掌握得扎扎实实！' };
  if (pct >= 0.75) return { g: '良', emoji: '🎖️', msg: '很棒！再巩固几个词就是优！' };
  if (pct >= 0.6) return { g: '达标', emoji: '✅', msg: '及格啦！把错的词再练一练，下次冲良！' };
  return { g: '继续加油', emoji: '💪', msg: '把这一模块的单词回去再学一遍，随时回来重测！' };
}
function moduleTestId(lid, mod) { return lid + '-m' + mod + '-test'; }
function moduleLessons(lv, mod) { return lv.units.filter(u => u.mod === mod && u.kind === 'unit'); }
function startModuleTest(lid, mod) {
  const lv = GS_LEVELS.find(l => l.id === lid); if (!lv) return;
  const lessons = moduleLessons(lv, mod);
  const words = []; const sents = [];
  lessons.forEach(u => {
    (u.words || []).forEach(w => { if (!words.some(x => x.w === w.w)) words.push(w); });
    (u.sentences || []).forEach(s => { if (!sents.some(x => x.en === s.en)) sents.push(s); });
  });
  if (words.length < 4) { toast('这一模块的词还不够出卷，先学完各课哦'); return; }
  const qs = [];
  shuffle(words).slice(0, 4).forEach(w => {
    const d = shuffle(words.filter(x => x.w !== w.w)).slice(0, 3);
    if (d.length < 3) return;
    const list = shuffle([w, ...d]);
    const imgs = imgOpts(list);
    qs.push({ type: 'listen', word: w, ok: w.w, opts: list.map((x, i) => ({ key: x.w, html: imgs ? imgs[i] : `<b lang="en">${esc(x.w)}</b>` })) });
  });
  shuffle(words).slice(0, 4).forEach(w => {
    const d = shuffle(words.filter(x => x.w !== w.w)).slice(0, 3);
    if (d.length < 3) return;
    qs.push({ type: 'look', word: w, ok: w.zh, opts: shuffle([w, ...d]).map(x => ({ key: x.zh, html: esc(x.zh) })) });
  });
  shuffle(sents).slice(0, 3).forEach(s => {
    const qb = sentBlank(s.en);
    if (qb) qs.push({ type: 'sent', sent: s, ok: qb.answer, opts: shuffle([qb.answer, ...qb.distract]).map(x => ({ key: x, html: `<b lang="en">${esc(x)}</b>` })), blankText: qb.text });
  });
  if (qs.length < 4) { toast('题目还没凑齐，先去把各课学完吧'); return; }
  curLevel = lv;
  curUnit = { id: moduleTestId(lid, mod), kind: 'test', title: 'Module ' + mod + ' 单元小测', zh: '听力 + 词汇 + 句型', words };
  L = { kind: 'test', step: 2, qs, qIdx: 0, score: 0, firstTry: true, lock: false, lid, mod, maxStep: 2 };
  view = 'unit'; stopAllSpeech(); __lessonToken++;
  renderStep();
}
function renderTestFinish() {
  const total = L.qs.length || 1;
  const pct = L.score / total;
  const gr = testGradeOf(pct);
  const bonus = gr.g === '优' ? 3 : gr.g === '良' ? 2 : 1;
  addStars(bonus);
  gsEnsure();
  const tid = curUnit.id;
  const old = Store.d.getsmart[tid];
  const bestPct = Math.max(pct, old && old.pct !== undefined ? old.pct : 0);
  Store.d.getsmart[tid] = { t: Date.now(), stars: Math.max(bonus, old ? old.stars || 0 : 0), pct: bestPct };
  markActivity('getsmart'); Store.save();
  if (pct >= 0.6) confetti();
  sfx.win(); __lessonToken++;
  $('#app').innerHTML = `
    <div class="card bounce-in" style="max-width:560px;margin:0 auto;text-align:center;padding:34px 24px">
      <div style="font-size:70px">${gr.emoji}</div>
      <h2 style="justify-content:center">单元小测成绩：${gr.g}</h2>
      <p style="font-size:1.05rem">答对 <b style="color:#FF6B6B;font-size:1.5rem">${L.score}</b> / ${total} 题 · 奖励 +${bonus} ⭐</p>
      <p style="color:#5C6273;font-size:.92rem">${gr.msg}</p>
      <p style="color:#9CA3AF;font-size:.78rem">历史最好成绩：${Math.round(bestPct * 100)} 分（满分 100）</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        <button class="btn grape big" onclick="startModuleTest('${L.lid}',${L.mod})">🔁 再测一次</button>
        <button class="btn ghost big" onclick="renderLevelHome()">📖 回课程表</button>
      </div>
    </div>`;
}
function moduleTestCardHtml(lv, us) {
  const mod = us[0].mod;
  if (!us.some(u => u.kind === 'unit')) return '';
  const tid = moduleTestId(lv.id, mod);
  const allDone = us.filter(u => u.kind === 'unit').every(u => gsDone(u.id));
  if (!allDone) {
    return `<div class="gs-unit" style="opacity:.55;cursor:default" onclick="toast('学完本模块的课程，小测就会解锁哦')">
      <span class="gu-ic">📝</span>
      <div class="gu-main"><b>Module ${mod} 单元小测</b><small>模拟学校考试 · 学完本模块后解锁</small></div>
      <span class="gu-st todo">🔒</span>
    </div>`;
  }
  const rec = Store.d.getsmart[tid];
  const gr = rec && rec.pct !== undefined ? testGradeOf(rec.pct) : null;
  return `<div class="gs-unit ${rec ? 'done' : ''}" onclick="startModuleTest('${lv.id}',${mod})">
    <span class="gu-ic">📝</span>
    <div class="gu-main"><b>Module ${mod} 单元小测</b><small>模拟学校考试 · 听力 + 词汇 + 句型</small></div>
    <span class="gu-st ${rec ? '' : 'todo'}">${rec && gr ? gr.emoji + ' ' + gr.g : '开考 ▶'}</span>
  </div>`;
}

/* ================= 一键今日任务流 =================
   ① 补上落下的 GS 课 → ② 复习到期单词 → ③ 玩一局游戏。
   三步全完成当日 +5 ⭐（每天一次）。 */
function gsFlowState() {
  try {
    const d = new Date(); const p = n => String(n).padStart(2, '0');
    const today = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const due = (typeof dueWords === 'function') ? dueWords().length : 0;
    const act = (Store.d.activity || {})[today] || {};
    let gap = null;
    const lv = GS_LEVELS.find(l => l.id === gsActiveLevelId());
    if (lv) { const g = lv.units.find(u => u.kind === 'unit' && !gsDone(u.id)); gap = g ? { id: g.id, title: g.title } : null; }
    return { today, due, games: act.games || 0, gap };
  } catch (e) { return { today: '', due: 0, games: 0, gap: null }; }
}
function renderTodayFlow() {
  view = 'flow'; stopAllSpeech(); __lessonToken++; gsEnsure();
  const st = gsFlowState();
  const bonusGot = Store.d.flowBonus === st.today;
  const steps = [
    { n: 1, icon: '📖', title: '补上落下的课', desc: st.gap ? st.gap.title : '没有落下的课，太棒了！', done: !st.gap, act: st.gap ? `startUnitFlow('${st.gap.id}')` : null },
    { n: 2, icon: '🔔', title: '复习到期单词', desc: st.due > 0 ? st.due + ' 个单词到复习时间了' : '今天没有到期复习', done: st.due === 0, act: st.due > 0 ? 'startFlowReview()' : null },
    { n: 3, icon: '🎮', title: '玩一局游戏巩固', desc: st.games > 0 ? '今天已经玩过啦' : '去游戏乐园玩一局', done: st.games > 0, act: st.games > 0 ? null : `location.href='games.html'` },
  ];
  const doneN = steps.filter(s => s.done).length;
  const allDone = doneN === 3 && !bonusGot;
  $('#app').innerHTML = `
    <button class="btn ghost" style="margin-bottom:12px" onclick="renderLevels()">← 换一册</button>
    <div class="card" style="border-color:var(--mint)">
      <h2>🚀 今天学什么？<small style="font-weight:400;color:#5C6273">已完成 ${doneN}/3</small></h2>
      <p style="margin:6px 0 0;color:#5C6273;font-size:.88rem;line-height:1.8">三步走完约 15 分钟：补课 → 复习 → 巩固。全部完成 <b>奖励 5 颗星星</b>！</p>
    </div>
    <div style="margin-top:14px">
      ${steps.map(s => `
        <div class="gs-unit ${s.done ? 'done' : ''}" onclick="${s.act ? s.act : `toast('这一步已经完成啦 ✅')`}">
          <span class="gu-ic">${s.icon}</span>
          <div class="gu-main"><b>${s.n}️⃣ ${s.title}</b><small>${s.desc}</small></div>
          <span class="gu-st ${s.done ? '' : 'todo'}">${s.done ? '✅' : '开始 ▶'}</span>
        </div>`).join('')}
    </div>
    ${bonusGot ? `<p style="text-align:center;color:#4E9E59;font-weight:800;margin-top:14px">🎉 今日任务奖励已领取！</p>` : (allDone ? '' : `<p style="text-align:center;color:#9CA3AF;font-size:.8rem;margin-top:14px">三步全部完成可领 5 ⭐ 哦</p>`)}`;
  if (allDone) {
    Store.d.flowBonus = st.today; addStars(5); Store.save();
    confetti(); sfx.win();
    toast('🎉 今日任务全部完成！奖励 5 颗星星！');
  }
}
function startUnitFlow(uid) {
  L = null; startUnit(uid);
  L.returnFlow = true;
}
function startFlowReview() {
  gsEnsure();
  let due = (typeof dueWords === 'function') ? dueWords().slice(0, 10) : [];
  const ALLB = {};
  THEMES.forEach(t => t.words.forEach(w => { if (!ALLB[w.w]) ALLB[w.w] = w; }));
  const ws = due.map(w => ALLB[w]).filter(Boolean).filter(w => hasIcon(w));
  if (!ws.length) { toast('今天没有到期复习'); return; }
  const qs = [];
  shuffle(ws).forEach(w => {
    const d = shuffle(ws.filter(x => x.w !== w.w)).slice(0, 3);
    if (d.length < 3 || qs.length >= 10) return;
    if (Math.random() < 0.5) {
      const list = shuffle([w, ...d]);
      const imgs = imgOpts(list);
      qs.push({ type: 'listen', word: w, ok: w.w, opts: list.map((x, i) => ({ key: x.w, html: imgs ? imgs[i] : `<b lang="en">${esc(x.w)}</b>` })) });
    } else {
      qs.push({ type: 'look', word: w, ok: w.zh, opts: shuffle([w, ...d]).map(x => ({ key: x.zh, html: esc(x.zh) })) });
    }
  });
  if (!qs.length) { toast('今天没有到期复习'); return; }
  curLevel = GS_LEVELS.find(l => l.id === gsActiveLevelId()) || curLevel;
  curUnit = { id: 'flow-review', kind: 'flowreview', title: '今日复习', zh: '到期单词大复习', words: ws };
  L = { kind: 'flowreview', step: 2, qs, qIdx: 0, score: 0, firstTry: true, lock: false };
  view = 'unit'; stopAllSpeech(); __lessonToken++;
  renderStep();
}
function renderFlowDone() {
  sfx.win(); if (L.score >= L.qs.length * 0.8) confetti();
  const st = gsFlowState();
  const allDone = !st.gap && st.games > 0;
  let bonusMsg = '';
  if (allDone && Store.d.flowBonus !== st.today) {
    Store.d.flowBonus = st.today; addStars(5); Store.save();
    bonusMsg = '<p style="color:#4E9E59;font-weight:800">🎉 今日三步全部完成！奖励 5 颗星星！</p>';
    confetti();
  }
  $('#app').innerHTML = `
    <div class="card bounce-in" style="max-width:560px;margin:0 auto;text-align:center;padding:34px 24px">
      <div style="font-size:70px">🔔</div>
      <h2 style="justify-content:center">复习完成！</h2>
      <p style="font-size:1.05rem">答对 <b style="color:#FF6B6B;font-size:1.5rem">${L.score}</b> / ${L.qs.length} 题</p>
      ${bonusMsg}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        <button class="btn grape big" onclick="renderTodayFlow()">回到今日任务 ▶</button>
        <button class="btn ghost big" onclick="renderLevelHome()">课程表</button>
      </div>
    </div>`;
}

/* 启动：默认打开"正在学"的那一册；带 flow=1 参数则直接进今日任务流 */
(function init() {
  const params = new URLSearchParams(location.search);
  if (params.get('flow') === '1') { renderTodayFlow(); return; }
  const now = GS_LEVELS.find(l => l.id === gsActiveLevelId());
  if (now) { curLevel = now; view = 'level'; renderLevelHome(); }
  else renderLevels();
})();

/* 进入页面即后台预载当前册全部发音（手机首次进来不等网络） */
(function () {
  const lv = GS_LEVELS.find(l => l.id === gsActiveLevelId());
  if (!lv) return;
  const words = new Set();
  lv.units.forEach(u => (u.words || []).forEach(w => { if (w.w) words.add(w.w); }));
  prewarmBatch(Array.from(words), 180);
})();</script>
