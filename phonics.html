/* 拼读课页内样式（不进 style.css：只有这一页用） */
/* ---- 关卡地图 ---- */
/* 13 关分三组：基础 / 组合 / 高阶。组标题一行，关卡卡只留 图标 + 关号 + 名字。 */
.ph-streak{margin:0 2px 10px;font-size:.78rem;color:var(--ink2)}
.ph-earn{margin:12px 0 0;border-top:1px dashed #E7ECF4;padding-top:8px}
.ph-earn>summary{list-style:none;cursor:pointer;font-size:.78rem;font-weight:800;color:#6B7385;display:flex;align-items:center;gap:6px}

.ph-earn>summary::after{content:'▾';margin-left:auto;transition:.15s}
.ph-earn[open]>summary::after{transform:rotate(180deg)}
.ph-map{margin-top:2px}
.ph-grp{margin:12px 2px 6px;font-size:.74rem;font-weight:800;color:#8A93A6;letter-spacing:.4px}
.ph-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ph-lv{flex:0 0 calc((100% - 16px)/3);min-width:0}

.ph-lv{position:relative;background:#fff;border:2px solid #E8EAF0;border-radius:14px;padding:9px 6px 8px;

.ph-lv:hover{transform:translateY(-3px);border-color:var(--lemon)}
.ph-lv.cur{border-color:var(--lake);background:#EFF8FF;outline:3px solid rgba(78,197,241,.25)}
.ph-lv.done{border-color:var(--mint);background:#F2FCF4}
.ph-lv-icon{font-size:1.35rem;line-height:1.15}

.ph-lv-name{display:block;font-size:.78rem;font-weight:800;color:var(--ink);line-height:1.3}
.ph-lv-star{position:absolute;top:4px;right:5px;font-size:.8rem}
.ph-map-note{margin:10px 4px 2px;font-size:.8rem;color:var(--ink2);line-height:1.7}
/* ---- 关卡舞台 ---- */
.ph-stage-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 4px 10px}
.ph-stage-head .ph-num{font-size:1.7rem;font-weight:800;color:var(--ink)}
.ph-stage-head h2{margin:0;font-size:1.28rem}
.ph-stage-head .ph-goal{flex:1 1 100%;margin:2px 0 0;color:var(--ink2);font-size:.86rem;line-height:1.6}
.ph-goals{display:flex;flex-wrap:wrap;gap:8px;margin:10px 4px 4px}
.ph-goals span{font-size:.78rem;font-weight:700;color:#2F7B52;background:#EDFAF0;border:2px solid var(--mint);

.ph-sec-label{margin:18px 4px 8px;font-size:.92rem;font-weight:800;color:var(--ink)}
.ph-sec-label small{font-weight:600;color:var(--ink2);font-size:.78rem;margin-left:6px}
/* 折叠卡（一屏只展开一个） */
.ph-fold{margin:10px 4px;background:#fff;border:3px solid #E8EAF0;border-radius:18px;overflow:hidden}
.ph-fold[open]{border-color:var(--sky2,#B9E2FA)}

.ph-fold > summary::before{content:'▸';color:var(--lake);font-size:1rem;transition:.15s}
.ph-fold[open] > summary::before{content:'▾'}
.ph-fold > summary small{font-size:.76rem;font-weight:600;color:var(--ink2)}
.ph-fold .ph-fold-body{padding:4px 14px 14px}
.ph-fold .ph-fold-hint{font-size:.76rem;color:var(--ink2);margin:0 4px 8px;line-height:1.6}
/* 字母卡 / 词族行沿用旧样式 */
.ph-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph-letter{background:#fff;border:3px solid var(--lake);border-radius:18px;padding:10px 6px 8px;
  cursor:pointer;transition:.15s;text-align:center;box-shadow:0 4px 0 rgba(45,49,66,.08)}
.ph-letter:hover{transform:translateY(-3px);border-color:var(--lemon)}
.ph-letter.v{border-color:var(--coral);background:#FFF4F4}
.ph-letter .pl-g{font-size:1.7rem;font-weight:800;line-height:1.1}
.ph-letter .pl-g small{font-size:.8rem;font-weight:700;color:var(--ink2);margin-left:2px}
.ph-letter .pl-ipa{font-size:.86rem;font-weight:700;color:var(--ink);margin-top:2px}
.ph-letter .pl-zh{font-size:.68rem;color:var(--ink2);min-height:1.4em}
.ph-letter .pl-ex{margin-top:5px;padding:3px 8px;border-radius:999px;border:2px solid #E8EAF0;
  background:#fff;font-family:inherit;font-size:.72rem;cursor:pointer;white-space:nowrap}
.ph-letter .pl-note{font-size:.64rem;color:#96281B;margin-top:4px;line-height:1.45;text-align:left}
.ph-blocks2{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.ph-block{background:#fff;border:3px solid var(--sky2,#B9E2FA);border-radius:20px;padding:12px 12px 10px;
  box-shadow:0 4px 0 rgba(45,49,66,.08)}
.ph-block.v{border-color:var(--grape)}
.ph-block .pb-b{font-size:1.35rem;font-weight:800}
.ph-block .pb-b small{font-size:.95rem;color:var(--ink2);font-weight:700;margin-left:4px}
.ph-block .pb-tip{font-size:.82rem;color:var(--ink2);margin:3px 0 8px;line-height:1.55}
.ph-block .pb-note{font-size:.72rem;color:#96281B;margin:-4px 0 8px;line-height:1.5}
.ph-block .pb-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph-w-chip{padding:4px 10px;border-radius:999px;border:2px solid #E8EAF0;background:#fff;
  font-family:inherit;font-size:.78rem;cursor:pointer}
.ph-w-chip:hover{border-color:var(--lemon)}
.ph-fam-sounds{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.ph-snd{padding:7px 14px;border-radius:999px;border:3px solid var(--mint);background:#EDFAF0;
  font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer}
.ph-rule{font-size:.78rem;color:var(--ink2);padding:7px 12px;background:#F5F6FA;border-radius:999px}
.ph-rows{display:flex;flex-direction:column;gap:8px}
.pw-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FAFCFF;
  border:2px solid #E8EAF0;border-radius:16px;padding:8px 12px}
.pw-icon{font-size:34px;line-height:1;width:44px;text-align:center;flex:none}
.pw-icon svg{width:44px;height:44px;vertical-align:middle}
.ph-tile{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;
  border-radius:12px;background:#EEF3F8;font-weight:800;font-size:1.2rem;color:var(--ink2)}
.pw-word{font-size:1.25rem;font-weight:800;min-width:74px}
.pw-zh{font-size:.82rem;color:var(--ink2);min-width:40px}
.pw-blocks{display:flex;gap:5px;flex-wrap:wrap}
.pw-blocks .pb{min-width:38px;height:40px;border-radius:11px;border:2px solid var(--lake);

.pw-blocks .pb:hover{background:var(--lake);color:var(--ink)}
.pw-tag{font-size:.72rem;color:#7A5B00;background:#FFF3C4;border-radius:999px;padding:4px 10px}
.pw-go{padding:7px 12px;font-size:.8rem;min-height:0}
.pw-full{padding:7px 12px;font-size:.8rem;min-height:0}
/* 视觉词 / 可解码句 */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.sw-card{background:#fff;border:3px solid #D8E6F2;border-radius:16px;padding:12px 10px;text-align:center}
.sw-word{font-size:1.3rem;font-weight:800;background:none;border:0;color:var(--ink);cursor:pointer;padding:2px 8px;border-radius:10px}
.sw-word:hover{background:#EDF6FF}
.sw-ipa{font-size:.8rem;color:var(--ink2);font-weight:700}
.sw-zh{font-size:.84rem;color:var(--ink2);margin:3px 0 6px}
.sw-note{font-size:.72rem;color:#8A6D1F;background:#FFF6DC;border-radius:10px;padding:6px 8px;line-height:1.55;text-align:left}
.sd-text{font-size:1.32rem;font-weight:800;line-height:2.2;letter-spacing:.5px}
.sd-w{background:#F2F8FF;border:2px solid #C9DEF5;border-radius:12px;padding:4px 10px;margin:2px;font-size:1.12rem;font-weight:700;color:var(--ink);cursor:pointer;min-height:40px}
.sd-w:hover{background:#E2EFFD}
.sd-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--ink2)}
.sd-tag{background:#EDFAF0;border:2px solid var(--mint);border-radius:999px;padding:3px 11px;font-size:.74rem;color:#2F7B52}
/* 听音挑一挑 */
.ph-mg-opts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 2px}
.ph-mg-opt{min-width:104px;background:#fff;border:3px solid #E8EAF0;border-radius:16px;padding:10px 14px;
  font-family:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;color:var(--ink);transition:.12s}
.ph-mg-opt:hover{border-color:var(--lemon)}
.ph-mg-opt.good{border-color:var(--mint);background:#E5F9E9;animation:phpop .35s}
.ph-mg-opt.bad{border-color:var(--coral);background:#FFE9E9;animation:phshake .35s}
.ph-mg-msg{min-height:28px;font-size:.98rem;font-weight:700;margin:10px 4px 2px}
@keyframes phpop{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes phshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* 听音能写 */
.sp-head{display:flex;justify-content:space-between;font-size:.86rem;color:var(--ink2);margin:4px 2px 12px}
.sp-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp-len{font-size:.82rem;color:var(--ink2)}
.sp-slots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.sp-slot{width:54px;height:60px;border:3px dashed #C3D2E0;border-radius:14px;background:#fff;font-size:1.55rem;font-weight:800;color:var(--ink);cursor:default}
.sp-slot.filled{border-style:solid;border-color:var(--lake);background:#EFF6FF;cursor:pointer}
.sp-pool{display:flex;gap:8px;flex-wrap:wrap;min-height:58px}
.sp-tile{width:54px;height:58px;border:3px solid var(--peach);border-radius:14px;background:#FFF3E8;font-size:1.45rem;font-weight:800;color:var(--ink);cursor:pointer;min-height:0}
.sp-tile.used{visibility:hidden}
.sp-msg{min-height:26px;font-size:.98rem;font-weight:700;margin-top:12px}
.sp-done{text-align:center;font-size:1.2rem;font-weight:800;padding:22px 8px;line-height:2}
/* 底部导航 */
.ph-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 4px 6px}
.ph-done-row{display:flex;justify-content:center;margin:18px 4px 4px}
.ph-foot{margin:26px 0 8px;font-size:.76rem;color:var(--ink2);line-height:1.8;text-align:center}
/* ---- P2：能量条 / 彩蛋 / 定级 / 家长报告 ---- */
.ph-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 2px 4px}
.ph-cell{width:38px;height:38px;border-radius:12px;border:3px solid #E8EAF0;background:#F7F9FC;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.ph-cell.on{border-color:var(--mint);background:#E5F9E9;animation:phpop .35s}
/* 彩蛋墙：13 个 30px 小格，两行放得下；不再占 4 行 66px 大格 */
.ph-eggs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 2px 2px}
.ph-egg{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;border:2px solid #E8EAF0;background:#F7F9FC;font-size:.95rem;opacity:.5}
.ph-egg.got{opacity:1;border-color:var(--lemon);background:#FFF8E1}
.ph-egg small{display:none}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 2px 2px}
.ph-actions .btn{flex:1 1 150px}
.ph-streak{font-size:.84rem;color:var(--ink2);margin:6px 2px 2px;line-height:1.7}
.ph-star-hint{display:inline-block;font-size:.86rem;font-weight:700;color:#7A5B00;background:#FFF3C4;
  border:2px solid var(--lemon);border-radius:999px;padding:9px 18px;margin:18px 4px 4px}
.ph-celebrate{position:fixed;inset:0;background:rgba(30,40,60,.35);display:flex;align-items:center;
  justify-content:center;z-index:9998;cursor:pointer}
.ph-celebrate-box{background:#fff;border-radius:22px;padding:26px 34px;text-align:center;
  box-shadow:0 12px 0 rgba(45,49,66,.12);animation:phpop .45s}
.ph-celebrate-icon{font-size:3.2rem}
.ph-celebrate-text{font-size:1.12rem;font-weight:800;margin-top:8px;line-height:1.7;color:var(--ink)}
.ph-celebrate-text small{font-size:.82rem;color:var(--ink2);font-weight:600}
.ph-report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 2px}
.ph-metric{background:#F5F8FC;border-radius:14px;padding:10px 12px;text-align:center}
.ph-metric span{display:block;font-size:.72rem;color:var(--ink2)}
.ph-metric b{font-size:1.25rem;color:var(--ink)}
.ph-table{width:100%;border-collapse:collapse;margin:12px 2px;font-size:.84rem}
.ph-table th,.ph-table td{border:2px solid #E8EAF0;padding:8px 10px;text-align:left;color:var(--ink)}
.ph-table th{background:#F5F8FC}
.ph-tips{margin:12px 2px;font-size:.84rem;color:var(--ink2);line-height:1.85}
.ph-tips ul{margin:6px 0 12px 18px}
.ph-place-note{margin:8px 4px 2px;font-size:.78rem;color:var(--ink2);line-height:1.7}

/* ---------- 课程屏（2026-11-22 两屏化） ----------
   原来地图与课程同在一页，点一关就 smooth scroll 到页面底部：
   390px 下这一页 4991px、320px 下 6592px，进去之后既不知道自己到了哪，

body.ph-lesson .ph-lessonbar{
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:60;
  margin:0 0 14px; padding:10px 12px;
  background:rgba(255,255,255,.98);
  border:1px solid #E9EEF6; border-radius:16px;
  box-shadow:0 2px 10px rgba(24,39,75,.07);
}
@media (min-width:721px){ body.ph-lesson .ph-lessonbar{ top:84px; } }
body.ph-lesson .page-title,
body.ph-lesson #phGamesBanner,
body.ph-lesson #phMapSection,
body.ph-lesson #phReport,
body.ph-lesson .ph-foot{ display:none !important; }
body.ph-lesson #phStage{ margin-top:0; }

  flex:none; min-height:42px; padding:8px 14px;

  border-radius:999px; font:800 .86rem/1 inherit; cursor:pointer;
  display:inline-flex; align-items:center; gap:4px;
}
.ph-lessonbar .ph-back:active{ transform:scale(.97); }
.ph-lessonbar b{ font-size:.98rem; letter-spacing:.2px; }
.ph-lessonbar .ph-lessonstep{ margin-left:auto; font-size:.74rem; color:#6B7385; font-weight:700; }

.ph-audio{margin:12px 0 4px;border:1px solid #E9EEF6;border-radius:16px;background:#FBFDFF;overflow:hidden}

.ph-audio>summary::after{content:'▾';margin-left:auto;color:#8A93A6;transition:.15s}

  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;

.ph-audio-chips button b{font-size:1.05rem;color:var(--ink)}
.ph-audio-chips button small{font-size:.68rem;color:#6B7385;font-weight:700}

<script>
renderNav('phonics'); renderDecor();

/* 词表映射（词图 + 中文） */
const ALLW = {};
THEMES.forEach(t => t.words.forEach(w => { if (!ALLW[w.w]) ALLW[w.w] = w; }));

/* 行内 onclick 用注册表索引：同一个词可能出现在两个词族（ship ∈ short-i / sh），
   不能拿词名当 key；索引在渲染时一次性生成。 */
const PHR = [];
const reg = (word, segs) => { PHR.push({ w: word, segs: segs || null }); return PHR.length - 1; };
function phRowBlend(i) { const r = PHR[i]; if (r && r.segs) phBlendWord(r.w, r.segs); else phRowWord(i); }
function phRowWord(i) { const r = PHR[i]; if (r) phPlayWord(r.w); }
function phRowBlock(i, j) { const r = PHR[i]; if (r && r.segs) phPlayBlock(r.segs[j]); }
window.phRowBlend = phRowBlend; window.phRowWord = phRowWord; window.phRowBlock = phRowBlock;

/* 词信息：主词库 → PH_EXTRA（词族里 25 个课本词）→ 字母牌兜底 */
const wInfo = word => ALLW[word] || (typeof PH_EXTRA !== 'undefined' ? PH_EXTRA[word] : null) || { w: word, zh: '', e: '' };
const wIcon = word => {
  const o = wInfo(word);
  return iconOf(o) || `<span class="ph-tile">${esc(String(word)[0].toUpperCase())}</span>`;
};
const wZh = word => wInfo(word).zh || '';
const wEmoji = word => wInfo(word).e || '';

const byId = id => PHONICS.find(f => f.id === id);
const sentByText = {};
DECODE_SENTENCES.forEach(o => { sentByText[o.s] = o; });
const sightByW = {};
SIGHT_WORDS.forEach(o => { sightByW[o.w] = o; });

/* ---------------- 进度（星星，key: phlv1） ---------------- */
const phProg = {
  done: {},
  load() { try { this.done = JSON.parse(localStorage.getItem('phlv1') || '{}') || {}; } catch (e) { this.done = {}; } },
  save() { try { localStorage.setItem('phlv1', JSON.stringify(this.done)); } catch (e) {} },
  mark(id) { this.done[id] = 1; this.save(); }
};
phProg.load();

/* ---------------- P2 学情与奖励（key: phstat2） ---------------- */
const phStat = {
  data: { place: null, stat: {}, eggs: {}, streak: { last: '', days: 0, best: 0 } },
  load() {
    try {
      const d = JSON.parse(localStorage.getItem('phstat2') || '{}') || {};
      this.data = Object.assign({ place: null, stat: {}, eggs: {}, streak: { last: '', days: 0, best: 0 } }, d);
      if (!this.data.streak) this.data.streak = { last: '', days: 0, best: 0 };
    } catch (e) {}
    /* 旧进度迁移：老用户已点亮的星星补发彩蛋 */
    Object.keys(phProg.done).forEach(id => {
      if (/^L\d+$/.test(id) && !this.data.eggs[id]) this.data.eggs[id] = 0;
    });
  },
  save() { try { localStorage.setItem('phstat2', JSON.stringify(this.data)); } catch (e) {} },
  rec(id, r, w) {
    const s = this.data.stat[id] || (this.data.stat[id] = { r: 0, w: 0 });
    s.r += r; s.w += w; this.save();
  },
  touchDay() {
    const now = new Date();
    const key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const st = this.data.streak;
    if (st.last === key) return;
    const y = new Date(now.getTime() - 86400000);
    const yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    st.days = (st.last === yk) ? (st.days || 0) + 1 : 1;
    st.best = Math.max(st.best || 0, st.days);
    st.last = key; this.save();
  }
};
phStat.load();

/* ★ 2026-11-20：关卡重编号（L8/L9 之间插入了四关），旧进度搬到新编号，
   不然老用户点亮的「视觉词 / 听音能写」会变成「元音组合 II」的星星。 */
(function migrateLevelIds() {
  const map = { L8: 'L12', L9: 'L13' };
  let changed = false;
  Object.keys(phProg.done).forEach(k => { if (map[k]) { phProg.done[map[k]] = phProg.done[k]; delete phProg.done[k]; changed = true; } });
  if (changed) phProg.save();
  Object.keys(phStat.data.eggs || {}).forEach(k => { if (map[k]) { phStat.data.eggs[map[k]] = phStat.data.eggs[k]; delete phStat.data.eggs[k]; changed = true; } });
  Object.keys(phStat.data.stat || {}).forEach(k => { if (map[k]) { phStat.data.stat[map[k]] = phStat.data.stat[k]; delete phStat.data.stat[k]; changed = true; } });
  const p = phStat.data.place;
  if (p && map[p.rec]) { p.rec = map[p.rec]; changed = true; }
  if (changed) phStat.save();
})();

function celebrate(levelId) {
  const lv = PH_LEVELS.find(l => l.id === levelId);
  try { sfx && sfx.good && sfx.good(); } catch (e) {}
  const d = document.createElement('div');
  d.className = 'ph-celebrate';
  d.innerHTML = `<div class="ph-celebrate-box"><div class="ph-celebrate-icon">${lv ? lv.icon : '🎉'}</div>
    <div class="ph-celebrate-text">🎉 获得 ${esc(levelId)} 彩蛋！<br><small>${lv ? esc(lv.name) : ''} · 点一下关闭</small></div></div>`;
  d.addEventListener('click', () => { try { d.remove(); } catch (e) {} });
  document.body.appendChild(d);
  setTimeout(() => { try { d.remove(); } catch (e) {} }, 2600);
}
function eggReward(id) {
  if (!phStat.data.eggs[id]) { phStat.data.eggs[id] = Date.now(); phStat.save(); }
  phStat.touchDay();
  celebrate(id);
}

/* ---------------- 组件渲染 ---------------- */
function letterHTML(ch) {
  const l = LETTERS.find(x => x.L.toLowerCase() === ch);
  if (!l) return '';
  const ipa = l.szh.split(' ')[0];
  /* N12：拼读课用口型/气流描述，不沿用字母岛的汉字谐音（sī/tè/pō 会给清辅音加元音）。 */
  const phHint = (typeof PH_LETTER_HINT !== 'undefined' ? PH_LETTER_HINT[ch] : null) || null;
  const zh = phHint ? phHint.desc : l.szh.split(' ').slice(1).join(' ');
  const ex = l.words[0];
  const i = reg(ex.w, null);
  return `<div class="ph-letter ${l.v ? 'v' : ''}" onclick="phPlayBlock('${l.L.toLowerCase()}')" role="button" tabindex="0"
       aria-label="字母 ${l.L} 的字母音 ${esc(ipa)}，点按听发音">
    <div class="pl-g" style="color:${l.color}">${l.L}<small>${l.L.toLowerCase()}</small></div>
    <div class="pl-ipa">${esc(ipa)}</div>
    <div class="pl-zh">${esc(zh)}</div>
    <button class="pl-ex" onclick="event.stopPropagation();phRowWord(${i})" title="听例词 ${esc(ex.w)}">${esc(ex.e || '')} ${esc(ex.w)}</button>
    ${phHint && phHint.warn ? `<div class="pl-note">📌 ${esc(phHint.warn)}</div>`
       : (l.tipSame ? `<div class="pl-note">📌 ${l.tipSame}</div>` : '')}
  </div>`;
}

function famInnerHTML(f, lvId) {
  const sounds = (f.sounds || []).map(s =>
    `<button class="ph-snd" onclick="phPlayBlock('${s}')" title="点我听 ${esc(s)} 的音">🔊 ${esc(s)}</button>`).join('');
  /* ★ 规则族没有单块录音：用「关键词」当这个音的样板（真词录音，不是机器音） */
  const keyBtn = (!f.sounds || !f.sounds.length) && f.key
    ? `<button class="ph-snd" onclick="phRowWord(${reg(f.key, null)})" title="听关键词 ${esc(f.key)}">🔑 ${esc(wEmoji(f.key))} ${esc(f.key)}</button>` : '';
  const rowHTML = (w, withBlocks) => {
    const seg = (f.segs || {})[w];
    const blendable = withBlocks && !!(seg && seg.length) && seg.every(b => !!phBlockURL(b));
    const i = reg(w, blendable ? seg : null);
    const blocks = blendable
      ? `<span class="pw-blocks">${seg.map((b, j) =>
          `<button class="pb" onclick="phRowBlock(${i},${j})" title="点我听 ${esc(b)} 的音">${esc(b)}</button>`).join('')}</span>
         <button class="btn mint pw-go" onclick="phRowBlend(${i})">🔊 拼一拼</button>`
      : `<span class="pw-tag">整体认读</span>`;
    return `<div class="pw-row">
      <span class="pw-icon">${wIcon(w)}</span>
      <span class="pw-word" lang="en">${esc(w)}</span>
      <span class="pw-zh">${esc(wZh(w))}</span>
      ${blocks}
      <button class="btn ghost pw-full" onclick="phRowWord(${i})">🔊 整词</button>
    </div>`;
  };
  /* ★ 2026-11-20.5：这一关还要往后的块才能拼的词，单独归到「先整体认读」，
     不给孩子在 L2 就拼 sh、在 L3 就拼 ir —— 练习材料只用已教过的 GPC。 */
  const nowRows = [], laterRows = [];
  (f.words || []).forEach(w => {
    const seg = (f.segs || {})[w];
    const later = (seg && lvId && typeof wordInStage === 'function' && !wordInStage(w, seg, lvId))
      ? firstLaterBlock(seg, lvId) : null;
    if (later) laterRows.push({ w: w, later: later });
    else nowRows.push(w);
  });
  let rows = nowRows.map(w => rowHTML(w, true)).join('');
  if (laterRows.length) {
    const why = laterRows.slice(0, 3).map(x => x.w + '（' + x.later.lv + ' 的 ' + x.later.b + '）').join('、');
    rows += `<div style="margin:12px 8px 4px;font-size:.8rem;color:var(--ink2);font-weight:700;line-height:1.7">
      🔜 用到后面才教的规则 · 先整体认读：${esc(why)}${laterRows.length > 3 ? ' …' : ''}</div>`
      + laterRows.map(x => rowHTML(x.w, false)).join('');
  }
  const head = (f.sounds && f.sounds.length) ? sounds
    : `<span class="ph-rule">${esc(f.rule || '规则卡：没有单块录音，先记规则、听整词')}</span>${keyBtn}`;
  return `<div class="ph-fam-sounds">${head}</div>
    <div class="ph-rows">${rows}</div>`;
}

function foldsHTML(items) {
  /* items: [{title, small, hint, body}] —— 一屏只展开第一个 */
  return items.map((it, idx) => `
    <details class="ph-fold" ${idx === 0 ? 'open' : ''}>
      <summary>${it.title}${it.small ? ` <small>${it.small}</small>` : ''}</summary>
      <div class="ph-fold-body">${it.hint ? `<p class="ph-fold-hint">${it.hint}</p>` : ''}${it.body}</div>
    </details>`).join('');
}

function sightCardHTML(o) {
  return `<div class="sw-card">
    <button class="sw-word" onclick="phSpeakWord('${esc(o.w)}')" title="点我听 ${esc(o.w)}">🔊 ${esc(o.w)}</button>
    <div class="sw-ipa">${esc(o.ipa)}</div>
    <div class="sw-zh">${esc(o.zh)}</div>
    <div class="sw-note">📌 ${esc(o.note)}</div>
  </div>`;
}

function sentCardHTML(o) {
  const words = o.s.split(' ');
  return `<div class="card" style="margin:12px 4px">
    <div class="sd-text">${words.map(w => {
      const clean = w.replace(/[^A-Za-z']/g, '');
      return `<button class="sd-w" onclick="phSpeakWord('${esc(clean)}')" title="点我听 ${esc(clean)}">${esc(w)}</button>`;
    }).join(' ')}</div>
    <div class="sd-meta">
      <span>${esc(o.zh)}</span>
      <span class="sd-tag">${esc(o.tags)}</span>
      <button class="btn mint" style="margin-left:auto" onclick="speak('${esc(o.s)}')">🔊 读整句</button>
    </div>
  </div>`;
}

/* ---------------- 听音挑战（四种玩法，按关卡类型切换） ----------------
   2026-11-20.4 重做：
   · letters   → 听音选字母，**只考当前批次**（原来 26 个字母全混：第 1 批的孩子
                 被考 j / v / w / z，10 题里只有 4 题是本批的）；
   · words     → **听音拼词**：听一个词，按顺序点块/字母把它拼出来。
                 原来是「听词选词」（整体识别），测不到本关的拼读目标；
                 现在把解码和编码接上了（也是把「拼写」下沉到每关）。
   · sameSound → **听词选写法**：听一个词，判断它用的是 ai / ay / a_e 哪一种。
   · sight     → 听音选词（视觉词本来就该整体认读，保持原样）。
   能量 7 格、答错重来、满格亮星的老规则不变。 */
const MG = { mode: 'word', pool: [], qs: [], idx: 0, right: 0, wrong: 0, cur: null, opts: [], need: 7,
             fired: false, spell: null, batch: 0, lv: null };

function mgPoolOf(lv) {
  /* 字母题用「累计批次」：学第 2 批时考 1+2 批（复习 + 新学），到第 4 批就是 26 个全考。
     原来 26 个字母从头混到尾，第 1 批的孩子被考 j/v/w/z；只考当前批又测不到复习。 */
  if (lv.kind === 'letters') return PH_L1_BATCHES.slice(0, MG.batch + 1).reduce((a, b) => a.concat(b.letters), []);
  if (lv.kind === 'sight') return lv.sightBatches.reduce((a, b) => a.concat(b.words), []);
  if (lv.kind === 'sameSound') {
    const ws = [];
    (typeof SAME_SOUNDS !== 'undefined' ? SAME_SOUNDS : []).forEach(g => g.groups.forEach(gr =>
      gr.words.forEach(w => { if (ws.indexOf(w) < 0) ws.push(w); })));
    return ws;
  }
  const ws = [];
  (lv.fams || []).forEach(id => {
    const f = byId(id);
    if (!f) return;
    f.words.forEach(w => {
      if (ws.indexOf(w) >= 0) return;
      const seg = f.segs && f.segs[w];
      /* ★ 超纲词不进挑战：块要在这关或更早教过（fish 的 sh 是 L3 的，L2 不考） */
      if (seg && !wordInStage(w, seg, lv.id)) return;
      ws.push(w);
    });
  });
  return ws;
}
function mgSegOf(lv, w) {
  let seg = null;
  (lv.fams || []).forEach(id => {
    const f = byId(id);
    if (f && f.segs && f.segs[w]) seg = f.segs[w];
  });
  return seg;
}
function mgPatternOf(word) {
  let hit = null;
  (typeof SAME_SOUNDS !== 'undefined' ? SAME_SOUNDS : []).forEach(g => g.groups.forEach(gr => {
    if (gr.words.indexOf(word) >= 0) hit = { sound: g.sound, zh: g.zh, sp: gr.sp, groups: g.groups };
  }));
  return hit;
}
function mgBuildQs() {
  MG.qs = [];
  const need = MG.need + 3;
  const copy = MG.pool.slice();
  const targets = [];
  while (targets.length < need && copy.length) targets.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  if (targets.length < 3) return;
  targets.forEach(t => {
    if (MG.mode === 'pattern') {
      const info = mgPatternOf(t);
      if (!info || info.groups.length < 2) return;
      MG.qs.push({ t: t, right: info.sp, opts: info.groups.map(g => g.sp).sort(() => Math.random() - .5), sound: info.sound });
      return;
    }
    const others = MG.pool.filter(x => x !== t);
    const opts = [t];
    while (opts.length < 3 && others.length) {
      const c = others.splice(Math.floor(Math.random() * others.length), 1)[0];
      if (opts.indexOf(c) < 0) opts.push(c);
    }
    if (opts.length === 3) MG.qs.push({ t: t, right: t, opts: opts.sort(() => Math.random() - .5) });
  });
}
function mgReset(lv) {
  MG.qs = []; MG.idx = 0; MG.right = 0; MG.wrong = 0; MG.cur = null; MG.opts = []; MG.fired = false;
  MG.spell = null; MG.lv = lv;
  if (!lv || lv.kind === 'spell' || lv.kind === 'toolbox') { MG.pool = []; return; }
  if (lv.kind !== 'letters') MG.batch = 0;
  MG.mode = lv.kind === 'letters' ? 'letter'
    : lv.kind === 'sight' ? 'sight'
    : lv.kind === 'sameSound' ? 'pattern' : 'spell';
  MG.pool = mgPoolOf(lv);
  if (!MG.pool.length) return;
  if (MG.mode === 'spell') { mgNewSpell(); return; }
  mgBuildQs();
}
function mgNewSpell() {
  const w = MG.pool[Math.floor(Math.random() * MG.pool.length)];
  const seg = mgSegOf(MG.lv, w);
  const blendable = !!(seg && seg.length) && seg.every(b => !!phBlockURL(b));
  const blocks = blendable ? seg.slice() : String(w).split('');
  const cand = blendable
    ? ['sh', 'ch', 'th', 'ck', 'ng', 'ee', 'oo', 'ai', 'ay', 'oa', 'ar', 'or', 'ir',
       'a', 'e', 'i', 'o', 'u', 'b', 'c', 'd', 'f', 'g', 'h', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'w', 'y', 'z']
    : 'abcdefghijklmnopqrstuvwxyz'.split('');
  const inWord = new Set(blocks.map(b => String(b).toLowerCase()));
  const extras = [];
  let guard = 0;
  while (extras.length < 2 && guard++ < 300) {
    const c = cand[Math.floor(Math.random() * cand.length)];
    if (inWord.has(c) || extras.indexOf(c) >= 0) continue;
    extras.push(c);
  }
  const chips = blocks.map(b => ({ b: b, used: false })).concat(extras.map(b => ({ b: b, used: false })));
  for (let i = chips.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = chips[i]; chips[i] = chips[j]; chips[j] = t; }
  MG.spell = { word: w, blocks: blocks, chips: chips, filled: [], blendable: blendable, locked: false, msg: '' };
}
function mgPlaySound() {
  if (MG.mode === 'spell') { if (MG.spell) phPlayWord(MG.spell.word); return; }
  if (!MG.cur) return;
  if (MG.mode === 'letter') phPlayBlock(MG.cur.t);
  else phPlayWord(MG.cur.t);
}
function mgBarHTML() {
  let h = '';
  for (let i = 0; i < MG.need; i++) h += `<span class="ph-cell ${i < MG.right ? 'on' : ''}">${i < MG.right ? '⭐' : ''}</span>`;
  return h;
}
function mgPaint() {
  const box = document.getElementById('mgBox');
  if (!box) return;
  if (!MG.pool || !MG.pool.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  const bar = document.getElementById('mgBar');
  if (bar) bar.innerHTML = mgBarHTML();
  const title = document.getElementById('mgTitle');
  if (title) title.textContent = MG.mode === 'letter' ? '🎮 听音选字母 · 能量条'
    : MG.mode === 'sight' ? '🎮 听音选词 · 能量条'
    : MG.mode === 'pattern' ? '🎮 听词选写法 · 能量条'
    : '🎮 听音拼词 · 能量条';
  /* L1 的批次切换 */
  const batchRow = document.getElementById('mgBatch');
  if (batchRow) {
    if (MG.mode === 'letter') {
      batchRow.style.display = '';
      batchRow.innerHTML = PH_L1_BATCHES.map((b, i) =>
        `<button class="btn ${i === MG.batch ? 'coral' : 'ghost'}" style="padding:5px 12px;font-size:.78rem;min-height:0"
           onclick="mgSetBatch(${i})">第 ${i + 1} 批 · ${b.letters.join('')}</button>`).join('');
    } else batchRow.style.display = 'none';
  }
  if (MG.right >= MG.need) {
    document.getElementById('mgProg').textContent = '';
    document.getElementById('mgOpts').innerHTML = '';
    document.getElementById('mgOpts').style.display = '';
    const slots = document.getElementById('mgSlots'); if (slots) slots.style.display = 'none';
    const chips = document.getElementById('mgChips'); if (chips) chips.style.display = 'none';
    document.getElementById('mgMsg').innerHTML =
      `🎉 能量满格！⭐ 星星点亮 · 🥚 彩蛋 +1<br><button class="btn coral" style="margin-top:10px" onclick="mgRestart()">再玩一轮</button>`;
    if (!MG.fired) {
      MG.fired = true;
      phProg.mark(CUR);
      phStat.rec(CUR, 0, 0);
      eggReward(CUR);
      renderMap(); renderReward(); renderReport();
    }
    return;
  }
  document.getElementById('mgProg').textContent = '能量 ' + MG.right + ' / ' + MG.need + ' 格';
  if (MG.mode === 'spell') { mgPaintSpell(); return; }
  const optBox = document.getElementById('mgOpts');
  optBox.style.display = '';
  const slots = document.getElementById('mgSlots'); if (slots) slots.style.display = 'none';
  const chips = document.getElementById('mgChips'); if (chips) chips.style.display = 'none';
  if (MG.idx >= MG.qs.length) { mgBuildQs(); MG.idx = 0; if (!MG.qs.length) return; }
  MG.cur = MG.qs[MG.idx];
  const label = o => MG.mode === 'letter' ? (o.toUpperCase() + ' ' + o)
    : MG.mode === 'sight' ? ('🔊 ' + o)
    : MG.mode === 'pattern' ? o
    : (wEmoji(o) ? wEmoji(o) + ' ' : '') + o;
  optBox.innerHTML = MG.cur.opts.map(o =>
    `<button class="ph-mg-opt" onclick="mgPick('${esc(o)}')" id="mgo-${esc(o)}">${esc(label(o))}</button>`).join('');
  document.getElementById('mgMsg').textContent = MG.mode === 'letter' ? '听字母音，点出你听到的那个 👇'
    : MG.mode === 'sight' ? '听一听，点出这个词 👇'
    : MG.mode === 'pattern' ? '听这个词，它用的是哪种写法？' + (MG.cur.sound ? '（' + MG.cur.sound + '）' : '')
    : '听一听，点出你听到的那个 👇';
  setTimeout(mgPlaySound, 150);
}
function mgPaintSpell() {
  const S = MG.spell;
  if (!S) return;
  const optBox = document.getElementById('mgOpts');
  optBox.style.display = 'none';
  const slots = document.getElementById('mgSlots');
  const chips = document.getElementById('mgChips');
  slots.style.display = '';
  chips.style.display = '';
  slots.innerHTML = S.blocks.map((_, i) => {
    const ci = S.filled[i];
    const ch = ci == null ? '' : S.chips[ci].b;
    return `<span class="sp-slot ${ci == null ? '' : 'filled'}">${ch ? esc(ch) : ''}</span>`;
  }).join('');
  chips.innerHTML = S.chips.map((c, i) => c.used
    ? `<span class="sp-tile used">·</span>`
    : `<button class="sp-tile" onclick="mgChip(${i})">${esc(c.b)}</button>`).join('');
  document.getElementById('mgMsg').textContent = S.msg || ('听一听「' + S.word.length + ' 个' + (S.blendable ? '音' : '字母') + '」，按顺序点出来 👇');
}
function mgChip(i) {
  const S = MG.spell;
  if (!S || S.locked) return;
  const c = S.chips[i];
  if (!c || c.used || S.filled.length >= S.blocks.length) return;
  c.used = true;
  S.filled.push(i);
  if (S.blendable && phBlockURL(c.b)) phPlayBlock(c.b);
  const built = S.filled.map(k => S.chips[k].b).join('');
  if (S.filled.length === S.blocks.length) {
    S.locked = true;
    if (String(built).toLowerCase() === String(S.word).toLowerCase()) {
      MG.right++;
      S.msg = '✅ 拼对了！';
      phStat.rec(CUR, 1, 0);
      mgPaintSpell();
      setTimeout(mgPlayWordThenNext, 850);
      return;
    }
    MG.wrong++;
    phStat.rec(CUR, 0, 1);
    S.msg = '❌ 顺序不对，点「🔊 再听一遍」再来一次';
    mgPaintSpell();
    setTimeout(() => {
      S.filled = [];
      S.chips.forEach(x => { x.used = false; });
      S.locked = false;
      S.msg = '';
      mgPaintSpell();
      phPlayWord(S.word);
    }, 1100);
    return;
  }
  mgPaintSpell();
}
function mgPlayWordThenNext() {
  if (MG.spell) phPlayWord(MG.spell.word);
  setTimeout(() => {
    if (!MG.spell) return;
    mgNewSpell();
    mgPaint();
    setTimeout(mgPlaySound, 200);
  }, 700);
}
function mgSetBatch(i) {
  MG.batch = i;
  MG.right = 0; MG.fired = false;
  MG.pool = mgPoolOf(MG.lv);
  MG.qs = []; MG.idx = 0;
  mgBuildQs();
  mgPaint();
}
function mgPick(o) {
  if (!MG.cur || MG.right >= MG.need) return;
  const btn = document.getElementById('mgo-' + o);
  if (o === MG.cur.right) {
    MG.right++;
    phStat.rec(CUR, 1, 0);
    if (btn) btn.classList.add('good');
    document.getElementById('mgMsg').textContent = '✅ 对了！能量 +1';
    setTimeout(() => { MG.idx++; mgPaint(); }, 700);
  } else {
    MG.wrong++;
    phStat.rec(CUR, 0, 1);
    if (btn) btn.classList.add('bad');
    document.getElementById('mgMsg').textContent = '❌ 不对哦，再听一遍，这题会重来';
    setTimeout(mgPlaySound, 350);
  }
}
function mgRestart() {
  const lv = PH_LEVELS.find(l => l.id === CUR);
  mgReset(lv);
  mgPaint();
}
window.mgPick = mgPick; window.mgRestart = mgRestart; window.mgChip = mgChip; window.mgSetBatch = mgSetBatch;

/* ---------------- 定级测（8 题摸底 L1→L8，算起点） ---------------- */
const PL = { qs: [], idx: 0, wrongAt: null, right: 0 };
function plPoolOf(lv) {
  if (lv.kind === 'letters') return PH_L1_BATCHES.reduce((a, b) => a.concat(b.letters), []);
  if (lv.kind === 'sight') return lv.sightBatches.reduce((a, b) => a.concat(b.words), []);
  const ws = [];
  (lv.fams || []).forEach(id => { const f = byId(id); if (f) f.words.forEach(w => { if (ws.indexOf(w) < 0) ws.push(w); }); });
  return ws;
}
function plStart() {
  PL.qs = []; PL.idx = 0; PL.wrongAt = null; PL.right = 0;
  PH_LEVELS.filter(l => l.kind !== 'spell' && l.kind !== 'toolbox').forEach(lv => {
    const pool = plPoolOf(lv);
    if (pool.length < 3) return;
    const t = pool[Math.floor(Math.random() * pool.length)];
    const others = pool.filter(x => x !== t);
    const opts = [t];
    while (opts.length < 3 && others.length) {
      const c = others.splice(Math.floor(Math.random() * others.length), 1)[0];
      if (opts.indexOf(c) < 0) opts.push(c);
    }
    if (opts.length === 3) {
      PL.qs.push({
        lv: lv.id, lvName: lv.name, lvIcon: lv.icon,
        mode: lv.kind === 'letters' ? 'letter' : (lv.kind === 'sight' ? 'sight' : 'word'),
        t: t, opts: opts.sort(() => Math.random() - .5)
      });
    }
  });
  renderPlace();
  const stage = document.getElementById('phStage');
  if (stage) window.scrollTo({ top: Math.max(0, stage.offsetTop - 12), behavior: 'smooth' });
}
function plSound() {
  const q = PL.qs[PL.idx];
  if (!q) return;
  if (q.mode === 'letter') phPlayBlock(q.t);
  else if (q.mode === 'sight') phSpeakWord(q.t);
  else phPlayWord(q.t);
}
function renderPlace() {
  const el = document.getElementById('phStage');
  if (!el) return;
  if (PL.idx >= PL.qs.length) {
    const lastLv = PH_LEVELS.filter(l => l.id !== 'TX').slice(-1)[0];
    const rec = PL.wrongAt || (lastLv ? lastLv.id : 'L1');
    const recLv = PH_LEVELS.find(l => l.id === rec) || lastLv || PH_LEVELS[0];
    phStat.data.place = { rec: rec, right: PL.right, total: PL.qs.length, ts: Date.now() };
    phStat.save(); phStat.touchDay(); renderReport();
    el.innerHTML = `<div class="card"><div class="sp-done">🎯 定级完成：答对 ${PL.right} / ${PL.qs.length}<br>
      推荐从 <b style="color:var(--ink)">${esc(recLv.id)} · ${esc(recLv.name)}</b> 开始<br>
      <button class="btn mint big" style="margin-top:12px" onclick="phGo('${recLv.id}')">从这里开始 →</button>
      <button class="btn ghost" style="margin-top:12px;margin-left:8px" onclick="render()">回地图</button></div></div>`;
    return;
  }
  const q = PL.qs[PL.idx];
  el.innerHTML = `<div class="card">
    <h2>🎯 定级测 <small>第 ${PL.idx + 1} / ${PL.qs.length} 题 · 摸底「${esc(q.lvName)}」</small></h2>
    <div class="sp-row" style="margin-top:8px">
      <button class="btn mint" onclick="plSound()">🔊 听一听</button>
      <span class="sp-len">听声音，点出你听到的那个</span>
    </div>
    <div class="ph-mg-opts">${q.opts.map(o => {
      const label = q.mode === 'letter' ? (o.toUpperCase() + ' ' + o) : ((q.mode === 'sight' ? '🔊 ' : (wEmoji(o) ? wEmoji(o) + ' ' : '')) + o);
      return `<button class="ph-mg-opt" onclick="plPick('${esc(o)}')">${esc(label)}</button>`;
    }).join('')}</div>
    <div class="ph-mg-msg" id="plMsg">定级只为找到合适的起点，答错也没关系 🙂</div>
    <p class="ph-place-note">每关摸底 1 题：从第一道做错的题对应的关卡开始学；全对就从 L13 听音能写开始。</p>
  </div>`;
  setTimeout(plSound, 150);
}
function plPick(o) {
  const q = PL.qs[PL.idx];
  if (!q) return;
  if (o === q.t) { PL.right++; phStat.rec('place-' + q.lv, 1, 0); }
  else { if (!PL.wrongAt) PL.wrongAt = q.lv; phStat.rec('place-' + q.lv, 0, 1); }
  PL.idx++;
  setTimeout(renderPlace, o === q.t ? 450 : 650);
}
window.plStart = plStart; window.plSound = plSound; window.plPick = plPick;

/* ---------------- 关卡舞台 ---------------- */
function levelHTML(lv) {
  const idx = PH_LEVELS.indexOf(lv);
  const done = !!phProg.done[lv.id];
  const starBox = lv.id === 'TX' ? '' : (done
    ? `<div class="ph-done-row"><button class="btn mint big" disabled>⭐ 本关已通关 · 彩蛋已收集</button></div>`
    : `<div class="ph-done-row"><span class="ph-star-hint">${lv.kind === 'spell'
        ? '⭐ 拼写一轮对 8 题以上，自动点亮星星、领取彩蛋'

      ${bookBtn}

    </div>`;
  const head = `<div class="ph-stage-head">
      <span class="ph-num">${lv.icon}</span><h2>${esc(lv.id)} · ${esc(lv.name)}</h2>
      <p class="ph-goal">${lv.intro}</p>
    </div>
    <div class="ph-goals">${(lv.goals || []).map(g => `<span>✅ ${esc(g)}</span>`).join('')}</div>`;

  let body = '';
  if (lv.kind === 'letters') {
    body = foldsHTML(PH_L1_BATCHES.map(b => ({
      title: `🅰️ ${esc(b.title)}`, small: b.letters.length + ' 个音',

    })));
  } else if (lv.kind === 'words') {
    const famItems = (lv.fams || []).map(id => {
      const f = byId(id);
      if (!f) return { title: '词族 ' + esc(id) + ' 缺失', body: '' };
      return {
        title: `🧩 ${esc(f.name)}`,
        small: f.words.length + ' 个词 · ' + esc(f.tip || f.rule || ''),
        // 2026-11-16.3：族级 note（th 的浊音 /ð/、oo 的短音 /ʊ/、short o 的 LOT–CLOTH）
        body: (f.note ? `<div class="pb-note" style="margin:0 6px 10px">📌 ${esc(f.note)}</div>` : '')
              + famInnerHTML(f, lv.id)
      };
    });
    body = `<div class="ph-sec-label">🧩 拼一拼 <small>点开词族，一个一个练</small></div>` + foldsHTML(famItems);
    if (lv.sents && lv.sents.length) {

    }
    if (lv.sight && lv.sight.length) {

    }
  } else if (lv.kind === 'sight') {
    body = foldsHTML(lv.sightBatches.map(b => ({
      title: `⭐ ${esc(b.title)}`, small: b.words.length + ' 个词',

    })));
  } else if (lv.kind === 'sameSound') {

      + (typeof SAME_SOUNDS !== 'undefined' ? SAME_SOUNDS : []).map(g => `
        <div class="card" style="margin:10px 4px">
          <h3 style="margin:2px 4px 8px">${esc(g.sound)} <small style="color:var(--ink2);font-weight:400">${esc(g.zh)}</small></h3>
          ${g.groups.map(gr => `
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0">
              <span class="ph-w-chip" style="background:var(--lemon);border:0;cursor:default">${esc(gr.sp)}</span>
              ${gr.words.map(w => `<button class="ph-w-chip" onclick="phRowWord(${reg(w, null)})" title="听 ${esc(w)}">${esc(wEmoji(w))} ${esc(w)}</button>`).join('')}
            </div>`).join('')}
        </div>`).join('');
  } else if (lv.kind === 'spell') {
    body = `<div class="card">
      <div class="sp-head"><span id="spProg">第 1 / 10 题</span><span id="spScore">得分 0</span></div>

        <button class="btn ghost" style="padding:7px 14px;font-size:.82rem;min-height:0" onclick="phPlayBlock('${bl.b}')">🔊 听块音</button>

      </div>`;

        <h2>🎁 规则彩蛋 <small>先记着，以后会遇到</small></h2>
        <p style="font-size:.86rem;color:var(--ink2);line-height:1.9;margin:8px 2px 4px">
        · <b>c 的软音</b>：c 在 e / i / y 前常读 /s/ —— city、nice、cycle；其他时候读 /k/（cat）。<br>
        · <b>g 的软音</b>：g 在 e / i 前常读 /dʒ/ —— gentle、giant；但 get、give 仍读 /g/。<br>
        · <b>不发音的字母</b>：knife / knee 的 k，comb 的 b，hour 的 h——见到它们，跳过去。<br>
        · <b>th 的两种声音</b>：think 里是 /θ/（轻咬舌尖、不振动）；the、this 里是浊音 /ð/（咬舌、声带振动），那些词先整体认读。</p>
      </div>`;
  }

  const mgBox = (lv.kind === 'spell' || lv.kind === 'toolbox') ? '' : `
    <div class="card" id="mgBox" style="margin:18px 4px 8px">
      <h2><span id="mgTitle">🎮 听音挑战 · 能量条</span> <small>答满 7 格亮星得彩蛋；答错这题会重来，蒙不过去</small></h2>

  return head + body + mgBox + starBox + nav;
}

/* 13 关分三组，组标题只占一行；关卡卡去掉「N 词族 · N 句」这类副信息——
   一屏 13 张卡能扫完，点进去才看细节（2026-11-22.8 用户反馈「拼读依旧很乱」）。 */
const PH_GROUPS = [
  { t: '基础 · 单个字母与短元音', ids: ['L1', 'L2', 'L3', 'L4'] },
  { t: '组合 · 两个字母一个音', ids: ['L5', 'L6', 'L7', 'L8', 'L9'] },
  { t: '高阶 · 规则与例外', ids: ['L10', 'L11', 'L12', 'L13', 'TX'] },
];
function renderMap() {

function renderReward() {
  const eggsEl = document.getElementById('phEggs');
  const streakEl = document.getElementById('phStreak');
  if (!eggsEl) return;
  const levels = PH_LEVELS.filter(l => /^L\d+$/.test(l.id));

  }).join('');

  const st = phStat.data.streak;
  if (streakEl) {
    streakEl.innerHTML = `🔥 连续 <b>${st.days || 0}</b> 天 · 已通关 <b>${levels.filter(l => phProg.done[l.id]).length}</b> / ${levels.length}`
      + (phStat.data.place ? ` · 从 <b>${esc(phStat.data.place.rec)}</b> 开始` : ' · 还没做定级测');
  }
}

function renderReport() {
  const el = document.getElementById('phReport');
  if (!el) return;
  const stat = phStat.data.stat;
  let tr = 0, tw = 0;
  Object.keys(stat).forEach(k => {
    if (/^L\d/.test(k)) { tr += stat[k].r; tw += stat[k].w; }
  });
  const rate = (tr + tw) ? Math.round(tr / (tr + tw) * 100) : 0;
  const doneN = PH_LEVELS.filter(l => /^L\d+$/.test(l.id) && phProg.done[l.id]).length;
  const place = phStat.data.place;
  const st = phStat.data.streak;
  const rows = PH_LEVELS.filter(l => /^L\d+$/.test(l.id)).map(l => {
    const s = stat[l.id] || { r: 0, w: 0 };
    const n = s.r + s.w;
    const pct = n ? Math.round(s.r / n * 100) + '%' : '—';
    const state = phProg.done[l.id] ? '⭐ 已通关' : (n ? '🐣 学习中' : '未开始');
    return `<tr><td>${esc(l.id)} ${esc(l.name)}</td><td>${state}</td><td>${s.r} / ${s.w}</td><td>${pct}</td></tr>`;
  }).join('');
  const tips = [];
  if (!place) tips.push('还没做定级测：点地图上方「🎯 先测一测」，8 题找到合适的起点。');
  else tips.push('定级推荐从 <b>' + esc(place.rec) + '</b> 开始（摸底答对 ' + place.right + '/' + place.total + '）。');
  PH_LEVELS.filter(l => /^L\d+$/.test(l.id)).forEach(l => {
    const s = stat[l.id];
    if (s && (s.r + s.w) >= 4 && s.r / (s.r + s.w) < 0.7) {
      tips.push('「' + esc(l.name) + '」正确率 ' + Math.round(s.r / (s.r + s.w) * 100) + '% 偏低，建议回这关再练一轮。');
    }
  });
  const next = PH_LEVELS.find(l => /^L\d+$/.test(l.id) && !phProg.done[l.id]);
  tips.push(next
    ? '当前进度：<b>' + esc(next.id + ' ' + next.name) + '</b>，按顺序继续就好。'
    : '全部通关！去「拼读闯关」游戏巩固，或用 L13 听音能写保持手感。');
  el.innerHTML = `<div class="card">
    <button class="btn ghost" style="margin-bottom:10px" onclick="phCloseReport()">← 回地图</button>
    <h2>👨‍👩‍👧 学习报告 <small>数据只存在本机浏览器，不上传</small></h2>
    <div class="ph-report-grid">
      <div class="ph-metric"><span>通关进度</span><b>${doneN} / ${PH_LEVELS.filter(l => l.id !== 'TX').length}</b></div>
      <div class="ph-metric"><span>连续学习</span><b>${st.days || 0} 天</b></div>
      <div class="ph-metric"><span>累计答题</span><b>${tr + tw} 题</b></div>
      <div class="ph-metric"><span>正确率</span><b>${rate}%</b></div>
    </div>
    <table class="ph-table"><thead><tr><th>关卡</th><th>状态</th><th>对 / 错</th><th>正确率</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="ph-tips">📌 <b>学习建议</b><ul>${tips.map(t => '<li>' + t + '</li>').join('')}</ul></div>
    <button class="btn ghost" onclick="phClear()">🧹 清空本机学习记录</button>
  </div>`;
}
function phCloseReport() {
  document.body.classList.remove('ph-report');
  window.scrollTo({ top: 0, behavior: 'auto' });
}
window.phCloseReport = phCloseReport;

function phClear() {
  if (!confirm('确定清空本机的星星、彩蛋和答题记录吗？此操作不可恢复。')) return;
  try { localStorage.removeItem('phlv1'); localStorage.removeItem('phstat2'); } catch (e) {}
  location.reload();
}
window.phClear = phClear;

function render() {
  const lv = PH_LEVELS.find(l => l.id === CUR) || PH_LEVELS[0];
  CUR = lv.id;
  renderMap(); renderReward(); renderReport();
  PHR.length = 0;
  document.getElementById('phStage').innerHTML = levelHTML(lv);
  if (lv.kind === 'spell') { mgReset(lv); if (!SP.words.length) spStart(); else spPaint(); }
  else { mgReset(lv); mgPaint(); }
}

/* ---------------- 地图屏 ↔ 课程屏（2026-11-22 两屏化） ----------------
   原来只有一屏：地图在上、当前关的课程在下，点关卡用 smooth scroll 跳到底部。
   结果是 390px 下 4991px、320px 下 6592px 的长页 —— 孩子点进去之后不知道
   自己在哪，也不好回地图。现在拆成两屏：
     · 地图屏：选关（默认）
     · 课程屏：只显示吸顶返回条 + 这一关的内容
   返回走 history.back()，所以安卓返回键 / 浏览器后退键是「课程 → 地图」，
   而不是直接离开页面。 */
let PH_LESSON = false;
function phEnterLesson(lv) {
  PH_LESSON = true;
  document.body.classList.remove('ph-report');
  document.body.classList.add('ph-lesson');
  const bar = document.getElementById('phLessonBar');
  if (bar) bar.hidden = false;
  const t = document.getElementById('phLessonTitle');
  if (t) t.textContent = lv ? lv.name : '拼读课';
  const step = document.getElementById('phLessonStep');
  if (step && lv) {
    const i = PH_LEVELS.findIndex(x => x.id === lv.id);
    step.textContent = i >= 0 ? ('第 ' + (i + 1) + ' / ' + PH_LEVELS.length + ' 关') : '';
  }
}
function phExitLesson(keepHistory) {
  document.body.classList.remove('ph-report');
  if (!PH_LESSON) return;
  PH_LESSON = false;
  document.body.classList.remove('ph-lesson');
  const bar = document.getElementById('phLessonBar');
  if (bar) bar.hidden = true;
  if (!keepHistory) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function phBack() {
  if (history.state && history.state.ph) {
    try { history.back(); return; } catch (e) {}
  }
  phExitLesson();
}
window.phBack = phBack;

/* 壳内返回键：课程屏里先回地图，不要让 App 直接退出或回上一页 */
if (window.Shell && Shell.onBack) {
  Shell.onBack(function () {
    if (!PH_LESSON) return false;
    phExitLesson();
    return true;
  });
}

function phGo(id) {
  if (id === 'report') {
    phExitLesson();
    document.body.classList.add('ph-report');
    /* 报告刚从 display:none 变可见，等一帧再算 offsetTop 才准 */
    requestAnimationFrame(() => {
      const el = document.getElementById('phReport');
      if (el) window.scrollTo({ top: Math.max(0, el.offsetTop - 12), behavior: 'smooth' });
    });
    return;
  }
  if (!PH_LEVELS.some(l => l.id === id)) id = 'L1';
  const lv = PH_LEVELS.find(l => l.id === id);
  const first = !PH_LESSON;
  CUR = id;
  /* ⚠️ 顺序不能反：stage 默认 display:none，先 render 再显示的话，
     迷宫/能量格量到的宽度是 0，会画成空白。先显示，再渲染。 */
  phEnterLesson(lv);
  render();
  try {
    if (first) history.pushState({ ph: id }, '', '#' + id);
    else history.replaceState({ ph: id }, '', '#' + id);
  } catch (e) { location.hash = id; }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
window.phGo = phGo; window.mgPlaySound = mgPlaySound;

/* 旧锚点兼容（#s1…#s11 → 新关卡） */
const LEGACY = { s1: 'L1', s2: 'TX', s3: 'L2', s4: 'L3', s5: 'L4', s6: 'L5', s7: 'L6', s8: 'L7', s9: 'L12', s10: 'L2', s11: 'L13' };
(function initRoute() {
  let h = (location.hash || '').replace(/^#/, '');
  if (LEGACY[h]) h = LEGACY[h];
  if (!PH_LEVELS.some(l => l.id === h)) {
    /* 默认停在「第一关未通关处」，全通关则 L1 */
    h = 'L1';
    for (const lv of PH_LEVELS) {
      if (lv.id !== 'TX' && !phProg.done[lv.id]) { h = lv.id; break; }
    }
  }
  CUR = h;
})();

/* ---------------- ⑪ 听音能写（拼写编码） ---------------- */
const SP = { words: [], idx: 0, total: 10, score: 0, cur: '', tiles: [], built: [], msg: '' };
function spShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function spAgain() { if (SP.cur) speakWord(SP.cur); }
function spPaint() {
  const el = document.getElementById('spProg');
  if (!el) return;
  el.textContent = '第 ' + Math.min(SP.idx + 1, SP.total) + ' / ' + SP.total + ' 题';
  document.getElementById('spScore').textContent = '得分 ' + SP.score;
  document.getElementById('spLen').textContent = '这个词有 ' + SP.cur.length + ' 个字母';
  document.getElementById('spSlots').innerHTML = SP.cur.split('').map((_, i) => {
    const t = SP.built[i];
    return `<button class="sp-slot ${t ? 'filled' : ''}" ${t ? `onclick="spSlot(${i})"` : 'disabled'}>${t ? esc(t.ch) : ''}</button>`;
  }).join('');
  document.getElementById('spPool').innerHTML = SP.tiles.map((t, i) =>
    t.used ? `<span class="sp-tile used">·</span>`
           : `<button class="sp-tile" onclick="spTile(${i})">${esc(t.ch)}</button>`).join('');
  document.getElementById('spMsg').textContent = SP.msg;
}
function spLoad() {
  if (SP.idx >= SP.total) {
    document.getElementById('spSlots').innerHTML = '';
    document.getElementById('spPool').innerHTML = '';
    document.getElementById('spLen').textContent = '';
    document.getElementById('spMsg').innerHTML =
      `<div class="sp-done">🎉 一轮完成！${SP.score} / ${SP.total} 拼对<br><button class="btn coral" style="margin-top:10px" onclick="spStart()">再来一轮</button></div>`;
    phStat.rec('L13', SP.score, SP.total - SP.score);
    phStat.touchDay();
    if (SP.score >= 8 && !phProg.done['L13']) {
      phProg.mark('L13');
      eggReward('L13');
    }
    renderMap(); renderReward(); renderReport();
    return;
  }
  SP.cur = SP.words[SP.idx];
  SP.built = []; SP.msg = '';
  const letters = SP.cur.split('');
  const pool = letters.map(ch => ({ ch: ch, used: false }));
  const alpha = 'abcdefghijklmnopqrstuvwxyz';
  let guard = 0;
  const extras = [];
  while (extras.length < 3 && guard++ < 200) {
    const ch = alpha[Math.floor(Math.random() * 26)];
    if (letters.indexOf(ch) < 0 && !extras.some(e => e.ch === ch)) extras.push({ ch: ch, used: false });
  }
  SP.tiles = spShuffle(pool.concat(extras));
  spPaint();
  setTimeout(() => speakWord(SP.cur), 120);
}
function spStart() {
  SP.words = spShuffle(SPELL_WORDS.slice()).slice(0, SP.total);
  SP.idx = 0; SP.score = 0;
  spLoad();
}
function spTile(i) {
  if (SP.built.length >= SP.cur.length) return;
  const t = SP.tiles[i];
  if (!t || t.used) return;
  t.used = true;
  SP.built.push(t);
  if (SP.built.length === SP.cur.length) {
    const s = SP.built.map(x => x.ch).join('');
    if (s === SP.cur) {
      SP.score++;
      SP.msg = '✅ 拼对了！';
      spPaint();
      setTimeout(() => { SP.idx++; spLoad(); }, 850);
    } else {
      SP.msg = '❌ 顺序不对，退回去再试';
      spPaint();
      setTimeout(() => {
        SP.built.forEach(x => { x.used = false; });
        SP.built = []; SP.msg = '';
        spPaint();
        setTimeout(() => speakWord(SP.cur), 150);
      }, 1050);
    }
    return;
  }
  spPaint();
}
function spSlot(i) {
  const t = SP.built[i];
  if (!t) return;
  t.used = false;
  SP.built.splice(i, 1);
  SP.msg = '';
  spPaint();
}
window.spStart = spStart; window.spTile = spTile; window.spSlot = spSlot; window.spAgain = spAgain;

/* 首绘 */
render();
window.addEventListener('hashchange', () => {
  let h = (location.hash || '').replace(/^#/, '');
  if (LEGACY[h]) h = LEGACY[h];
  if (h && h !== CUR && PH_LEVELS.some(l => l.id === h)) { CUR = h; render(); }
});
/* 安卓返回键 / 浏览器后退：课程屏 → 地图屏，不离开页面 */
window.addEventListener('popstate', () => { phExitLesson(true); });
/* 深链 #L3 直接进课程屏（和「点了这一关」表现一致） */
(function initLessonDeepLink() {
  const h = (location.hash || '').replace(/^#/, '');
  if (PH_LEVELS.some(l => l.id === h)) phEnterLesson(PH_LEVELS.find(l => l.id === h));
})();

/* 预热 39 个音素（每个 3-5KB）：首屏画完再拉，点按零延迟 */
window.addEventListener('load', () => {
  try {
    const ks = 'abcdefghijklmnopqrstuvwxyz'.split('').concat(['sh','ch','th','ai','ay','oa','ck','ee','oo','ar','or','ir','ng']);
    ks.forEach(k => { const a = new Audio(phonicsURL(k)); a.preload = 'auto'; });
  } catch (e) {}
});

/* ---------------- 音素速查（2026-11-22 从首页搬回） ----------------
   首页原来铺 18 个音素胶囊，和「继续学习」抢注意力；但这是拼读卡壳时
   最实用的工具，不能删。现在收进地图卡的折叠区：默认不占首屏，点开即用。
   数字口径：5 个短元音 + PH_BLOCKS.length 个拼读块。 */
(function () {
  const el = document.getElementById('phAudioChips');
  if (!el || typeof PH_BLOCKS === 'undefined') return;
  const vowels = ['a', 'e', 'i', 'o', 'u'].map(v => {
    const l = (typeof LETTERS !== 'undefined') ? LETTERS.find(x => x.L.toLowerCase() === v) : null;
    const ipa = l ? l.szh.split(' ')[0] : '';
    return `<button type="button" onclick="phPlayBlock('${v}')" title="点我听 ${v} 的音"><b>${v}</b><small>${esc(ipa)}</small></button>`;
  }).join('');
  const blocks = PH_BLOCKS.map(b =>
    `<button type="button" class="blk" onclick="phPlayBlock('${b.b}')" title="点我听 ${b.b} 的音"><b>${esc(b.b)}</b><small>${esc(b.ipa)}</small></button>`).join('');
  el.innerHTML = vowels + blocks;
})();
</script>
</body>
</html>
