<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绘本馆 · 小鸟英语乐园</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<main>
  <div class="page-title">
    <h1>📚 绘本馆</h1>
    <p>自己读的第一本英语书！点句子听真人朗读，读完一整本得奖励 🎁</p>
  </div>
  <div id="app"></div>
</main>

<script src="js/words-data.js?v=7"></script>
<script src="js/data.js?v=7"></script>
<script src="js/app.js?v=7"></script>
<script>
renderNav('books'); renderDecor();

let curBook = null, curPage = 0;

/* ---------------- 书架 ---------------- */
function renderShelf() {
  curBook = null;
  const read = Object.keys(Store.d.books || {});
  $('#app').innerHTML = `
    <div class="card" style="border-color:var(--grape);margin-bottom:18px">
      <h2>📖 怎么读绘本？</h2>
      <p style="font-size:.88rem;color:#5C6273;line-height:1.9;margin:4px 0 0">
        ① 点 <b>封面</b>开始翻页 ｜ ② 点<b>英语句子</b>听真人朗读，跟着读 ｜ ③ 点 🎧 听整页 ｜ ④ 翻到最后一页，得 ⭐×2 + 完成印章！
      </p>
    </div>
    <div class="island-grid">
      ${BOOKS.map((b, i) => `
        <a class="island" style="border-color:${b.color}" onclick="openBook(${i})">
          ${read.includes(b.id) ? '<span class="tag" style="border-color:var(--mint);color:#4E9E59">✅ 读过</span>' : '<span class="tag" style="border-color:' + b.color + ';color:' + b.color + '">6 页</span>'}
          <div class="isl-emoji">${b.emoji}</div>
          <h3>${b.title}</h3>
          <p>入门绘本 · 用学过的单词写成</p>
        </a>`).join('')}
    </div>
    <div style="text-align:center;margin-top:16px;color:#5C6273;font-size:.85rem">
      已读完 <b style="color:#4E9E59">${read.length}</b> / ${BOOKS.length} 本，读完全部获得「📖 小书虫」徽章！
    </div>`;
}

/* ---------------- 阅读器 ---------------- */
function openBook(i) {
  curBook = i; curPage = 0;
  sfx.pop();
  renderPage();
}
function renderPage() {
  const b = BOOKS[curBook];
  const p = b.pages[curPage];
  const isLast = curPage === b.pages.length - 1;
  const wasRead = !!Store.d.books[b.id];
  // 预热本页句子和下一页的音频，翻页零等待
  prewarmWord(p.en.split('. ').filter(Boolean).join('.'));
  if (!isLast) { const np = b.pages[curPage + 1]; prewarmWord(np.en); }
  $('#app').innerHTML = `
    <div class="card" style="max-width:620px;margin:0 auto;text-align:center;border-color:${b.color}">
      <div class="score-bar">
        <b>${b.emoji} ${b.title}</b>
        <span>${curPage + 1} / ${b.pages.length}</span>
      </div>
      <div style="font-size:110px;line-height:1.2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))">${p.img}</div>
      <div style="margin:14px 0">
        <div class="book-sentence" onclick="speak('${p.en.replace(/'/g, "\\'")}')" title="点我听朗读">${p.en}</div>
        <div style="color:#5C6273;font-size:.9rem;margin-top:6px">${p.zh}</div>
      </div>
      <button class="btn ghost" onclick="readWholePage()">🎧 听整页</button>
      <div class="page-dots">
        ${b.pages.map((_, di) => `<i class="${di === curPage ? 'on' : (di < curPage ? 'done' : '')}"></i>`).join('')}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">
        ${curPage > 0 ? `<button class="btn ghost big" onclick="curPage--;renderPage()">◀ 上一页</button>` : ''}
        ${isLast
          ? `<button class="btn mint big" onclick="finishBook()">🎉 读完了！</button>`
          : `<button class="btn grape big" onclick="nextPage()">下一页 ▶</button>`}
        <button class="btn ghost" onclick="renderShelf()">📚 书架</button>
      </div>
    </div>`;
}
function readWholePage() {
  const b = BOOKS[curBook];
  const p = b.pages[curPage];
  // 整页按句号拆句，顺序朗读（真人女声链）
  const parts = p.en.split(/(?<=[.!?])\s+/).filter(Boolean);
  speakChain(parts.map(t => ({ text: t.trim(), rate: 0.9 })));
}
function nextPage() {
  const b = BOOKS[curBook];
  if (curPage < b.pages.length - 1) { curPage++; sfx.pop(); renderPage(); }
}
function finishBook() {
  const b = BOOKS[curBook];
  const first = !Store.d.books[b.id];
  if (first) {
    Store.d.books[b.id] = { t: Date.now() };
    markActivity('books'); Store.save();
    addStars(2); confetti(); sfx.win();
    toast('🎉 读完一整本绘本！+2 ⭐');
    checkBadges();
  } else {
    sfx.win(); toast('💪 再读一遍，真好！');
  }
  $('#app').innerHTML = `
    <div class="card bounce-in" style="max-width:520px;margin:0 auto;text-align:center;padding:34px 24px">
      <div style="font-size:80px">${b.emoji}</div>
      <h2 style="justify-content:center">${b.title}${first ? ' 读完啦！' : ' 又读一遍！'}</h2>
      <p style="color:#5C6273;font-size:.9rem">读完 <b>${Object.keys(Store.d.books).length}</b> / ${BOOKS.length} 本${Object.keys(Store.d.books).length >= 6 ? '，你是小书虫冠军！🏆' : '，继续加油！'}</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        <button class="btn mint big" onclick="openBook(${curBook})">🔄 再读一遍</button>
        <button class="btn grape big" onclick="renderShelf()">📚 换一本</button>
      </div>
    </div>`;
  curBook = null;
}

renderShelf();
</script>
<style>
.book-sentence {
  display:inline-block; font-size:1.35rem; font-weight:700; cursor:pointer; padding:10px 18px;
  border-radius:18px; background:#FFF7DA; border:3px dashed var(--lemon); transition:.15s; line-height:1.7;
}
.book-sentence:hover { background:#FFF0C2; transform:translateY(-2px); }
.page-dots { display:flex; gap:8px; justify-content:center; margin-top:16px; }
.page-dots i { width:14px; height:14px; border-radius:50%; background:#E8EAF0; }
.page-dots i.done { background:var(--mint); }
.page-dots i.on { background:var(--grape); transform:scale(1.3); }
</style>
</body>
</html>
