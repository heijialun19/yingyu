<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绘本馆 · 小鸟英语乐园</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=8">
<style>
.illust{width:100%;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(45,49,66,.15);background:#fff}
.illust svg{display:block;width:100%;height:auto}
.story-en{display:block;font-size:1.25rem;font-weight:700;cursor:pointer;padding:10px 18px;border-radius:16px;background:#FFF7DA;border:3px dashed #FFD93D;transition:.15s;text-align:center;line-height:1.7}
.story-en:hover{background:#FFF0C2;transform:translateY(-2px)}
.story-zh{color:#5C6273;font-size:.92rem;margin-top:6px;text-align:center}
.book-cover{border-radius:24px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;box-shadow:0 6px 18px rgba(45,49,66,.12);background:#fff}
.book-cover:hover{transform:translateY(-6px) scale(1.03)}
.book-cover svg{display:block;width:100%;height:auto}
.cover-title{position:absolute;bottom:0;left:0;right:0;padding:10px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-weight:700;font-size:.9rem;border-radius:0 0 24px 24px}
.read-mark{position:absolute;top:10px;right:10px;font-size:1.4rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.page-dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.page-dots i{width:14px;height:14px;border-radius:50%;background:#E8EAF0}
.page-dots i.done{background:var(--mint)}
.page-dots i.on{background:var(--grape);transform:scale(1.3)}
@keyframes pgIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes pgBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.pg-fwd{animation:pgIn .35s ease-out}
.pg-back{animation:pgBack .35s ease-out}
</style>
</head>
<body>
<main>
  <div class="page-title"><h1>📚 绘本馆</h1><p>原创动漫插画绘本 · 点句子听真人朗读 · 读完得奖励 🎁</p></div>
  <div id="app"></div>
</main>
<script src="js/words-data.js?v=7"></script>
<script src="js/data.js?v=7"></script>
<script src="js/app.js?v=7"></script>
<script>
renderNav('books'); renderDecor();
let curBook=null,curPage=0,turnDir=1;
/* SVG 动漫插画工具 */
function grad(id,c1,c2){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs>`}
function eyes(cx,cy,r,col){return `<circle cx="${cx-r*1.6}" cy="${cy}" r="${r}" fill="white"/><circle cx="${cx+r*1.6}" cy="${cy}" r="${r}" fill="white"/><circle cx="${cx-r*1.6}" cy="${cy+1}" r="${r*.7}" fill="${col}"/><circle cx="${cx+r*1.6}" cy="${cy+1}" r="${r*.7}" fill="${col}"/><circle cx="${cx-r*1.3}" cy="${cy-r*.3}" r="${r*.25}" fill="white"/><circle cx="${cx+r*1.9}" cy="${cy-r*.3}" r="${r*.25}" fill="white"/>`}
function blush(cx,cy,w){return `<ellipse cx="${cx}" cy="${cy}" rx="${w}" ry="${w*.55}" fill="#FFB3B3" opacity=".5"/>`}
function smile(cx,cy,w){return `<path d="M${cx-w/2},${cy} Q${cx},${cy+w*.7} ${cx+w/2},${cy}" stroke="#E8542F" stroke-width="3" fill="none" stroke-linecap="round"/>`}
function cloud(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse rx="30" ry="13" fill="rgba(255,255,255,.8)"/><ellipse cx="20" cy="-8" rx="19" ry="10" fill="rgba(255,255,255,.8)"/><ellipse cx="-18" cy="-5" rx="14" ry="8" fill="rgba(255,255,255,.8)"/></g>`}
function sun(x,y){return `<g transform="translate(${x||340},${y||40})"><circle r="19" fill="#FFD93D"/><circle r="13" fill="#FFE55C"/><g stroke="#FFD93D" stroke-width="3" stroke-linecap="round"><line y1="-27" y2="-34"/><line y1="27" y2="34"/><line x1="-27" x2="-34"/><line x1="27" x2="34"/><line x1="-19" y1="-19" x2="-25" y2="-25"/><line x1="19" y1="19" x2="25" y2="25"/><line x1="19" y1="-19" x2="25" y2="-25"/><line x1="-19" y1="19" x2="-25" y2="25"/></g></g>`}
function tree(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><rect x="-5" y="26" width="10" height="32" fill="#8B5A2B" rx="3"/><circle cy="13" r="24" fill="#5EAD62"/><circle cx="-13" cy="18" r="15" fill="#6BCB77"/><circle cx="13" cy="18" r="15" fill="#6BCB77"/><circle cy="3" r="17" fill="#7BD585"/></g>`}
function flower(x,y,c,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><line y2="14" stroke="#5EAD62" stroke-width="3"/><g fill="${c||'#FF8FAB'}">${[0,72,144,216,288].map(a=>`<ellipse cy="-7" rx="5" ry="8" transform="rotate(${a})"/>`).join('')}</g><circle r="4" fill="#FFD93D"/></g>`}
function fruit(x,y,t,s){if(t==='banana')return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M-17,7 Q0,20 17,3 Q13,15 0,17 Q-13,15 -17,7Z" fill="#FFD93D" stroke="#D4A017" stroke-width="2"/></g>`;if(t==='grape')return `<g transform="translate(${x},${y}) scale(${s||1})">${[[-6,-8],[6,-8],[0,-1],[-10,1],[10,1],[-4,6],[4,6],[0,12]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#9B72FF"/>`).join('')}<path d="M0,-15 Q5,-22 9,-19" stroke="#5EAD62" stroke-width="2" fill="none"/></g>`;const c=t==='orange'?['#FF9F45','#FFB26B']:['#FF6B6B','#FF8E8E'];return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M-2,-13 Q0,-20 5,-18" stroke="#8B5A2B" stroke-width="2" fill="none"/><ellipse cx="-4" cy="-12" rx="5" ry="3" fill="#4E9E59" transform="rotate(-30)"/><circle r="14" fill="${c[0]}"/><circle cx="-4" cy="-4" r="8" fill="${c[1]}"/><ellipse cx="-4" cy="-3" rx="3" ry="4" fill="rgba(255,255,255,.35)"/></g>`}
function skyBG(c1,c2){return grad('sk',c1||'#87CEEB',c2||'#E0F6FF')+`<rect width="400" height="280" fill="url(#sk)"/>`}
function ground(y){return `<rect y="${y}" width="400" height="${280-y}" fill="#6BCB77"/>`}
/* 角色 */
function cat(x,y,s,m){const e=m==='sleep'?`<path d="M-14,-8 Q-10,-12 -5,-8 M5,-8 Q10,-12 14,-8" stroke="#2D3142" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:eyes(0,-8,9,'4A3728');const mo=m==='sleep'?`<circle cy="8" r="4" fill="#E8542F"/>`:m==='surprise'?`<circle cy="8" r="6" fill="#E8542F"/>`:smile(0,6,12);return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="54" rx="32" ry="6" fill="rgba(0,0,0,.1)"/><path d="M-26,-26 L-33,-48 L-12,-38Z" fill="#FF9F45"/><path d="M26,-26 L33,-48 L12,-38Z" fill="#FF9F45"/><circle r="31" fill="#FF9F45"/><circle r="24" fill="#FFC98B"/>${e}${mo}${blush(-18,2)}${blush(18,2)}<path d="M-3,2 L0,5 L3,2" stroke="#C46A1B" stroke-width="2" fill="none"/><ellipse cx="-9" cy="34" rx="19" ry="13" fill="#FF9F45"/><ellipse cx="13" cy="34" rx="19" ry="13" fill="#FF9F45"/><path d="M25,35 Q38,29 40,19" stroke="#FF9F45" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-19" cy="36" rx="15" ry="17" fill="#FF9F45"/><ellipse cx="19" cy="36" rx="15" ry="17" fill="#FF9F45"/></g>`}
function mouse(x,y,s,run){return `<g transform="translate(${x},${y}) scale(${s||1}) ${run?'skewX(-8)':''}"><ellipse cy="32" rx="24" ry="5" fill="rgba(0,0,0,.1)"/><circle cx="-24" cy="-10" r="13" fill="#B8B8B8"/><circle cx="-24" cy="-10" r="8" fill="#FFB3B3"/><circle r="24" fill="#CFCFCF"/><circle cy="7" r="17" fill="#E8E8E8"/>${eyes(0,-4,6,'333')}<circle cy="2" r="3" fill="#FF9FAB"/>${run?'<circle cy="8" r="4" fill="#E8542F"/>':smile(0,5,8)}<ellipse cx="-17" cy="27" rx="13" ry="9" fill="#CFCFCF"/><ellipse cx="17" cy="27" rx="13" ry="9" fill="#CFCFCF"/><path d="M24,16 Q36,10 40,3" stroke="#CFCFCF" stroke-width="5" fill="none" stroke-linecap="round"/></g>`}
function kid(x,y,s,g,m){const hc=g==='boy'?'#2D3142':'#8B4513';const sc=g==='boy'?'#4EC5F1':'#FF8FAB';const hl=g==='girl'?`<path d="M-22,-20 Q-28,8 -24,26 L-13,22 Q-17,0 -15,-18Z" fill="${hc}"/><path d="M22,-20 Q28,8 24,26 L13,22 Q17,0 15,-18Z" fill="${hc}"/>`:'';return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="50" rx="21" ry="5" fill="rgba(0,0,0,.1)"/><rect x="-16" y="17" width="32" height="27" rx="10" fill="${sc}"/><rect x="-20" y="17" width="8" height="21" rx="4" fill="${sc}"/><rect x="12" y="17" width="8" height="21" rx="4" fill="${sc}"/><rect x="-14" y="42" width="10" height="10" rx="3" fill="#4A6FA5"/><rect x="4" y="42" width="10" height="10" rx="3" fill="#4A6FA5"/><circle r="22" fill="#FFE0BD"/><path d="M-22,-10 Q-18,-27 0,-25 Q18,-27 22,-10 Q18,-18 0,-16 Q-18,-18 -22,-10Z" fill="${hc}"/>${hl}${eyes(0,-4,7,'2D3142')}${smile(0,6,10)}${blush(-14,4,6)}${blush(14,4,6)}</g>`}
function bird(x,y,s,c){return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="25" rx="17" ry="4" fill="rgba(0,0,0,.08)"/><ellipse cy="8" rx="19" ry="15" fill="${c||'#FFD93D'}"/><circle cy="-12" r="15" fill="${c||'#FFD93D'}"/><path d="M-4,-27 L-1,-35 L1,-27" fill="#FF9F45"/>${eyes(0,-13,5,'333')}<path d="M-2,-6 L6,-2 L-2,1Z" fill="#FF9F45"/>${smile(3,3,6)}<ellipse cx="-13" cy="6" rx="8" ry="11" fill="${c||'#FFD93D'}" opacity=".8"/><ellipse cx="13" cy="6" rx="8" ry="11" fill="${c||'#FFD93D'}" opacity=".8"/></g>`}
function frog(x,y,s,m){const mo=m==='sad'?`<path d="M-7,8 Q0,4 7,8" stroke="#2D5F1A" stroke-width="3" fill="none"/>`:`<path d="M-9,6 Q0,13 9,6" stroke="#2D5F1A" stroke-width="3" fill="none"/>`;return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="35" rx="23" ry="5" fill="rgba(0,0,0,.1)"/><circle cx="-16" cy="-17" r="10" fill="#6BCB4F"/><circle cx="16" cy="-17" r="10" fill="#6BCB4F"/><circle cx="-16" cy="-17" r="5" fill="white"/><circle cx="16" cy="-17" r="5" fill="white"/><circle cx="-16" cy="-16" r="3" fill="#2D3142"/><circle cx="16" cy="-16" r="3" fill="#2D3142"/><ellipse rx="25" ry="21" fill="#6BCB4F"/><ellipse cy="6" rx="15" ry="9" fill="#A8E6A3"/>${mo}${blush(-15,0,5)}${blush(15,0,5)}<ellipse cx="-12" cy="25" rx="10" ry="8" fill="#6BCB4F"/><ellipse cx="12" cy="25" rx="10" ry="8" fill="#6BCB4F"/></g>`}

/* ============ 6 本原创绘本 ============ */
const BOOKS=[
{id:'b1',title:'The Little Cat',zhTitle:'小猫咪咪',emoji:'🐱',color:'#FF9F45',pages:[
 {svg:()=>skyBG()+sun()+cloud(80,50)+cloud(300,30,.7)+ground(200)+tree(50,170)+flower(120,200)+flower(320,205,'#FFD93D',.8)+cat(200,150,1.1),en:'This is Mimi. Mimi is a little cat.',zh:'这是咪咪，咪咪是一只小猫。'},
 {svg:()=>skyBG()+sun(350,35)+ground(200)+tree(60,170)+cat(140,140,1,'surprise')+mouse(280,160,.8,true)+`<text x="200" y="55" font-size="22" fill="#FF6B6B" font-weight="bold" text-anchor="middle" font-family="Arial">!</text>`,en:'Oh! Mimi sees a little mouse!',zh:'哦！咪咪看见了一只小老鼠！'},
 {svg:()=>skyBG('#FFD93D','#FFE8B3')+cloud(100,40)+ground(200)+cat(120,130,.9,'surprise')+mouse(300,170,.7,true)+`<line x1="170" y1="140" x2="260" y2="160" stroke="#FF6B6B" stroke-width="3" stroke-dasharray="8,5" stroke-linecap="round"/>`,en:'Run, mouse, run! Mimi runs too!',zh:'跑呀老鼠，跑呀！咪咪也在跑！'},
 {svg:()=>skyBG()+cloud(200,50,.8)+ground(200)+tree(320,170,1.2)+flower(80,200)+cat(200,140,.8)+kid(120,160,.7,'girl')+kid(290,165,.7,'boy'),en:'The mouse is fast. Mimi is tired.',zh:'老鼠跑得快，咪咪累了。'},
 {svg:()=>grad('nt','#2C3E7C','#1A2455')+`<rect width="400" height="280" fill="url(#nt)"/><circle cx="320" cy="50" r="20" fill="#FFF3C4"/><circle cx="50" cy="40" r="2" fill="white"/><circle cx="100" cy="60" r="2" fill="white"/><circle cx="200" cy="30" r="2" fill="white"/><rect y="200" width="400" height="80" fill="#2A4A2E"/><ellipse cx="200" cy="200" rx="180" ry="16" fill="#35583A"/>`+cat(200,140,.9,'sleep')+`<text x="160" y="100" font-size="13" fill="#FFD93D" font-family="Arial">Z z z</text>`,en:'Now Mimi sleeps. Good night, Mimi!',zh:'现在咪咪睡了。晚安，咪咪！'},
 {svg:()=>skyBG('#FFB347','#FFCC80')+sun(340,45)+ground(200)+flower(60,200)+flower(340,195)+cat(200,140,1.1)+bird(100,80,.7)+bird(300,60,.5,'#FF8FAB')+`<text x="200" y="40" font-size="17" fill="#FF6B6B" font-weight="bold" text-anchor="middle" font-family="Arial">What a good day!</text>`,en:'What a good day! Mimi is happy.',zh:'多么美好的一天呀！咪咪很开心。'}
]},
{id:'b2',title:'My Family',zhTitle:'我的家人',emoji:'👨‍👩‍👧',color:'#FF8FAB',pages:[
 {svg:()=>grad('p1','#FFF0F5','#FFE4E1')+`<rect width="400" height="280" fill="url(#p1)"/><rect x="30" y="40" width="340" height="200" rx="20" fill="#fff" stroke="#FFC0CB" stroke-width="4"/>`+kid(200,110,1.2,'girl')+`<text x="200" y="225" font-size="15" fill="#FF69B4" font-weight="bold" text-anchor="middle" font-family="Arial">Hello! I am Lily.</text>`,en:'Hello! I am Lily. This is my family.',zh:'你好！我是莉莉。这是我的家人。'},
 {svg:()=>grad('p2','#E0F7FA','#E1F5FE')+`<rect width="400" height="280" fill="url(#p2)"/><rect y="160" width="400" height="120" fill="#81C784"/><g transform="translate(200,80)"><rect x="-20" y="15" width="40" height="35" rx="12" fill="#4EC5F1"/><circle fill="#FFE0BD" r="24"/><path d="M-24,-8 Q-19,-27 0,-23 Q19,-27 24,-8 Q17,-19 0,-16 Q-17,-19 -24,-8Z" fill="#2D3142"/>`+eyes(0,-4,7)+smile(0,6,11)+`</g>`+kid(90,130,.6,'girl')+`<text x="200" y="230" font-size="15" fill="#0277BD" font-weight="bold" text-anchor="middle" font-family="Arial">My dad is tall.</text>`,en:'This is my dad. My dad is tall.',zh:'这是我爸爸，我爸爸很高。'},
 {svg:()=>grad('p3','#F3E5F5','#E1BEE7')+`<rect width="400" height="280" fill="url(#p3)"/><rect y="160" width="400" height="120" fill="#CE93D8"/><g transform="translate(200,75)"><rect x="-18" y="15" width="36" height="38" rx="12" fill="#AB47BC"/><circle fill="#FFE0BD" r="23"/><path d="M-23,-8 Q-17,-29 0,-25 Q17,-29 23,-8 Q15,-19 0,-16 Q-15,-19 -23,-8Z" fill="#8B4513"/><path d="M-21,-10 Q-29,14 -23,33 L-11,27 Q-15,5 -13,-17Z" fill="#8B4513"/><path d="M21,-10 Q29,14 23,33 L11,27 Q15,5 13,-17Z" fill="#8B4513"/>`+eyes(0,-4,7)+smile(0,6,11)+blush(-13,4)+blush(13,4)+`</g>`+kid(90,130,.6,'girl')+`<text x="200" y="230" font-size="15" fill="#6A1B9A" font-weight="bold" text-anchor="middle" font-family="Arial">My mom is kind.</text>`,en:'This is my mom. My mom is kind.',zh:'这是我妈妈，我妈妈很温柔。'},

 {svg:()=>grad('p5','#FFF3E0','#FFE0B2')+`<rect width="400" height="280" fill="url(#p5)"/><rect y="165" width="400" height="115" fill="#FFB74D"/><g transform="translate(140,75)"><rect x="-7" y="25" width="14" height="22" fill="#FFCC80"/><path d="M0,22 Q17,17 21,2 Q24,17 11,23 Q5,25 0,24Z" fill="#81C784"/></g>`+kid(250,100,.9,'girl')+`<text x="200" y="230" font-size="15" fill="#E65100" font-weight="bold" text-anchor="middle" font-family="Arial">I love my sister.</text>`,en:'This is my sister. I love my sister.',zh:'这是我姐姐，我爱我的姐姐。'},
 {svg:()=>grad('p6','#FFCCBC','#FFAB91')+`<rect width="400" height="280" fill="url(#p6)"/><rect y="170" width="400" height="110" fill="#FF8A65"/><g transform="translate(200,75)"><text y="30" font-size="38" text-anchor="middle">❤️</text></g>`+kid(90,100,.8,'girl')+kid(180,140,.7,'boy')+kid(280,100,.7,'girl')+`<text x="200" y="235" font-size="15" fill="#BF360C" font-weight="bold" text-anchor="middle" font-family="Arial">I love my family!</text>`,en:'I love my family! Do you love your family?',zh:'我爱我的家人！你爱你的家人吗？'}
]},
{id:'b3',title:'I See Colors',zhTitle:'我看见颜色',emoji:'🌈',color:'#9B72FF',pages:[
 {svg:()=>grad('q1','#E8EAF6','#C5CAE9')+`<rect width="400" height="280" fill="url(#q1)"/><rect y="180" width="400" height="100" fill="#7E57C2"/><g transform="translate(200,90)"><rect x="-55" y="-38" width="110" height="76" rx="15" fill="white" stroke="#9B72FF" stroke-width="4"/><rect x="-42" y="-23" width="32" height="46" rx="6" fill="#FF6B6B"/><rect x="-5" y="-23" width="32" height="46" rx="6" fill="#FFD93D"/><rect x="32" y="-23" width="18" height="46" rx="6" fill="#4EC5F1"/></g>`+kid(200,180,.8,'girl')+`<text x="200" y="240" font-size="15" fill="#4527A0" font-weight="bold" text-anchor="middle" font-family="Arial">Red, yellow, blue...</text>`,en:'I see red. I see yellow. I see blue.',zh:'我看见红色，我看见黄色，我看见蓝色。'},

function renderShelf(){curBook=null;const r=Object.keys(Store.d.books||{});$('#app').innerHTML=`<div class="shelf-grid">${BOOKS.map((b,i)=>`<div class="book-cover" onclick="openBook(${i})"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${b.pages[0].svg()}</svg><div class="cover-title">${b.emoji} ${b.title}<br><small style="font-weight:400;font-size:.72rem">${b.zhTitle}</small></div>${r.includes(b.id)?'<div class="read-mark">✅</div>':''}</div>`).join('')}</div><div style="text-align:center;margin-top:16px;color:#5C6273;font-size:.85rem">已读完 <b style="color:#4E9E59">${r.length}</b> / ${BOOKS.length} 本${r.length>=BOOKS.length?'，你是小书虫冠军！🏆':''}</div>`}
function openBook(i){curBook=i;curPage=0;turnDir=1;sfx.pop();renderPage()}
function renderPage(){const b=BOOKS[curBook],p=b.pages[curPage],isL=curPage===b.pages.length-1;prewarmWord(p.en);if(!isL)prewarmWord(b.pages[curPage+1].en);$('#app').innerHTML=`<div style="max-width:560px;margin:0 auto" class="${turnDir>0?'pg-fwd':'pg-back'}"><div class="card" style="border-color:${b.color};padding:16px"><div class="score-bar"><b>${b.emoji} ${b.title} · ${b.zhTitle}</b><span>${curPage+1} / ${b.pages.length}</span></div><div class="illust" style="margin:12px 0"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${p.svg()}</svg></div><div style="text-align:center"><div class="story-en" onclick="speak('${p.en.replace(/'/g,"\\'")}')">${p.en}</div><div class="story-zh">${p.zh}</div><button class="btn ghost" style="margin-top:8px;padding:6px 16px;font-size:.82rem" onclick="readPage()">🎧 听整页</button></div><div class="page-dots">${b.pages.map((_,di)=>`<i class="${di===curPage?'on':di<curPage?'done':''}"></i>`).join('')}</div><div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap">${curPage>0?`<button class="btn ghost big" onclick="turnDir=-1;curPage--;renderPage()">◀ 上一页</button>`:''}${isL?`<button class="btn mint big" onclick="finishBook()">🎉 读完了！</button>`:`<button class="btn grape big" onclick="turnDir=1;nextPage()">下一页 ▶</button>`}<button class="btn ghost" onclick="renderShelf()">📚 书架</button></div></div></div>`}
function readPage(){const p=BOOKS[curBook].pages[curPage];const parts=p.en.split(/(?<=[.!?])\s+/).filter(Boolean);speakChain(parts.map(t=>({text:t.trim(),rate:.9})))}
function nextPage(){turnDir=1;const b=BOOKS[curBook];if(curPage<b.pages.length-1){curPage++;sfx.pop();renderPage()}}
function finishBook(){const b=BOOKS[curBook];const first=!Store.d.books[b.id];if(first){Store.d.books[b.id]={t:Date.now()};markActivity('books');Store.save();addStars(2);confetti();sfx.win();toast('🎉 读完一整本！+2 ⭐');checkBadges()}else{sfx.win();toast('💪 再读一遍，真好！')}$('#app').innerHTML=`<div class="card bounce-in" style="max-width:520px;margin:0 auto;text-align:center;padding:30px 20px"><div class="illust" style="margin:0 auto 14px;max-width:280px"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${b.pages[b.pages.length-1].svg()}</svg></div><h2 style="justify-content:center">${b.title}${first?' 读完啦！':' 又读一遍！'}</h2><p style="color:#5C6273;font-size:.9rem">读完 <b>${Object.keys(Store.d.books).length}</b> / ${BOOKS.length} 本</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn mint big" onclick="openBook(${curBook})">🔄 再读一遍</button><button class="btn grape big" onclick="renderShelf()">📚 换一本</button></div></div>`;curBook=null}
 /* 新增 SVG 工具 */
function rain(x,y,n){return `<g>${Array.from({length:n||5},(_,i)=>`<line x1="${x+i*15}" y1="${y}" x2="${x+i*15-4}" y2="${y+18}" stroke="#4EC5F1" stroke-width="3" stroke-linecap="round"/>`).join('')}</g>`}
function snow(x,y,n){return `<g>${Array.from({length:n||6},(_,i)=>`<circle cx="${x+i*18}" cy="${y+(i%2)*10}" r="4" fill="white"/>`).join('')}</g>`}
function house(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M-50,0 L0,-45 L50,0Z" fill="#E8542F"/><path d="M-45,0 L0,-40 L45,0Z" fill="#FF6B6B"/><rect x="-40" y="0" width="80" height="55" fill="#FFE0B2" stroke="#D4A017" stroke-width="2"/><rect x="-12" y="18" width="24" height="37" fill="#8B5A2B"/><circle cx="8" cy="38" r="2.5" fill="#FFD93D"/><rect x="-35" y="8" width="18" height="15" fill="#87CEEB" stroke="#fff" stroke-width="2"/><rect x="17" y="8" width="18" height="15" fill="#87CEEB" stroke="#fff" stroke-width="2"/><rect x="25" y="-12" width="12" height="14" fill="#B8B8B8"/></g>`}
function seedStage(x,y,stage){if(stage===0)return `<g transform="translate(${x},${y})"><ellipse rx="8" ry="11" fill="#8B5A2B"/><ellipse rx="4" ry="6" fill="#A0522D" cx="2" cy="-2"/></g>`;if(stage===1)return `<g transform="translate(${x},${y})"><ellipse rx="8" ry="11" fill="#8B5A2B" cy="15"/><path d="M0,5 Q-3,-5 0,-15" stroke="#6BCB4F" stroke-width="4" fill="none"/><ellipse cx="-8" cy="-5" rx="7" ry="4" fill="#7BD585"/></g>`;if(stage===2)return `<g transform="translate(${x},${y})"><path d="M0,40 Q-2,20 0,-5" stroke="#5EAD62" stroke-width="5" fill="none"/><ellipse cx="-14" cy="10" rx="12" ry="6" fill="#6BCB4F"/><ellipse cx="14" cy="15" rx="12" ry="6" fill="#6BCB4F"/><circle cy="-8" r="10" fill="#FFD93D"/>${[0,60,120,180,240,300].map(a=>`<ellipse cx="0" cy="-16" rx="5" ry="10" fill="#FF9F45" transform="rotate(${a},0,-8)"/>`).join('')}<circle cy="-8" r="6" fill="#8B4513"/></g>`;return `<g transform="translate(${x},${y})">${tree(x,y,1.5)}</g>`}
function moonIcon(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M0,-20 A20,20 0 1,1 0,20 A15,15 0 1,0 0,-20Z" fill="#FFF3C4"/><circle cx="-5" cy="-5" r="3" fill="#E8DAB2" opacity=".5"/><circle cx="3" cy="8" r="2" fill="#E8DAB2" opacity=".5"/></g>`}
function starIcon(x,y,s){const r=s||10;const d=`M${x},${y-r} L${x+r*.3},${y-r*.3} L${x+r},${y} L${x+r*.3},${y+r*.3} L${x},${y+r} L${x-r*.3},${y+r*.3} L${x-r},${y} L${x-r*.3},${y-r*.3}Z`;return `<path d="${d}" fill="#FFD93D" opacity=".8"/>`}
function bird2(x,y,s,c){return bird(x,y,s,c)}
