/* ================= SVG 绘画系统（AI漫剧方法） =================
   1) 角色设定集：每个角色一套固定参数，全篇不变
   2) 场景模板：同一本书用同一个场景函数（同机位同布局），只换光线和道具
   3) 叙事弧：介绍→起因→尝试→转机→结局，时间光线随剧情推进 */
function grad(id,c1,c2){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs>`}
function eyes(cx,cy,r,col){return `<circle cx="${cx-r*1.6}" cy="${cy}" r="${r}" fill="white"/><circle cx="${cx+r*1.6}" cy="${cy}" r="${r}" fill="white"/><circle cx="${cx-r*1.6}" cy="${cy+1}" r="${r*.7}" fill="${col}"/><circle cx="${cx+r*1.6}" cy="${cy+1}" r="${r*.7}" fill="${col}"/><circle cx="${cx-r*1.3}" cy="${cy-r*.3}" r="${r*.25}" fill="white"/><circle cx="${cx+r*1.9}" cy="${cy-r*.3}" r="${r*.25}" fill="white"/>`}
function blush(cx,cy,w){return `<ellipse cx="${cx}" cy="${cy}" rx="${w}" ry="${w*.55}" fill="#FFB3B3" opacity=".5"/>`}
function smile(cx,cy,w){return `<path d="M${cx-w/2},${cy} Q${cx},${cy+w*.7} ${cx+w/2},${cy}" stroke="#E8542F" stroke-width="3" fill="none" stroke-linecap="round"/>`}
function sadM(cx,cy,w){return `<path d="M${cx-w/2},${cy+3} Q${cx},${cy-w*.4} ${cx+w/2},${cy+3}" stroke="#E8542F" stroke-width="3" fill="none" stroke-linecap="round"/>`}
function sleepEyes(cx,cy,w){return `<path d="M${cx-w},${cy} Q${cx-w/2},${cy-5} ${cx},${cy} M${cx},${cy} Q${cx+w/2},${cy-5} ${cx+w},${cy}" stroke="#2D3142" stroke-width="2.5" fill="none" stroke-linecap="round"/>`}
function zzz(x,y){return `<text x="${x}" y="${y}" font-size="13" fill="#A5D6A7" font-family="Arial">Z z z</text>`}
function skyAt(t){const P={day:['#87CEEB','#E0F6FF','sun'],sunset:['#FFB347','#FFCC80','sunlow'],night:['#1A237E','#0D47A1','moon'],dawn:['#FFCC80','#FFE0B2','sun']}[t]||['#87CEEB','#E0F6FF','sun'];let s=grad('sk',P[0],P[1])+`<rect width="400" height="280" fill="url(#sk)"/>`;
 if(P[2]==='sun')s+=`<g transform="translate(340,42)"><circle r="19" fill="#FFD93D"/><circle r="13" fill="#FFE55C"/><g stroke="#FFD93D" stroke-width="3" stroke-linecap="round"><line y1="-27" y2="-34"/><line y1="27" y2="34"/><line x1="-27" x2="-34"/><line x1="27" x2="34"/><line x1="-19" y1="-19" x2="-25" y2="-25"/><line x1="19" y1="19" x2="25" y2="25"/><line x1="19" y1="-19" x2="25" y2="-25"/><line x1="-19" y1="19" x2="-25" y2="25"/></g></g>`;
 if(P[2]==='sunlow')s+=`<g transform="translate(200,180)"><circle r="26" fill="#FF9F45"/><circle r="19" fill="#FFB26B"/></g><rect y="185" width="400" height="95" fill="rgba(255,159,69,.25)"/>`;
 if(P[2]==='moon'){s+=`<g transform="translate(320,55)"><path d="M0,-20 A20,20 0 1,1 0,20 A14,14 0 1,0 0,-20Z" fill="#FFF3C4"/><circle cx="-4" cy="-4" r="3" fill="#E8DAB2" opacity=".5"/></g>`;s+=`<circle cx="60" cy="40" r="2" fill="#fff"/><circle cx="120" cy="65" r="1.6" fill="#fff"/><circle cx="180" cy="35" r="2" fill="#fff"/><circle cx="60" cy="100" r="1.4" fill="#fff"/><circle cx="240" cy="75" r="1.5" fill="#fff"/>`;}
 return s}
function sun(x,y){const px=x||340,py=y||42;return `<g transform="translate(${px},${py})"><circle r="19" fill="#FFD93D"/><circle r="13" fill="#FFE55C"/><g stroke="#FFD93D" stroke-width="3" stroke-linecap="round"><line y1="-27" y2="-34"/><line y1="27" y2="34"/><line x1="-27" x2="-34"/><line x1="27" x2="34"/><line x1="-19" y1="-19" x2="-25" y2="-25"/><line x1="19" y1="19" x2="25" y2="25"/><line x1="19" y1="-19" x2="25" y2="-25"/><line x1="-19" y1="19" x2="-25" y2="25"/></g></g>`}
function ground(y){return `<rect y="${y}" width="400" height="${280-y}" fill="#6BCB77"/>`}

function parkTree(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><rect x="-6" y="24" width="12" height="40" fill="#8B5A2B" rx="3"/><circle cy="12" r="27" fill="#5EAD62"/><circle cx="-15" cy="18" r="16" fill="#6BCB77"/><circle cx="15" cy="18" r="16" fill="#6BCB77"/><circle cy="2" r="18" fill="#7BD585"/></g>`}
function parkBush(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse rx="26" ry="16" fill="#5EAD62"/><ellipse cx="-14" cy="4" rx="16" ry="11" fill="#6BCB77"/><ellipse cx="14" cy="4" rx="16" ry="11" fill="#6BCB77"/></g>`}

function fruit(x,y,t,s){if(t==='banana')return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M-17,7 Q0,20 17,3 Q13,15 0,17 Q-13,15 -17,7Z" fill="#FFD93D" stroke="#D4A017" stroke-width="2"/></g>`;if(t==='grape')return `<g transform="translate(${x},${y}) scale(${s||1})">${[[-6,-8],[6,-8],[0,-1],[-10,1],[10,1],[-4,6],[4,6],[0,12]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#9B72FF"/>`).join('')}<path d="M0,-15 Q5,-22 9,-19" stroke="#5EAD62" stroke-width="2" fill="none"/></g>`;const c=t==='orange'?['#FF9F45','#FFB26B']:['#FF6B6B','#FF8E8E'];return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M-2,-13 Q0,-20 5,-18" stroke="#8B5A2B" stroke-width="2" fill="none"/><ellipse cx="-4" cy="-12" rx="5" ry="3" fill="#4E9E59" transform="rotate(-30)"/><circle r="14" fill="${c[0]}"/><circle cx="-4" cy="-4" r="8" fill="${c[1]}"/><ellipse cx="-4" cy="-3" rx="3" ry="4" fill="rgba(255,255,255,.35)"/></g>`}
function pondP(){return `<rect y="190" width="400" height="90" fill="#4FC3F7"/><ellipse cx="200" cy="192" rx="210" ry="18" fill="#26C6DA"/><g opacity=".35"><ellipse cx="120" cy="230" rx="30" ry="5" fill="white"/><ellipse cx="290" cy="250" rx="24" ry="4" fill="white"/></g>`}
function roomBase(wall,floor){return `<rect width="400" height="190" fill="${wall}"/><rect y="190" width="400" height="90" fill="${floor}"/><rect y="186" width="400" height="8" fill="rgba(0,0,0,.12)"/><rect x="30" y="30" width="70" height="60" rx="8" fill="#B3E5FC" stroke="rgba(255,255,255,.7)" stroke-width="4"/><rect x="320" y="35" width="45" height="55" rx="6" fill="#FFF3C4" stroke="#E8DAB2" stroke-width="3"/>`}
/* 角色设定集 */
function catC(x,y,s,m){const e=m==='sleep'?sleepEyes(0,-8,11):eyes(0,-8,9,'4A3728');const mo=m==='sleep'?`<circle cy="8" r="4" fill="#E8542F"/>`:m==='wow'?`<circle cy="8" r="6" fill="#E8542F"/>`:smile(0,6,12);const run=m==='run'?'skewX(-6)':'';return `<g transform="translate(${x},${y}) scale(${s||1}) ${run}"><ellipse cy="54" rx="32" ry="6" fill="rgba(0,0,0,.1)"/><path d="M-26,-26 L-33,-48 L-12,-38Z" fill="#FF9F45"/><path d="M26,-26 L33,-48 L12,-38Z" fill="#FF9F45"/><circle r="31" fill="#FF9F45"/><circle r="24" fill="#FFC98B"/>${e}${mo}${blush(-18,2)}${blush(18,2)}<path d="M-3,2 L0,5 L3,2" stroke="#C46A1B" stroke-width="2" fill="none"/><ellipse cx="-9" cy="34" rx="19" ry="13" fill="#FF9F45"/><ellipse cx="13" cy="34" rx="19" ry="13" fill="#FF9F45"/><path d="M25,35 Q38,29 40,19" stroke="#FF9F45" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-19" cy="36" rx="15" ry="17" fill="#FF9F45"/><ellipse cx="19" cy="36" rx="15" ry="17" fill="#FF9F45"/></g>`}
function mouseC(x,y,s,m){const run=m==='run'?'skewX(-10)':'';return `<g transform="translate(${x},${y}) scale(${s||1}) ${run}"><ellipse cy="32" rx="24" ry="5" fill="rgba(0,0,0,.1)"/><circle cx="-24" cy="-10" r="13" fill="#B8B8B8"/><circle cx="-24" cy="-10" r="8" fill="#FFB3B3"/><circle r="24" fill="#CFCFCF"/><circle cy="7" r="17" fill="#E8E8E8"/>${eyes(0,-4,6,'333')}<circle cy="2" r="3" fill="#FF9FAB"/>${m==='run'?'<circle cy="8" r="4" fill="#E8542F"/>':smile(0,5,8)}<ellipse cx="-17" cy="27" rx="13" ry="9" fill="#CFCFCF"/><ellipse cx="17" cy="27" rx="13" ry="9" fill="#CFCFCF"/><path d="M24,16 Q36,10 40,3" stroke="#CFCFCF" stroke-width="5" fill="none" stroke-linecap="round"/></g>`}
function kidC(x,y,s,g,m,shirt){const hc=g==='boy'?'#2D3142':'#8B4513';const sc=shirt||(g==='boy'?'#4EC5F1':'#FF8FAB');const hl=g==='girl'?`<path d="M-22,-20 Q-28,8 -24,26 L-13,22 Q-17,0 -15,-18Z" fill="${hc}"/><path d="M22,-20 Q28,8 24,26 L13,22 Q17,0 15,-18Z" fill="${hc}"/>`:'';const mo=m==='sad'?sadM(0,6,9):smile(0,6,10);return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="50" rx="21" ry="5" fill="rgba(0,0,0,.1)"/><rect x="-16" y="17" width="32" height="27" rx="10" fill="${sc}"/><rect x="-20" y="17" width="8" height="21" rx="4" fill="${sc}"/><rect x="12" y="17" width="8" height="21" rx="4" fill="${sc}"/><rect x="-14" y="42" width="10" height="10" rx="3" fill="#4A6FA5"/><rect x="4" y="42" width="10" height="10" rx="3" fill="#4A6FA5"/><circle r="22" fill="#FFE0BD"/><path d="M-22,-10 Q-18,-27 0,-25 Q18,-27 22,-10 Q18,-18 0,-16 Q-18,-18 -22,-10Z" fill="${hc}"/>${hl}${eyes(0,-4,7,'2D3142')}${mo}${blush(-14,4,6)}${blush(14,4,6)}</g>`}

function frogC(x,y,s,m){const mo=m==='sad'?sadM(0,6,8):smile(0,6,9);return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="35" rx="23" ry="5" fill="rgba(0,0,0,.1)"/><circle cx="-16" cy="-17" r="10" fill="#6BCB4F"/><circle cx="16" cy="-17" r="10" fill="#6BCB4F"/><circle cx="-16" cy="-17" r="5" fill="white"/><circle cx="16" cy="-17" r="5" fill="white"/><circle cx="-16" cy="-16" r="3" fill="#2D3142"/><circle cx="16" cy="-16" r="3" fill="#2D3142"/><ellipse rx="25" ry="21" fill="#6BCB4F"/><ellipse cy="6" rx="15" ry="9" fill="#A8E6A3"/>${mo}${blush(-15,0,5)}${blush(15,0,5)}<ellipse cx="-12" cy="25" rx="10" ry="8" fill="#6BCB4F"/><ellipse cx="12" cy="25" rx="10" ry="8" fill="#6BCB4F"/></g>`}
function dadC(x,y,s,m){return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="62" rx="24" ry="5" fill="rgba(0,0,0,.1)"/><rect x="-20" y="15" width="40" height="48" rx="12" fill="#4EC5F1"/><rect x="-14" y="60" width="11" height="10" rx="3" fill="#37474F"/><rect x="4" y="60" width="11" height="10" rx="3" fill="#37474F"/><circle r="23" fill="#FFE0BD"/><path d="M-23,-9 Q-18,-27 0,-23 Q18,-27 23,-9 Q16,-19 0,-16 Q-16,-19 -23,-9Z" fill="#2D3142"/>${eyes(0,-4,7)}${smile(0,6,11)}${blush(-14,4,6)}${blush(14,4,6)}</g>`}
function momC(x,y,s,m){return `<g transform="translate(${x},${y}) scale(${s||1})"><ellipse cy="58" rx="22" ry="5" fill="rgba(0,0,0,.1)"/><rect x="-18" y="15" width="36" height="44" rx="12" fill="#AB47BC"/><rect x="-13" y="56" width="10" height="9" rx="3" fill="#37474F"/><rect x="4" y="56" width="10" height="9" rx="3" fill="#37474F"/><circle r="22" fill="#FFE0BD"/><path d="M-22,-9 Q-17,-27 0,-23 Q17,-27 22,-9 Q15,-19 0,-16 Q-15,-19 -22,-9Z" fill="#8B4513"/><path d="M-21,-10 Q-28,14 -22,33 L-11,27 Q-15,5 -13,-17Z" fill="#8B4513"/><path d="M21,-10 Q28,14 22,33 L11,27 Q15,5 13,-17Z" fill="#8B4513"/>${eyes(0,-4,7)}${smile(0,6,10)}${blush(-13,4,6)}${blush(13,4,6)}</g>`}
function boyC(x,y,s,m){return kidC(x,y,s,'boy',m,'#42A5F5')}

function renderShelf(){curBook=null;const r=Object.keys(Store.d.books||{});$('#app').innerHTML=`<div class="shelf-grid">${BOOKS.map((b,i)=>`<div class="book-cover" onclick="openBook(${i})"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${b.pages[0].svg()}</svg><div class="cover-title">${b.emoji} ${b.title}<br><small style="font-weight:400;font-size:.72rem">${b.zhTitle}</small></div>${r.includes(b.id)?'<div class="read-mark">✅</div>':''}</div>`).join('')}</div><div style="text-align:center;margin-top:16px;color:#5C6273;font-size:.85rem">已读完 <b style="color:#4E9E59">${r.length}</b> / ${BOOKS.length} 本${r.length>=BOOKS.length?'，你是小书虫冠军！🏆':''}</div>`}
function openBook(i){curBook=i;curPage=0;turnDir=1;sfx.pop();renderPage()}
function renderPage(){const b=BOOKS[curBook],p=b.pages[curPage],isL=curPage===b.pages.length-1;prewarmSentence(p.en);if(!isL)prewarmSentence(b.pages[curPage+1].en);$('#app').innerHTML=`<div style="max-width:560px;margin:0 auto" class="${turnDir>0?'pg-fwd':'pg-back'}"><div class="card" style="border-color:${b.color};padding:16px"><div class="score-bar"><b>${b.emoji} ${b.title} · ${b.zhTitle}</b><span>${curPage+1} / ${b.pages.length}</span></div><div class="illust" style="margin:12px 0"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${p.svg()}</svg></div><div style="text-align:center"><div class="story-en" onclick="speakSentence('${p.en.replace(/'/g,"\\'")}',this)">${p.en}</div><div class="story-zh">${p.zh}</div><button class="btn ghost" style="margin-top:8px;padding:6px 16px;font-size:.82rem" onclick="readPage()">🎧 听整页</button></div><div class="page-dots">${b.pages.map((_,di)=>`<i class="${di===curPage?'on':di<curPage?'done':''}"></i>`).join('')}</div><div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap">${curPage>0?`<button class="btn ghost big" onclick="turnDir=-1;curPage--;renderPage()">◀ 上一页</button>`:''}${isL?`<button class="btn mint big" onclick="finishBook()">🎉 读完了！</button>`:`<button class="btn grape big" onclick="turnDir=1;nextPage()">下一页 ▶</button>`}<button class="btn ghost" onclick="renderShelf()">📚 书架</button></div></div></div>`}
function readPage(){const p=BOOKS[curBook].pages[curPage];speakSentence(p.en,document.querySelector('.story-en'))}
function nextPage(){turnDir=1;const b=BOOKS[curBook];if(curPage<b.pages.length-1){curPage++;sfx.pop();renderPage()}}
function finishBook(){const b=BOOKS[curBook];const first=!Store.d.books[b.id];if(first){Store.d.books[b.id]={t:Date.now()};markActivity('books');Store.save();addStars(2);confetti();sfx.win();toast('读完一整本！+2 ⭐');checkBadges()}else{sfx.win();toast('再读一遍，真好！')}$('#app').innerHTML=`<div class="card bounce-in" style="max-width:520px;margin:0 auto;text-align:center;padding:30px 20px"><div class="illust" style="margin:0 auto 14px;max-width:280px"><svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">${b.pages[b.pages.length-1].svg()}</svg></div><h2 style="justify-content:center">${b.title}${first?' 读完啦！':' 又读一遍！'}</h2><p style="color:#5C6273;font-size:.9rem">读完 <b>${Object.keys(Store.d.books).length}</b> / ${BOOKS.length} 本</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn mint big" onclick="openBook(${curBook})">🔄 再读一遍</button><button class="btn grape big" onclick="renderShelf()">📚 换一本</button></div></div>`;curBook=null}
renderShelf();
</script>
