      <p>从「谁 + 干什么」讲到一般过去时、比较级与 be going to，每关都有口诀、例句和逐题语法解析。</p>
      <ol style="line-height:1.9">

      <li><b>L3 be 动词三兄弟</b> —— 公式：am / is / are</li>
      <li><b>L4 一个句子只有一个动作王</b> —— 公式：谁 + 动作王 + 什么</li>
      <li><b>L5 小小 a 和 an</b> —— 公式：听第一个音：辅音音用 a / 元音音用 an</li>
      <li><b>L6 一个变多个：+s</b> —— 公式：1 个 cat → 2 个 cats</li>
      <li><b>L7 戴帽子、穿鞋子</b> —— 公式：开头大写 + 结尾句号</li>
      <li><b>L8 我喜欢：I like __</b> —— 公式：I like + 单词</li>
      <li><b>L9 这是我的家人：This is my __</b> —— 公式：This is my + 家人</li>
      <li><b>L10 我会做：I can __</b> —— 公式：I can + 动作</li>
      <li><b>L11 它在哪里：on / in / under</b> —— 公式：The __ is on/in/under the __</li>
      <li><b>L12 我有：I have __</b> —— 公式：I have + 数字 + 复数</li>
      <li><b>L13 问一问：Is this __?</b> —— 公式：Is this a/an __?</li>
      <li><b>L14 有什么：There is / There are</b> —— 公式：There is + 一个 / There are + 多个</li>

      <li><b>L16 综合大闯关</b> —— 公式：全部公式</li>

<script>
renderNav('grammar'); renderDecor();

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const ROLES = ['谁 👦', '干什么 🏃', '什么 📦', '什么 📦'];

/* ============================================================
   人工校对的句子解析（2026-11-13.2 / 第二轮复检 N1，P0）
   ------------------------------------------------------------
   ★ 为什么要这张表：语法引擎 gxAnalyze 是给「谁 + 干什么 + 什么」这套
     基础句型写的。L20–L23 新增的过去时 / did 疑问句 / 比较级 / be going to
     超出了它的句型范围：它把 yesterday 兜底成「名词」再当成表语，把 happy
     降成定语；把 played、bigger、Where 全标成名词，甚至把 tomorrow 标成宾语。
     ★ 教语法的东西标错一次，孩子会照着记错 —— 比不标更糟。
   ★ 铁律：这 23 道是**固定句子**，所以逐词人工标注，不靠规则猜。
     L1–L19 的造句题是动态生成的，仍走 gxAnalyze（句型在它设计范围内）。
   ★ 每项 [显示文本, 词性, 成分, 说明?]；成分必须是 PARSE_KEY 里的键。
     允许把介词短语合成一格显示，但拼回去必须与原句逐字相同（门禁校验）。
   ============================================================ */
const MANUAL_PARSE = {
  /* ---- L20 一般过去时 ---- */
  'I was happy yesterday.': {
    note: 'be 动词后面说「怎么样」的部分叫表语（happy）；yesterday 说「什么时候」，是时间状语，不是表语。',
    cells: [['I','代词','主语'],['was','be 动词','谓语'],['happy','形容词','表语'],['yesterday','副词','状语']] },
  'They were at school yesterday.': {
    note: 'were 是 are 的过去式；at school 说「在哪儿」，yesterday 说「什么时候」。',
    cells: [['They','代词','主语'],['were','be 动词','谓语'],['at school','介词短语','表语'],['yesterday','副词','状语']] },
  'I played football yesterday.': {
    note: 'played 是 play 的过去式（动作 +ed）；yesterday 是时间状语。',
    cells: [['I','代词','主语'],['played','动词','谓语'],['football','名词','宾语'],['yesterday','副词','状语']] },
  'She watched TV yesterday.': {
    note: 'watched 以 t 结尾，直接加 -ed；过去式不分人称，不用再加 s。',
    cells: [['She','代词','主语'],['watched','动词','谓语'],['TV','名词','宾语'],['yesterday','副词','状语']] },
  "I wasn't at home yesterday.": {
    note: "wasn't = was not。be 动词的否定直接加 not，不用 didn't。",
    cells: [['I','代词','主语'],["wasn't",'be 动词（否定）','谓语'],['at home','介词短语','表语'],['yesterday','副词','状语']] },
  'Were you at school yesterday?': {
    note: '疑问句把 be 动词搬到句子最前面。',
    cells: [['Were','be 动词','谓语'],['you','代词','主语'],['at school','介词短语','表语'],['yesterday','副词','状语']] },

  /* ---- L21 did 疑问句 ---- */
  'Where did you go yesterday?': {
    note: 'Where 问「去哪儿」，是状语；did 后面动词必须用原形 go。',
    cells: [['Where','疑问词','状语'],['did','助动词','助动词'],['you','代词','主语'],['go','动词','谓语'],['yesterday','副词','状语']] },
  'What did you see?': {
    note: 'What 是 see 的宾语；did 已经表示过去，see 用原形。',
    cells: [['What','疑问词','宾语'],['did','助动词','助动词'],['you','代词','主语'],['see','动词','谓语']] },
  'Did you go to the zoo?': {
    note: 'Did 开头的是一般疑问句，to the zoo 说「去哪儿」。',
    cells: [['Did','助动词','助动词'],['you','代词','主语'],['go','动词','谓语'],['to the zoo','介词短语','状语']] },
  'When did you get up?': {
    note: 'When 问「什么时候」；get up 是一个动词短语，不当两个词拆。',
    cells: [['When','疑问词','状语'],['did','助动词','助动词'],['you','代词','主语'],['get up','动词短语','谓语']] },
  'I went to Beijing last year.': {
    note: 'went 是 go 的过去式，不按规则加 -ed；陈述句不用 did。',
    cells: [['I','代词','主语'],['went','动词','谓语'],['to Beijing','介词短语','状语'],['last year','副词','状语']] },
  'What did you do last weekend?': {
    note: '这句两个 do 不一样：前面 did 是助动词，后面 do 是实义动词「做」。',
    cells: [['What','疑问词','宾语'],['did','助动词','助动词'],['you','代词','主语'],['do','动词','谓语'],['last weekend','副词','状语']] },

  /* ---- L22 比较级 / 最高级 ---- */
  'I am taller than you.': {
    note: 'taller 是形容词比较级，作表语；than you 说「跟谁比」。',
    cells: [['I','代词','主语'],['am','be 动词','谓语'],['taller','形容词','表语'],['than you','比较结构','状语']] },
  'He is the tallest in our class.': {
    note: '三者以上比第一名用 the + 最高级；in our class 说范围。',
    cells: [['He','代词','主语'],['is','be 动词','谓语'],['the tallest','形容词','表语'],['in our class','介词短语','状语']] },
  'This elephant is bigger than that one.': {
    note: 'big 是「辅音 + 元音 + 辅音」结尾，双写 g 再加 -er；that one 代替「那头大象」，避免重复。',
    cells: [['This elephant','名词短语','主语'],['is','be 动词','谓语'],['bigger','形容词','表语'],['than that one','比较结构','状语']] },
  'This book is more expensive than that one.': {
    note: '长形容词的比较级前面加 more，不加 -er。',
    cells: [['This book','名词短语','主语'],['is','be 动词','谓语'],['more expensive','形容词','表语'],['than that one','比较结构','状语']] },
  'It is hotter today than yesterday.': {
    note: 'hot 双写 t 加 -er；today 和 than yesterday 都在说时间，是状语。',
    cells: [['It','代词','主语'],['is','be 动词','谓语'],['hotter','形容词','表语'],['today','副词','状语'],['than yesterday','比较结构','状语']] },
  'She is the tallest of the three.': {
    note: 'of the three 说「三个人里面」。',
    cells: [['She','代词','主语'],['is','be 动词','谓语'],['the tallest','形容词','表语'],['of the three','介词短语','状语']] },

  /* ---- L23 be going to ---- */
  'I am going to swim tomorrow.': {
    note: 'be going to 说「打算做」，后面动词用原形；tomorrow 是时间状语。',
    cells: [['I','代词','主语'],['am going to','将来时结构','助动词'],['swim','动词','谓语'],['tomorrow','副词','状语']] },
  'She is going to buy a book.': {
    note: 'be 动词跟着主语走：she 用 is。',
    cells: [['She','代词','主语'],['is going to','将来时结构','助动词'],['buy','动词','谓语'],['a book','名词短语','宾语']] },
  'We are going to go to the park.': {
    note: '两个 go 不重复：going to 是结构，后面的 go 才是「去」。',
    cells: [['We','代词','主语'],['are going to','将来时结构','助动词'],['go','动词','谓语'],['to the park','介词短语','状语']] },
  "He isn't going to play football.": {
    note: "isn't = is not，否定加在 be 动词后面。",
    cells: [['He','代词','主语'],["isn't going to",'将来时结构（否定）','助动词'],['play','动词','谓语'],['football','名词','宾语']] },
  'Are you going to visit your grandma?': {
    note: '疑问句把 be 动词提到句首；your 是物主代词，修饰 grandma。',
    cells: [['Are','be 动词','助动词'],['you','代词','主语'],['going to','将来时结构','助动词'],['visit','动词','谓语'],['your grandma','名词短语','宾语']] },

  /* ---- 旧关卡里同类误标，一并人工校对 ---- */
  'The cat is on the bed.': {
    note: 'on the bed 说「在哪儿」；the 是冠词，只修饰 bed，不是状语。',
    cells: [['The cat','名词短语','主语'],['is','be 动词','谓语'],['on the bed','介词短语','表语']] },
  'There is a book on the desk.': {
    note: 'There be 句型里，be 后面的名词才是真正的主语。',
    cells: [['There','引导词','引导词'],['is','be 动词','谓语'],['a book','名词短语','主语'],['on the desk','介词短语','状语']] },
  'There are two pencils in the bag.': {
    note: 'two 是数词，修饰 pencils。',
    cells: [['There','引导词','引导词'],['are','be 动词','谓语'],['two pencils','名词短语','主语'],['in the bag','介词短语','状语']] },
  'He watches TV every day.': {
    note: 'every day 说「多久一次」，是时间状语，不是宾语。',
    cells: [['He','代词','主语'],['watches','动词','谓语'],['TV','名词','宾语'],['every day','名词短语','状语']] },
  'Yes, she is.': {
    note: '简略回答：Yes 表示肯定，she 是主语，is 是 be 动词。',
    cells: [['Yes','副词','状语'],['she','代词','主语'],['is','be 动词','谓语']] },
};

/* ---------------- 句子语法解析面板 ----------------
   每道题答完都要给解析：每个词标词性 + 句子成分（主语/谓语/宾语/表语…）。
   解析由 gxAnalyze 统一产出，认不出的句子只显示词性、不瞎标成分。 */
const PARSE_KEY = { '主语':'subj','谓语':'pred','宾语':'obj','表语':'comp','状语':'adv',
  '定语':'attr','助动词':'aux','引导词':'lead','否定词':'neg' };
function parseHTML(sentence, it) {
  /* 人工校对的固定句优先：引擎认不出的新句型不许瞎标成分。 */
  const m = MANUAL_PARSE[String(sentence || '').trim()];
  if (m) {
    const cells = m.cells.map(c => {
      const k = PARSE_KEY[c[2]] || 'none';
      return `<div class="pcell r-${k}"><b lang="en">${esc(c[0])}</b>${c[2] ? `<span>${c[2]}</span>` : ''}<small>${c[1]}</small></div>`;
    }).join('');
    return `<div class="parse">
      <div class="parse-h">🧩 句子解析<span class="pf">人工校对</span></div>
      <div class="parse-row">${cells}</div>
      ${m.note ? `<div class="parse-note">💡 ${esc(m.note)}</div>` : ''}
    </div>`;
  }
  const a = gxAnalyze(sentence);
  if (!a.tokens.length) return '';
  const cells = a.tokens.map(t => {
    const k = PARSE_KEY[t.role] || 'none';
    return `<div class="pcell r-${k}"><b lang="en">${esc(t.display)}</b>${t.role ? `<span>${t.role}</span>` : ''}<small>${t.pos}</small></div>`;
  }).join('');
  return `<div class="parse">
    <div class="parse-h">🧩 句子解析${a.formula ? `<span class="pf">${a.formula}</span>` : ''}</div>
    <div class="parse-row">${cells}</div>
    ${a.tokens.some(t => t.expanded) ? `<div class="parse-note">✂️ 缩写拆开看：isn't = is not，aren't = are not，don't = do not，doesn't = does not，can't = can not</div>` : ''}
    ${a.note ? `<div class="parse-note">💡 ${a.note}</div>` : ''}
  </div>`;
}

    if (new Set(options).size !== 3) return null;
    return { type:'choice', word: right.w,
      prompt: `下面哪个是 <b>${target}</b>？`,
      options, answer: options.indexOf(right.w), say: right.w,
      zh: `${right.w} 是${target}。`,
      explain: `${right.w}（${right.zh}）是${target}；${decoys[0].w}（${decoys[0].zh}）不是，${decoys[1].w}（${decoys[1].zh}）也不是。` };
  },

  /* ---- 第三人称单数（L18） ---- */
  thirdPerson() {
    const v = pick(Object.keys(GX_INTRANS_ZH).filter(x => GX_THIRD[x]));
    const s = pick(['he', 'she', 'it']);
    const it = gxThirdItem(v, GX_INTRANS_ZH[v], s);
    if (!it) return null;
    it.word = v;
    return it;
  },
  thirdFind() {
    const v = pick(Object.keys(GX_INTRANS_ZH).filter(x => GX_THIRD[x]));
    const s = pick(['he', 'she', 'it']);
    const S = GX_SUBJ[s];
    const right = `${S.en} ${GX_THIRD[v]}.`;
    const w1 = `${S.en} ${v}.`;
    const w2 = `${S.en} ${v}ing.`;
    const options = shuffle([right, w1, w2]);
    return { type:'choice', word: v,
      prompt: `「${S.zh}${GX_INTRANS_ZH[v]}」——下面哪句对？`,
      options, answer: options.indexOf(right), say: right,
      zh: `${right} ${S.zh}${GX_INTRANS_ZH[v]}。`,
      explain: `${S.en} 是第三人称单数，动词要变形：${v} → ${GX_THIRD[v]}。` };
  },

  /* ---- 句型转换（L19，也撒进 L10 / L13 / L16） ---- */
  transformNeg(ws) {
    const v = pick(['like', 'have', 'see', 'want', 'eat']);
    const o = gxPickObject(ws, v === 'eat' ? ['fruit', 'food'] : null); if (!o) return null;
    const s = pick(['i', 'he', 'she', 'it', 'they']);
    const spec = { s, v, o };
    const S = GX_SUBJ[s], third = S.person === 'third';
    const right = gxNegative(spec);
    /* 2026-11-13.5：原来三单判断写反（三单用 don't、非三单用 doesn't），
       且 w2 对非三单会与 right 完全相同，被下面的去重整题丢弃（近 40% 空转）。
       现在两个干扰项分别是「助动词对但动词误加 -s」和「助动词错但动词原形」。 */
    const thirdForm = GX_THIRD[v] || (v + 's');
    const w1 = `${S.en} ${third ? "doesn't" : "don't"} ${thirdForm} ${o.en}.`;
    const w2 = `${S.en} ${third ? "don't" : "doesn't"} ${v} ${o.en}.`;
    const options = shuffle([right, w1, w2]);
    if (new Set(options).size !== 3) return null;
    return { type:'choice', word: (typeof o.w === 'string' ? o.w : ((o.w && o.w.w) || '')),
      prompt: `「${gxStatement(spec)}」的否定句是哪一句？`,
      options, answer: options.indexOf(right), say: right,
      zh: `${right} ${S.zh}${GX_VOBJ_NEG[v]}${o.zh}。`,
      explain: third ? `主语是第三人称单数，否定用 doesn't，后面动词回原形 ${v}。` : `主语不是第三人称单数，否定用 don't + 动词原形 ${v}。` };
  },
  transformQ(ws) {
    const v = pick(['like', 'have', 'see', 'want', 'eat']);
    const o = gxPickObject(ws, v === 'eat' ? ['fruit', 'food'] : null); if (!o) return null;
    const s = pick(['he', 'she', 'it']);   // 只做三单，答案唯一不歧义
    const spec = { s, v, o };
    const S = GX_SUBJ[s];
    const right = gxQuestion(spec);
    const w1 = `${S.en} ${GX_THIRD[v]} ${o.en}?`;
    const w2 = `${S.qaux} ${GX_Q_SUBJ[s]} ${GX_THIRD[v]} ${o.en}?`;
    const options = shuffle([right, w1, w2]);
    if (new Set(options).size !== 3) return null;
    return { type:'choice', word: (typeof o.w === 'string' ? o.w : ((o.w && o.w.w) || '')),
      prompt: `「${gxStatement(spec)}」的疑问句是哪一句？`,
      options, answer: options.indexOf(right), say: right,
      zh: `${right} ${S.zh}${GX_VOBJ_ZH[v]}${o.zh}吗？`,
      explain: `疑问句要把助动词 Does 搬到最前面，后面动词回原形 ${v}。` };
  },
  beTransform(ws) {
    const adjs = ws.filter(w => gxPos(w.w).pos === '形容词');
    const pool = adjs.length >= 2 ? adjs : [{ w: 'happy', zh: '开心' }, { w: 'tired', zh: '累' }, { w: 'hungry', zh: '饿' }];
    const a = pick(pool);
    const s = pick(['he', 'she', 'it', 'they']);
    const S = GX_SUBJ[s], pred = { en: a.w, zh: a.zh };
    const askNeg = Math.random() < 0.5;
    const right = askNeg ? gxBeNegative({ s, pred }) : gxBeQuestion({ s, pred });
    const w1 = askNeg ? `${S.en} ${S.aux} ${a.w}.` : `${S.en} ${S.be} ${a.w}?`;
    const w2 = askNeg ? `${S.en} not ${S.be} ${a.w}.` : `${S.qaux} ${GX_Q_SUBJ[s]} ${S.be} ${a.w}?`;
    const options = shuffle([right, w1, w2]);
    if (new Set(options).size !== 3) return null;
    return { type:'choice', word: a.w,
      prompt: `「${gxBeStatement({ s, pred })}」的${askNeg ? '否定句' : '疑问句'}是哪一句？`,
      options, answer: options.indexOf(right), say: right,
      zh: `${right} ${S.zh}${askNeg ? '不' : ''}${a.zh}${askNeg ? '。' : '吗？'}`,
      explain: askNeg ? `be 动词的否定：直接在 ${S.be} 后面加 not（${S.be}n't）。` : `be 动词的疑问：把 ${S.be} 搬到句子最前面。` };
  },
  canTransform() {
    const v = pick(Object.keys(GX_INTRANS_ZH));
    const s = pick(['i', 'he', 'she', 'you', 'they']);
    const S = GX_SUBJ[s];
    const askNeg = Math.random() < 0.5;
    /* 疑问句不换主语：原实现把 I 换成 you，题面「I can cook.」的答案变成
       Can you cook?，孩子按「把 can 提到句首」写 Can I cook? 反被判错。
       L13 / L19 的同类题都不换主语，这里统一。 */
    /* 主语搬到 Can 后面要小写（I 除外）："Can He sings?" 是错的。 */
    const qs = s === 'i' ? 'I' : S.en.toLowerCase();
    const right = askNeg ? gxCanNegative({ s, v }) : `Can ${qs} ${v}?`;
    const w1 = askNeg ? `${S.en} ${S.aux} can ${v}.` : `${S.en} can ${v}.`;
    /* 干扰项用真实易错点：can 后面误加三单 s（Can he cooks?）。
       不能再用「换主语」那句——主语不换之后它会和正解一模一样。 */
    const w2 = askNeg ? `${S.en} can't ${GX_THIRD[v]}.` : `Can ${qs} ${GX_THIRD[v]}?`;
    const options = shuffle([right, w1, w2]);
    if (new Set(options).size !== 3) return null;
    return { type:'choice', word: v,
      prompt: `「${gxCanStatement({ s, v })}」的${askNeg ? '否定句' : '疑问句'}是哪一句？`,
      options, answer: options.indexOf(right), say: right,
      /* 疑问句里 gxCanQuestion 会把 I 改成 you，中文主语也得跟着换，
         否则出现「Can you speak? 我会说话吗？」这种主谓不一致。 */
      zh: `${right} ${askNeg ? S.zh + '不会' : S.zh + '会'}${GX_INTRANS_ZH[v]}${askNeg ? '。' : '吗？'}`,
      explain: askNeg ? "can 的否定直接在 can 后面加 not（can't）。" : 'can 的疑问把 Can 搬到句子最前面。' };
  },
};

function themeWordZh(w) { for (const t of THEMES) for (const x of t.words) if (x.w === w) return x.zh; return w; }

/* 开课时组装题目：静态题 + 单词镇生成题 */
function buildLevelItems(lv) {
  let items = lv.items.slice();
  if (lv.gen) {
    const ws = themeWords(lv.gen.themes);
    if (ws.length >= 4) {
      const made = [];
      let guard = 0;
      // 单题生成做容错：某个生成器遇到空池/异常时只跳过该题，绝不让整关白屏
      while (made.length < lv.gen.n && guard++ < 40) {
        const kind = pick(lv.gen.kinds);
        let it = null;
        try { it = GEN[kind](ws, lv); } catch (e) { it = null; }
        if (it && it.prompt && !made.some(m => m.prompt === it.prompt)) made.push(it);
      }
      // 生成题穿插在静态题之间
      made.forEach((m, i) => items.splice(Math.min(items.length, 1 + i * 2), 0, Object.assign({ generated: true, fromTheme: themeEmoji(lv.gen.themes) }, m)));
    }
  }
  return items;
}

/* ---------------- 关卡地图（按阶段分组） ---------------- */
function renderLevels() {
  view = 'levels';
  Flow.reset();          // 离开关卡：作废所有挂起的推进与朗读
  const done = i => !!Store.d.grammar[GRAMMAR_LEVELS[i].id];
  const unlocked = i => i === 0 || done(i - 1);

  $('#app').innerHTML = `
    <div class="card" style="margin-bottom:20px;border-color:var(--grape)">
      <h2>🚂 先认识一下「句子小火车」</h2>
      <div class="train-demo">
        <div class="t-part head">🚂<div>谁<small>车头</small></div></div>
        <span class="t-plus">+</span>
        <div class="t-part mid">🏃<div>干什么<small>车轮</small></div></div>
        <span class="t-plus">+</span>
        <div class="t-part tail">📦<div>什么<small>货物</small></div></div>
        <span class="t-plus">=</span>
        <div class="t-part" style="background:var(--lemon);color:var(--ink)">I like cats.<small>完整句子！</small></div>
      </div>
      <p style="margin:6px 0 0;color:#5C6273;font-size:.88rem;line-height:1.8">
        英语句子有<b>万能公式</b>——记住「谁 + 干什么 + 什么」，记住「一句话只有一个动作王（动词）」，大部分句子都能自己造出来！
        第二阶段开始，造句题会用<b>单词镇里学过的单词</b>自动生成 🏘️；第三阶段最后 4 关是课本同步句型，例句固定
      </p>
    </div>

    ${GRAMMAR_STAGES.map(st => {
      const lvs = GRAMMAR_LEVELS.map((lv, i) => ({ lv, i })).filter(x => x.lv.stage === st.id);
      return `
      <div class="section">
        <h2 style="margin:0 0 12px;font-size:1.2rem">${st.emoji} ${st.name}
          <small style="font-weight:400;color:#5C6273;font-size:.8rem">${st.tip}</small></h2>
        <div class="level-grid">
          ${lvs.map(({ lv, i }) => {
            const st2 = Store.d.grammar[lv.id];
            return `<div class="level-card ${st2 ? 'done' : ''} ${unlocked(i) ? '' : 'locked'}" onclick="${unlocked(i) ? `startLevel(${i})` : `lockTip(${i})`}">
              <span class="stars3">${st2 ? '⭐'.repeat(Math.min(st2.stars, 7)) : unlocked(i) ? '' : '🔒'}</span>
              <div class="le">${lv.emoji}</div>
              <b>第 ${i + 1} 关 · ${lv.title}</b>
              <span class="formula">${lv.formula}</span>
              ${lv.gen ? '<div style="margin-top:4px;font-size:.68rem;color:#2F7D3B">🏘️ 用单词镇的词造句</div>' : ''}
              ${st2 ? '<div style="margin-top:6px;font-size:.72rem;color:#4E9E59">✅ 已通过 · 点击重玩</div>' : ''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}`;
}

function lockTip() { toast('🔒 先通过上一关，才能开这一关哦！'); }

/* ---------------- 进入关卡 ---------------- */
function startLevel(i) {
  curLevel = i;
  sess = { idx: 0, score: 0, firstTry: true, sels: null, items: buildLevelItems(GRAMMAR_LEVELS[i]) };
  view = 'level'; renderItem();
}

function renderItem() {
  const lv = GRAMMAR_LEVELS[curLevel];
  if (sess.idx >= sess.items.length) return renderLevelEnd();
  const it = sess.items[sess.idx];
  /* 进入新题：作废上一题所有挂起的推进/朗读，重置本题状态 */
  Flow.reset();
  stopAllSpeech();          // 上一题的句子还没念完也停掉：一次只出一个声音
  sess.firstTry = true;
  sess.answered = false;   // 本题是否已结题（答对 或 错满两次看答案）
  sess.tries = 0;          // 错了几次：第 2 次给答案，不让孩子卡死

  const head = `
    <div class="card" style="max-width:720px;margin:0 auto">
      <div class="score-bar">
        <b>${lv.emoji} 第 ${curLevel + 1} 关 · ${lv.title}</b>
        <span>第 ${sess.idx + 1} / ${sess.items.length} 题 · ✅ ${sess.score}</span>
      </div>
      <div style="text-align:right;margin:-2px 0 8px"><button class="btn ghost" style="padding:4px 14px;font-size:.75rem" onclick="renderLevels()">← 退出关卡</button></div>
      ${sess.idx === 0 ? `
      <p style="font-size:.9rem;line-height:1.9;color:#5C6273;margin:6px 0">${lv.intro}</p>
      <div class="chant">
        <small>🎵 本关口诀（跟着屏幕读两遍）</small>
        ${lv.chant}
      </div>` : ''}`;

  let body = '';
  if (it.type === 'choice') {
    body = `
      ${it.generated ? `<div style="font-size:.72rem;color:#2F7D3B;font-weight:700;margin-bottom:4px">🏘️ 单词镇出题${it.fromTheme ? ' · ' + it.fromTheme : ''}</div>` : ''}
      <div class="quiz-q" style="font-size:1.05rem;line-height:1.8">${it.prompt}</div>
      <div class="opt-row${it.options.some(o => String(o).length > 14) ? ' long-row' : ''}">
        ${shuffle(it.options.map((o, j) => ({ o, j }))).map(x => `<button class="opt" data-j="${x.j}" style="font-size:${String(x.o).length > 24 ? '.85rem' : '1rem'}" onclick="chooseAns(this,${x.j},${it.options.length})">${esc(x.o)}</button>`).join('')}
      </div>
      <div class="explain" id="iexp"></div>`;
  } else { // build 造句
    sess.sels = Array(it.slots.length).fill(null);
    const bank = shuffle([...new Set(it.slots.flat())]);
    body = `
      ${it.generated ? `<div style="font-size:.72rem;color:#2F7D3B;font-weight:700;margin-bottom:4px">🏘️ 单词镇出题${it.fromTheme ? ' · ' + it.fromTheme : ''}</div>` : ''}
      <div class="quiz-q" style="font-size:1.05rem;line-height:1.8">${it.prompt}</div>
      ${it.hint ? `<div class="explain" style="margin:0 0 10px">💡 ${it.hint}</div>` : ''}
      <div class="build-slots" id="slots">
        ${it.slots.map((s, i2) => `<button class="slot" data-i="${i2}" onclick="clearSlot(${i2})"><span class="role">${ROLES[i2]}</span><span id="slotv${i2}" style="min-height:24px;display:block">？</span></button>`).join('')}
        <button class="btn mint" id="checkBtn" onclick="checkBuild()" disabled>✅ 检查</button>
      </div>
      <div class="slot-bank">
        ${bank.map(w => `<button class="bank-chip" data-w="${esc(w)}" onclick="placeChip(this,'${String(w).replace(/'/g, "\\'")}')">${esc(w)}</button>`).join('')}
      </div>
      <div class="train-result" id="trainResult">🚂 - - -</div>
      <div class="explain" id="iexp"></div>`;
  }
  $('#app').innerHTML = head + body + '</div>';
}

/* --- 造句交互 --- */
function placeChip(btn, w) {
  const it = sess.items[sess.idx];
  const i = sess.sels.indexOf(null);
  if (i < 0) return;
  sess.sels[i] = w;
  btn.classList.add('used');
  sfx.pop();
  $('#slotv' + i).textContent = w;
  $('#slots').children[i].classList.add('filled');
  if (!sess.sels.includes(null)) $('#checkBtn').disabled = false;
  updateTrainPreview();
}
function clearSlot(i) {
  const w = sess.sels[i]; if (!w) return;
  sess.sels[i] = null;
  $('#slotv' + i).textContent = '？';
  $('#slots').children[i].classList.remove('filled');
  const chip = $(`.bank-chip[data-w="${w}"]`); if (chip) chip.classList.remove('used');
  $('#checkBtn').disabled = true;
  updateTrainPreview();
}
function updateTrainPreview() {
  $('#trainResult').innerHTML = '🚂 ' + sess.sels.map(s => s || '＿＿').join(' ');
}
function checkBuild() {
  const it = sess.items[sess.idx];
  if (sess.answered) return;              // 已结题：台子锁住，不再响应
  const ok = sess.sels.join(' ') === it.answer.join(' ');
  const slots = $('#slots');
  if (ok) {
    if (sess.firstTry) { sess.score++; addStars(1); }
    sess.answered = true;
    sfx.correct(); confetti();
    lockBuild();
    if (it.word) touchWord(it.word, true); // 造句用到的单词也进入复习计划
    $('#trainResult').innerHTML = `🚂 ${it.read} <span class="ok-mark">✔</span>`;
    $('#iexp').innerHTML = `✅ <b>${esc(it.read)}</b> ${it.zh}<br>🔎 ${it.answer.join(' + ')} —— 公式用对啦！` + parseHTML(it.read, it);
    Flow.after(600, () => speakSentence(it.read));   // 等答对音效播完再朗读句子
    showNext(it.read);
  } else {
    sess.firstTry = false; sess.tries++; sfx.wrong();
    slots.classList.add('bad'); Flow.after(500, () => slots.classList.remove('bad'));
    if (sess.tries >= 2) return revealBuild(it);
    $('#iexp').innerHTML = `🤔 火车车厢装反啦，点车厢可以把词放回去，再试试！`;
  }
}

/* 错满两次：给正确摆法。不是为了放水，是别让孩子靠瞎猜过关 */
function revealBuild(it) {
  sess.answered = true;
  lockBuild();
  $('#trainResult').innerHTML = `🚂 ${it.read}`;
  $('#iexp').innerHTML = `💡 正确摆法：<b>${esc(it.read)}</b> ${it.zh}<br>🔎 ${it.answer.join(' + ')}` + parseHTML(it.read, it);
  Flow.after(500, () => speakSentence(it.read));
  showNext(it.read);
}

/* 造句台锁定：答对后再点词块/检查都不改变结果 */
function lockBuild() {
  $('#slots').classList.add('done');
  const bank = $('.slot-bank'); if (bank) bank.classList.add('locked');
}

/* 结题之后：不自动跳，给一个按钮。
   句子工厂每题都有解析要读，1.7 秒自动跳等于没给读的时间 —— 这里永远 autoMs = 0。 */
function showNext(say) {
  const box = $('#iexp');
  if (!box || String(box.innerHTML || '').indexOf('id="nextBtn"') >= 0) return;  // 一题只有一个出口
  const last = sess.idx >= sess.items.length - 1;
  /* 句子不拼进 onclick：英文里有撇号（He doesn't…），拼进去会把属性打断（绘本页踩过的坑） */
  __itemSay = say || '';
  __itemGo = Flow.make(() => { sess.idx++; renderItem(); }, 0);
  const replay = __itemSay
    ? `<button class="btn ghost big" onclick="__sayAgain()">🔊 再听</button>` : '';
  box.insertAdjacentHTML('beforeend',
    `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px">
       <button class="btn grape big" id="nextBtn" onclick="__itemGo()">${last ? '看结果 🏁' : '下一个 ▶'}</button>${replay}
     </div>`);
  /* 手机小屏时解析可能把按钮顶到屏幕外：滚到看得见为止（已经可见就不动） */
  if (box.scrollIntoView) { try { box.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
}
function __sayAgain() { if (__itemSay) speakSentence(__itemSay); }

/* --- 选择题交互（选项已打乱，回传原始下标） --- */
function chooseAns(btn, j, total) {
  const it = sess.items[sess.idx];
  if (sess.answered) return;              // 答对后锁住：以前不锁会把解析冲掉、甚至再计一次分
  const ok = j === it.answer;
  feedback(btn, ok);
  if (ok) {
    if (sess.firstTry) { sess.score++; addStars(1); flyStar(btn); }
    sess.answered = true;
    sfx.correct();
    lockChoices(btn);
    if (it.word) touchWord(it.word, true);
    $('#iexp').innerHTML = `✅ ${it.zh}<br>🔎 ${it.explain || ''}` + parseHTML(englishOf(it), it);
    Flow.after(550, () => speakSentence(englishOf(it)));  // 等音效播完再读句
    showNext(englishOf(it));
  } else {
    sess.firstTry = false; sess.tries++; sfx.wrong();
    if (sess.tries >= 2) return revealChoice(it);
    $('#iexp').innerHTML = `🤔 再想想～套一套公式`;
  }
}

/* 错满两次：点亮正确项 + 给解析，然后走同一个出口 */
function revealChoice(it) {
  sess.answered = true;
  const right = it.options[it.answer];
  const keep = document.querySelector('.opt[data-j="' + it.answer + '"]');
  lockChoices(keep);
  $('#iexp').innerHTML = `💡 正确答案：<b>${esc(right)}</b><br>🔎 ${it.explain || ''}` + parseHTML(englishOf(it), it);
  Flow.after(500, () => speakSentence(englishOf(it)));
  showNext(englishOf(it));
}

/* 选项锁定用 app.js 里的共享版本（与单词页、游戏页同一套规则） */

/* ---------------- 关卡结束 ---------------- */
function renderLevelEnd() {
  const lv = GRAMMAR_LEVELS[curLevel];
  Flow.reset();          // 收尾：作废本题所有挂起动作
  const total = sess.items.length;
  const perfect = sess.score === total;
  if (perfect) { addStars(2); confetti(); }
  const first = !Store.d.grammar[lv.id];
  grammarLevelDone(lv.id, sess.score);
  sfx.win();
  const nextIdx = curLevel + 1;
  const hasNext = nextIdx < GRAMMAR_LEVELS.length;

  $('#app').innerHTML = `
    <div class="card bounce-in" style="max-width:600px;margin:0 auto;text-align:center;padding:34px 24px">
      <div style="font-size:70px">${perfect ? '🏆' : '🌟'}</div>
      <h2 style="justify-content:center">${perfect ? '全对！句子小工程师！' : '关卡通过！'}</h2>
      <p style="font-size:1.1rem">答对 <b style="color:var(--grape);font-size:1.6rem">${sess.score}</b> / ${total} 题${perfect ? ' · 奖励 +2 ⭐' : ''}</p>
      <div style="font-size:.85rem;color:#5C6273;margin-top:6px">口诀带回家：<b>${lv.formula}</b></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px">
        ${hasNext ? `<button class="btn grape big" onclick="startLevel(${nextIdx})">下一关 ▶</button>` : `<button class="btn grape big" onclick="renderLevels()">🏆 全部通关！回关卡地图</button>`}
        <button class="btn ghost big" onclick="renderLevels()">关卡地图</button>
      </div>
    </div>`;
}

renderLevels();
</script>
</body>
</html>
