<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4EC5F1">
<meta name="description" content="小鸟英语乐园学习主页：继续上次的学习、今日任务，以及单词镇、自然拼读、字母岛、读书馆、课本同步与句子工厂。">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta property="og:type" content="website">

<meta property="og:title" content="学习 · 小鸟英语乐园">
<meta property="og:image" content="https://heijialun19.github.io/yingyu/og-cover.png">
<meta property="og:url" content="https://heijialun19.github.io/yingyu/learn.html">

<link rel="stylesheet" href="css/style.css?v=57" onerror="this.onerror=null;this.href='css/style.css?v=57&amp;retry=1'">
<style>
/* ============================================================
   学习主页（2026-11-22.2）
   原来的 index.html 把「继续学习 / 今日任务 / Get Smart / 9 个岛 /
   18 个音素」全铺在一起，和底部导航几乎一一重复，孩子进来先选一遍入口。
   现在这一页 = 顶部一个继续学习（唯一主操作）+ 今日三任务 + 课程地图。
   ============================================================ */
.ln-hero{display:flex;align-items:center;gap:12px;margin:4px 0 14px;padding:0 2px}
.ln-avatar{flex:none;width:54px;height:54px;border-radius:18px;border:1px solid #E4EBF5;
  background:linear-gradient(160deg,#EFF7FF,#F7F4FF);display:flex;align-items:center;
  justify-content:center;font-size:30px;cursor:pointer;font-family:inherit}
.ln-who{flex:1;min-width:0}
/* ⚠️ 必须用直接子选择器：表情会被替换成 <span class="emj-img">，
   写成 `.ln-who span` 会把 emoji 也变成 block，整行被拆成竖排。 */
.ln-who > b{display:block;font-size:1.05rem;line-height:1.3}
.ln-who > span{display:block;font-size:.76rem;color:#6B7385;margin-top:2px}
.ln-who a{color:#5B3FD6;font-weight:700}

/* 继续学习：整页唯一的主按钮 */
.ln-next{display:flex;align-items:center;gap:14px;padding:20px 18px;border-radius:22px;
  background:linear-gradient(135deg,#5B3FD6,#7C5CFF);color:#fff;border:none;
  box-shadow:0 8px 22px rgba(91,63,214,.20);cursor:pointer;font:inherit;
  text-align:left;width:100%;transition:transform .15s}
.ln-next:active{transform:scale(.99)}
.ln-next .ne{flex:none;font-size:44px;line-height:1}
.ln-next .nb{flex:1;min-width:0}
.ln-next .nb b{display:block;font-size:1.12rem;letter-spacing:.2px}
.ln-next .nb span{display:block;font-size:.76rem;color:rgba(255,255,255,.86);margin-top:4px}
.ln-next .nbar{height:7px;border-radius:999px;background:rgba(255,255,255,.26);margin-top:10px;overflow:hidden}
.ln-next .nbar i{display:block;height:100%;border-radius:999px;background:#FFD93D}
.ln-next .ngo{flex:none;width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem}

/* 今日三任务：一条细带，不是一张卡 */
.ln-tasks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 2px 0;
  font-size:.76rem;color:#5A6274}
.ln-tasks .tt{background:rgba(255,255,255,.85);border:1px solid #E9EEF6;
  border-radius:999px;padding:7px 11px;min-height:34px;display:inline-flex;align-items:center}
.ln-tasks .done{color:#3D7A4B;background:#F0FAF2;border-color:#CFE9D6;font-weight:700}

.ln-review{margin-top:14px;padding:12px 14px;gap:10px}

.ln-group{margin:24px 0 10px;font-size:.74rem;font-weight:800;color:#6B7385;letter-spacing:2px}
.ln-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ln-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 16px 16px;
  background:#fff;border:1px solid #E9EEF6;border-radius:20px;box-shadow:0 2px 8px rgba(24,39,75,.05);
  cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .15s;min-height:132px}
.ln-card:active{transform:scale(.985)}
.ln-card .ce{font-size:34px;line-height:1.1;margin-bottom:6px}
.ln-card .cn{font-size:1.02rem;font-weight:800}
.ln-card .cd{font-size:.75rem;color:#6B7385;line-height:1.5;margin-top:2px}
.ln-card .cp{margin-top:auto;padding-top:10px;font-size:.72rem;font-weight:700;color:#4B5468;
  display:flex;align-items:center;gap:6px;width:100%}
.ln-card .cb{flex:1;height:6px;border-radius:999px;background:#EEF2F8;overflow:hidden}
.ln-card .cb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4EC5F1,#6BCB77)}
.ln-card .cgo{color:#A9B2C3;font-size:1rem}
@media (max-width:720px){
  .ln-hero{margin-top:0}
  .ln-avatar{width:48px;height:48px;font-size:27px;border-radius:16px}
  .ln-next{padding:17px 15px;border-radius:20px;gap:11px}
  .ln-next .ne{font-size:38px}
  .ln-next .nb b{font-size:1.04rem}
  .ln-grid{gap:10px}
  .ln-card{padding:15px 13px 13px;border-radius:18px;min-height:124px}
  .ln-card .ce{font-size:30px;margin-bottom:4px}
  .ln-card .cn{font-size:.96rem}
  .ln-card .cd{font-size:.71rem}
}
@media (max-width:340px){
  .ln-grid{grid-template-columns:1fr}
  .ln-card{min-height:0;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
  .ln-card .ce{margin:0}
  .ln-card .cp{width:auto;flex:1 1 100%;padding-top:6px}
}
</style>
</head>
<body>
  <div id="bootLoader" style="position:fixed;inset:0;background:#E8F4FD;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:12px;transition:opacity .3s">
    <div style="font-size:52px">🐤</div>
    <div style="font-size:.9rem;color:#3F4658;font-weight:700">加载中，请稍等…</div>
  </div>
<main>
  <div id="app">
    <div class="ln-hero">
      <button type="button" class="ln-avatar" id="lnAvatar" onclick="openProfileModal()" aria-label="我的档案">🐤</button>
      <div class="ln-who">
        <b id="lnHello">👋 小朋友</b>
        <span id="lnMeta">正在读取进度…</span>
      </div>
    </div>

    <button type="button" class="ln-next" id="lnNext">
      <span class="ne" id="lnNextE" aria-hidden="true">🏘️</span>
      <span class="nb">
        <b id="lnNextT">继续学习</b>
        <span id="lnNextS"></span>
        <span class="nbar"><i id="lnNextBar" style="width:0%"></i></span>
      </span>
      <span class="ngo" aria-hidden="true">▶</span>
    </button>

    <div class="ln-tasks" id="lnTasks"></div>
    <div class="card review-banner ln-review" id="lnReview" style="display:none">
      <div style="font-size:30px">🔔</div>
      <div style="flex:1;min-width:150px"><b>有单词到复习时间啦</b>
        <div style="font-size:.8rem;color:#3F4658" id="lnReviewText"></div></div>
      <button class="btn coral" onclick="location.href='words.html?mode=review'">去复习</button>
    </div>

    <div class="ln-group">主课</div>
    <div class="ln-grid" id="lnMain"></div>
    <div class="ln-group">课本与表达</div>
    <div class="ln-grid" id="lnMore"></div>
    <div style="text-align:center;margin-top:22px;font-size:.75rem"><a href="disclaimer.html" style="color:#4A5162">📋 免责声明 · 隐私政策 · 使用条款</a></div>
  </div>
</main>

<script src="js/words-data.js?v=48"></script>
<script src="js/data.js?v=48"></script>
<script src="js/shell.js?v=1"></script>
<script src="js/app.js?v=197"></script>
<script src="js/getsmart-data.js?v=19"></script>
<script>
renderNav('learn'); renderDecor();

(function () {
  const p = Profiles.active(), g = myGrade();
  const wDone = cumMasteredCount(), wAll = cumWordCount();
  const grDone = grammarDoneCount(), grAll = GRAMMAR_LEVELS.length;
  const lN = letterCount();

  /* 顶部档案 */
  document.getElementById('lnAvatar').textContent = p.avatar || '🐤';
  document.getElementById('lnHello').textContent = '👋 ' + (p.name || '小朋友');
  const fresh = (!p.name || p.name === '小朋友') && !p.grade;
  document.getElementById('lnMeta').innerHTML = fresh
    ? `还没建档 · <a href="parents.html">去「我的」起个名字 →</a>`
    : `${g.name} · 🔥 ${Store.d.streak.count} 天 · ⭐ ${Store.d.stars} · ` +
      `<a href="parents.html">我的报告 →</a>`;

  /* 唯一主操作：按「下一步该做什么」决定，不铺满入口 */
  const lettersFinished = Store.d.lettersSkip || lN >= 26;
  const nextLetter = (!lettersFinished && lN > 0) ? LETTERS.find(l => !Store.d.letters[l.L]) : null;
  let step;
  if (wDone < wAll) step = { e:'🏘️', t:'单词闯关', s:`${g.name}词库 · 已掌握 ${wDone}/${wAll}`,
                             href:'words.html?mode=plan', now:wDone, all:wAll };
  else if (grDone < grAll) step = { e:'🚂', t:'句子工厂', s:`已通过 ${grDone}/${grAll} 关`,
                             href:'grammar.html', now:grDone, all:grAll };
  else if (nextLetter) step = { e:'🏝️', t:`学字母 ${nextLetter.L}${nextLetter.L.toLowerCase()}`,
                             s:'故事 + 拼读', href:'letters.html', now:lN, all:26 };
  else step = { e:'🎮', t:'去游戏乐园复习', s:'边玩边巩固', href:'games.html', now:0, all:0 };
  document.getElementById('lnNextE').textContent = step.e;
  document.getElementById('lnNextT').textContent = step.t;
  document.getElementById('lnNextS').textContent = step.s;
  document.getElementById('lnNextBar').style.width = (step.all ? Math.round(step.now/step.all*100) : 100) + '%';
  document.getElementById('lnNext').onclick = () => { location.href = step.href; };

  /* 今日三任务（不是导航，是打卡） */
  const tk = Store.d.daily.tasks;
  const letterOn = (typeof dailyLetterApplicable === 'function') ? dailyLetterApplicable() : (lN > 0 && lN < 26);
  const t = (on, done, label) => `<span class="tt ${on && done ? 'done' : ''}">${on ? (done ? '✅ ' : '⬜ ') : '➖ '}${label}</span>`;
  document.getElementById('lnTasks').innerHTML =
    t(letterOn, tk.letter, '学字母') + t(true, tk.words, '练单词') + t(true, tk.game, '玩游戏');

  /* 复习提醒 */
  const due = dueWords();
  if (due.length) {
    document.getElementById('lnReview').style.display = '';
    document.getElementById('lnReviewText').textContent =
      due.slice(0, 4).join('、') + (due.length > 4 ? ' 等 ' + due.length + ' 个' : '');
  }

  /* 课程地图：读书馆是主课（用户明确要求），游戏不在这里——它是一级导航 */
  const C = {
    words:   { e:'🏘️', n:'单词镇', d:`${g.name} ${wDone}/${wAll} 个词`, href:'words.html',
               now:wDone, all:wAll },
    phonics: { e:'🔤', n:'自然拼读', d:'见词能读 · 听音能写', href:'phonics.html',
               now:0, all:0, tip:'13 关，从字母音到同音异拼' },
    letters: { e:'🏝️', n:'字母岛', d:`${lN}/26 个字母`, href:'letters.html', now:lN, all:26 },
    read:    { e:'📚', n:'读书馆', d:'120 本分级读物', href:'read.html',
               now:0, all:0, tip:'从 28 词读到 212 词' },
    pep:     { e:'🏫', n:'人教课本', d:'3-6 年级逐单元同步', href:'pep.html', now:0, all:0, tip:'跟着课本一课一课过' },
    getsmart:{ e:'🎓', n:'Get Smart', d:gsLevelProgress(), href:'getsmart.html', now:0, all:0, tip:'外教课本同步' },
    grammar: { e:'🚂', n:'句子工厂', d:`已通过 ${grDone}/${grAll} 关`, href:'grammar.html', now:grDone, all:grAll },
  };
  const card = k => {
    const c = C[k];
    const pct = c.all ? Math.min(100, Math.round(c.now / c.all * 100)) : 0;
    return `<button type="button" class="ln-card" onclick="location.href='${c.href}'">
      <span class="ce" aria-hidden="true">${c.e}</span>
      <span class="cn">${c.n}</span>
      <span class="cd">${esc(c.d)}</span>
      ${c.all
        ? `<span class="cp"><span class="cb"><i style="width:${pct}%"></i></span><span>${pct}%</span><span class="cgo">›</span></span>`
        : `<span class="cp"><span style="flex:1;font-weight:600;color:#8A93A6">${esc(c.tip || '')}</span><span class="cgo">›</span></span>`}
    </button>`;
  };
  document.getElementById('lnMain').innerHTML = ['words','phonics','letters','read'].map(card).join('');
  document.getElementById('lnMore').innerHTML = ['pep','getsmart','grammar'].map(card).join('');

  maybeShowInstallHint();
})();
</script>
</body>
</html>
