<!-- ★ 2026-11-11.11（C3）首页不画任何词图（导航与岛屿用的是界面表情），
     所以不引 246KB 的 svg/word-svg.js。没图时会自动回退到表情 SVG，

<script>
renderNav('index'); renderDecor();

(function () {
  const p = Profiles.active();
  const ready = p.name !== '小朋友' || p.grade;
  if (ready) { showHome(); return; }
  document.getElementById('welcome').style.display = '';
  document.getElementById('home').style.display = 'none';
  let pick = '🐤', grade = 'g1';
  const selectAvatar = b => {
    document.querySelectorAll('#introAvatars .avatar-chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); pick = b.dataset.a; sfx.pop();
  };
  document.getElementById('introAvatars').innerHTML = AVATARS.map(a => avatarChipHtml(a, a === pick)).join('');
  document.querySelectorAll('#introAvatars .avatar-chip').forEach(b =>
    b.onclick = () => {
      const wasLocked = !!b.dataset.price;
      avatarTap(b); // 带星星的头像会先走解锁流程
      if (wasLocked && b.dataset.price) return; // 星不够或取消了，不选中
      selectAvatar(b);
    });
  document.getElementById('introGrade').innerHTML = GRADES.map(g =>
    `<button data-g="${g.id}" class="${g.id===grade?'on':''}">${g.emoji}${g.name}</button>`).join('');
  document.querySelectorAll('#introGrade button').forEach(b =>
    b.onclick = () => { document.querySelectorAll('#introGrade button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); grade=b.dataset.g; sfx.pop(); });
  window.saveIntro = function () {
    const name = (document.getElementById('myName').value || '').trim() || '小朋友';
    Profiles.updateActive({ name, avatar: pick });
    setGrade(grade, true);
    sfx.win(); confetti();
    setTimeout(() => location.reload(), 700);
  };
})();

function showHome() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('home').style.display = '';
  const p = Profiles.active();
  document.getElementById('helloLine').innerHTML =
    `👋 <b>${esc(p.name)}</b> · <a id="gradeLink" title="点击切换年级">🎓${myGrade().name}</a> · 🔥${Store.d.streak.count}天 · ⭐${Store.d.stars}`;
  document.getElementById('gradeLink').onclick = openProfileModal;

  /* 推荐逻辑：单词闯关是绝对主线——字母小朋友基本都会，不再主动推。
     主卡顺序：单词 → 句子工厂 → 学字母（仅「自己已经开始学」的孩子）→ 游戏。
     「正在学字母」= 自己在字母岛学过 1-25 个，且没点过「我会字母了」。 */
  const letterN = letterCount();
  const lettersFinished = Store.d.lettersSkip || letterN >= 26;
  const inLettersPhase = !lettersFinished && letterN > 0;
  const nextLetter = inLettersPhase ? LETTERS.find(l => !Store.d.letters[l.L]) : null;
  const gradeDone = cumMasteredCount(), gradeAll = cumWordCount();
  let step;
  if (gradeDone < gradeAll) step = { e:'🏘️', t:'单词闯关', s:`${myGrade().name}词库：已掌握 ${gradeDone}/${gradeAll}`, href:'words.html?mode=plan', now:gradeDone, all:gradeAll };
  else if (grammarDoneCount() < GRAMMAR_LEVELS.length) step = { e:'🏭', t:'句子工厂闯关', s:`已通过 ${grammarDoneCount()}/${GRAMMAR_LEVELS.length} 关`, href:'grammar.html', now:grammarDoneCount(), all:GRAMMAR_LEVELS.length };
  else if (nextLetter) step = { e:'🏝️', t:`学字母 ${nextLetter.L}${nextLetter.L.toLowerCase()}`, s:`${nextLetter.shape} · 故事+拼读`, href:'letters.html', now:letterN, all:26 };
  else step = { e:'🎡', t:'去游戏乐园复习', s:'边玩边巩固', href:'games.html', now:0, all:0 };
  document.getElementById('mcEmoji').textContent = step.e;
  document.getElementById('mcTitle').textContent = step.t;
  document.getElementById('mcSub').textContent = step.s;
  document.getElementById('mcBar').style.width = (step.all ? Math.round(step.now/step.all*100) : 100) + '%';
  /* 主卡：既是按钮就得让键盘也能按（原来只有 onclick，Tab 走不到） */
  const mcEl = document.getElementById('mainCard');
  mcEl.onclick = () => location.href = step.href;
  mcEl.setAttribute('role', 'button');
  mcEl.setAttribute('tabindex', '0');
  mcEl.setAttribute('aria-label', step.t + '——' + step.s);
  mcEl.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.href = step.href; } };

  /* 今日任务流卡片：补课 / 复习 / 游戏三步，跟着档案走 */
  const fc = document.getElementById('gsFlowCard');
  if (fc && typeof gsFlowState === 'function') {
    try {
      const st = gsFlowState();
      /* E2：没开始时 gap/due 是「空」，原来被无条件写成 ✅，
         和标题「还没开始」同屏打架。未开始一律空框，不冒充已完成。 */
      const parts = st.started
        ? [st.gap ? '📖 补课：' + st.gap.title : '📖 补课 ✅',
           st.due > 0 ? '🔔 复习 ' + st.due + ' 词' : '🔔 复习 ✅',
           st.games > 0 ? '🎮 游戏 ✅' : '🎮 玩一局']
        : ['📖 补课 ⬜', '🔔 复习 ⬜', '🎮 玩一局 ⬜'];
      /* ★ 2026-11-11.11（E1）新档案不该被告知「已完成」：没数据时 gap 和 due
         都是「空」，原来把两个空都算成做完，于是填完名字就显示 2/3。
         现在只有 started 才计数，否则写「还没开始」。
         ★（E2）同一屏下方还有一套「今日任务（字母 / 单词 / 游戏）」，两个
         「x/3」含义不同会让人以为矛盾 —— 标题里写明这是 Get Smart 的三步。 */
      const doneN = st.started ? [!st.gap, st.due === 0, st.games > 0].filter(Boolean).length : 0;
      const head = st.started ? `Get Smart 三步 ${doneN}/3` : 'Get Smart 三步还没开始';
      fc.style.display = '';
      fc.innerHTML = `<div class="gs-catch" style="cursor:pointer" onclick="location.href='getsmart.html?flow=1'">
        <span style="font-size:30px">🚀</span>
        <div style="flex:1"><b>今天学什么？${head}</b>
        <div style="font-size:.8rem;color:#5C6273">${parts.join(' · ')}</div></div>
        <button class="btn grape">开始 ▶</button></div>`;
    } catch (e) {}
  }

  const due = dueWords();
  if (due.length) {
    document.getElementById('reviewBanner').style.display = '';
    document.getElementById('revText').textContent = due.slice(0,4).join('、') + (due.length>4?' 等 '+due.length+' 个':'');
  }

  /* 今日三任务：完成打勾，三个全完成奖励 5 颗星星 */
  const tk = Store.d.daily.tasks;
  /* ★（E1）字母这一项只在孩子真的在学字母时才算数，否则显示「选学」而不是勾选 */
  const letterOn = (typeof dailyLetterApplicable === 'function') ? dailyLetterApplicable() : (letterN > 0 && letterN < 26);
  document.getElementById('taskStrip').innerHTML =
    `<span>📋 今日任务</span>` +
    `<span class="${letterOn && tk.letter ? 'tdone' : ''}">${letterOn ? (tk.letter ? '✅ 学字母' : '⬜ 学字母') : '➖ 字母·选学'}</span>` +
    `<span class="${tk.words ? 'tdone' : ''}">${tk.words ? '✅' : '⬜'} 🏘️ 练单词</span>` +
    `<span class="${tk.game ? 'tdone' : ''}">${tk.game ? '✅' : '⬜'} 🎮 玩游戏</span>`;

  const islands = lettersFinished ? [
    { e:'🎓', n:'Get Smart', d:gsLevelProgress(), href:'getsmart.html' },
    { e:'🏫', n:'人教课本', d:'3-6 年级同步', href:'pep.html' },
    { e:'🏘️', n:'单词镇', d:cumMasteredCount()+'/'+cumWordCount(), href:'words.html' },
    { e:'🚂', n:'句子工厂', d:grammarDoneCount()+'/'+GRAMMAR_LEVELS.length, href:'grammar.html' },
    { e:'🎡', n:'游戏乐园', d:GAME_COUNT+'个游戏', href:'games.html' },
    { e:'🏝️', n:'字母岛', d:letterN+'/26', href:'letters.html' },
    { e:'👨‍👩‍👧', n:'家长中心', d:'进度报告', href:'parents.html' },
  ] : [
    /* 还没学完字母时，字母岛提到第 2 位：这是起步期每天都要进的地方。
       学完（lettersFinished）后它自动退到最后一位，让位给课本与语法。 */
    { e:'🎓', n:'Get Smart', d:gsLevelProgress(), href:'getsmart.html' },
    { e:'🏝️', n:'字母岛', d:letterN+'/26', href:'letters.html' },
    { e:'🏫', n:'人教课本', d:'3-6 年级同步', href:'pep.html' },
    { e:'🏘️', n:'单词镇', d:cumMasteredCount()+'/'+cumWordCount(), href:'words.html' },
    { e:'🚂', n:'句子工厂', d:grammarDoneCount()+'/'+GRAMMAR_LEVELS.length, href:'grammar.html' },
    { e:'🎡', n:'游戏乐园', d:GAME_COUNT+'个游戏', href:'games.html' },
    { e:'👨‍👩‍👧', n:'家长中心', d:'进度报告', href:'parents.html' },
  ];
  document.getElementById('bigIslands').innerHTML = islands.map(i =>
    `<button type="button" class="big-island" onclick="location.href='${i.href}'"><span class="bi-emoji" aria-hidden="true">${i.e}</span><b>${i.n}</b><small>${i.d}</small></button>`).join('');
  maybeShowInstallHint(); // 手机浏览器：引导「添加到主屏幕」（可永久关闭）
}
</script>
